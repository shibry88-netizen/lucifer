<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-glass="1">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#0D0C0B" />
<meta name="description" content="晨星 · LUCIFER —— 多智能体中枢。总控 Agent 统一发号施令，调度团队协作。" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<title>晨星 · LUCIFER</title>
<style>
/* =======================================================================
 * 晨星 · LUCIFER  ——  鎏金黑设计系统
 * 依据「晨星 UI 设计规范 v1.0」实现：黑是底、金是点、灰是骨，金占比 < 5%
 * ===================================================================== */

*{box-sizing:border-box}

/* ---------------- 用户可调旋钮 ---------------- */
:root{
  --accent-h:40; --accent-s:50%; --accent-l:58%;
  --radius-scale:1; --font-scale:1;
  --glass-blur:20px; --glass-alpha:.045;

  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
  --sp-5:20px; --sp-6:24px; --sp-8:32px; --sp-10:40px; --sp-12:48px;

  --r-xs:calc(6px * var(--radius-scale));
  --r-sm:calc(10px * var(--radius-scale));
  --r-md:calc(14px * var(--radius-scale));
  --r-lg:calc(18px * var(--radius-scale));
  --r-xl:calc(24px * var(--radius-scale));
  --r-full:999px;

  --dur-quick:120ms; --dur-base:180ms; --dur-slow:260ms; --dur-enter:320ms;
  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease-in-out:cubic-bezier(.40,0,.20,1);
  --ease-spring:cubic-bezier(.34,1.30,.64,1);

  --font-cn:"PingFang SC","HarmonyOS Sans SC","MiSans","Source Han Sans SC","Noto Sans SC","Microsoft YaHei UI",system-ui,sans-serif;
  --font-brand:"Cormorant Garamond","Source Han Serif SC","Noto Serif SC","Songti SC",Georgia,serif;
  --font-mono:"JetBrains Mono","Cascadia Code","SF Mono",Consolas,MiSans,ui-monospace,monospace;

  --fs-h1:calc(28px * var(--font-scale)); --lh-h1:1.25; --ls-h1:-.02em;
  --fs-h2:calc(22px * var(--font-scale)); --lh-h2:1.30; --ls-h2:-.015em;
  --fs-h3:calc(18px * var(--font-scale)); --lh-h3:1.35; --ls-h3:-.01em;
  --fs-h4:calc(16px * var(--font-scale)); --lh-h4:1.40; --ls-h4:-.005em;
  --fs-h5:calc(15px * var(--font-scale)); --lh-h5:1.45;
  --fs-h6:calc(14px * var(--font-scale)); --lh-h6:1.50;
  --fs-body:calc(15px * var(--font-scale)); --lh-body:1.75;
  --fs-ui:calc(14px * var(--font-scale)); --lh-ui:1.55;
  --fs-cap:calc(12px * var(--font-scale)); --lh-cap:1.50; --ls-cap:.02em;
  --fs-micro:calc(11px * var(--font-scale)); --lh-micro:1.40; --ls-micro:.04em;
  --fs-code:calc(13px * var(--font-scale)); --lh-code:1.65;
  --fs-btn:calc(14px * var(--font-scale)); --fw-btn:600; --ls-btn:.02em;
  --fs-tag:calc(11px * var(--font-scale)); --ls-tag:.06em;
}

/* ---------------- 暗金（默认） ---------------- */
[data-theme="dark"]{
  --bg-0:#0E0D0B; --bg-1:#181613; --bg-2:#221F1B; --bg-3:#2C2823;
  --glass-bg:rgba(255,244,217,var(--glass-alpha));
  --glass-filter:blur(var(--glass-blur)) saturate(140%);
  --line-subtle:rgba(233,216,178,.10);
  --line-default:rgba(233,216,178,.17);
  --line-strong:rgba(217,190,132,.38);
  --line-gold:rgba(217,190,132,.45);
  --text-1:#F6F2E9; --text-2:#C0B8AA; --text-3:#8D8475; --text-on-gold:#1A1408;
  --gold-100:#F0E2BC; --gold-200:#E2CC96; --gold-300:#D9BE84; --gold-400:#C9A45C;
  --gold-500:#B9934A; --gold-600:#A8823D; --gold-700:#8C6E33; --gold-800:#5C4922;
  --accent:var(--gold-400); --accent-hover:var(--gold-300); --accent-active:var(--gold-600);
  --gold-grad:linear-gradient(135deg,#8C6E33 0%,#C9A45C 26%,#E7D4A4 50%,#C9A45C 74%,#8C6E33 100%);
  --gold-grad-matte:linear-gradient(135deg,#A8823D 0%,#C9A45C 46%,#B9934A 100%);
  --success:#6FB68A; --success-bg:rgba(111,182,138,.12);
  --warning:#E0A24A; --warning-bg:rgba(224,162,74,.12);
  --danger:#E06B5E;  --danger-bg:rgba(224,107,94,.12);
  --info:#7FA6D9;    --info-bg:rgba(127,166,217,.12);
  --shadow-sm:0 1px 2px rgba(0,0,0,.40);
  --shadow-md:0 4px 12px rgba(0,0,0,.36),0 1px 2px rgba(0,0,0,.32);
  --shadow-lg:0 12px 32px rgba(0,0,0,.44),0 2px 8px rgba(0,0,0,.30);
  --shadow-gold:0 0 0 1px rgba(201,164,92,.22),0 8px 28px rgba(201,164,92,.10);
  --glow-gold:0 0 20px rgba(201,164,92,.18);
  --scrim:rgba(8,7,5,.62);
  --code-bg:#0A0908;
}
/* ---------------- 亮白（白金） ---------------- */
[data-theme="light"]{
  --bg-0:#FAF7F2; --bg-1:#FFFFFF; --bg-2:#F4F0E8; --bg-3:#ECE7DC;
  --glass-bg:rgba(255,255,255,.62);
  --glass-filter:blur(var(--glass-blur)) saturate(160%);
  --line-subtle:rgba(28,22,10,.06);
  --line-default:rgba(28,22,10,.10);
  --line-strong:rgba(140,110,51,.28);
  --line-gold:rgba(140,110,51,.45);
  --text-1:#1A1712; --text-2:#6A6255; --text-3:#9C9384; --text-on-gold:#FFF9EC;
  --gold-100:#E7D4A4; --gold-200:#D9BE84; --gold-300:#C9A45C; --gold-400:#B9934A;
  --gold-500:#A8823D; --gold-600:#8C6E33; --gold-700:#75592A; --gold-800:#5C4922;
  --accent:var(--gold-500); --accent-hover:var(--gold-600); --accent-active:var(--gold-700);
  --gold-grad:linear-gradient(135deg,#8C6E33 0%,#A8823D 30%,#C9A45C 55%,#A8823D 78%,#8C6E33 100%);
  --gold-grad-matte:linear-gradient(135deg,#A8823D 0%,#BE9650 46%,#A8823D 100%);
  --success:#2F7A55; --success-bg:rgba(47,122,85,.10);
  --warning:#B26A16; --warning-bg:rgba(178,106,22,.10);
  --danger:#C23B32;  --danger-bg:rgba(194,59,50,.10);
  --info:#2F5FA8;    --info-bg:rgba(47,95,168,.10);
  --shadow-sm:0 1px 2px rgba(28,22,10,.06);
  --shadow-md:0 4px 12px rgba(28,22,10,.08),0 1px 2px rgba(28,22,10,.05);
  --shadow-lg:0 12px 32px rgba(28,22,10,.12),0 2px 8px rgba(28,22,10,.06);
  --shadow-gold:0 0 0 1px rgba(140,110,51,.18),0 8px 24px rgba(140,110,51,.12);
  --glow-gold:0 0 18px rgba(168,130,61,.14);
  --scrim:rgba(250,247,242,.72);
  --code-bg:#2A261F;
}
/* 自定义主色（--accent-h/s/l 由设置页写入） */
html[data-custom-accent="1"]{
  --gold-400:hsl(var(--accent-h) var(--accent-s) var(--accent-l));
  --gold-300:hsl(var(--accent-h) var(--accent-s) calc(var(--accent-l) + 9%));
  --gold-500:hsl(var(--accent-h) var(--accent-s) calc(var(--accent-l) - 7%));
  --gold-600:hsl(var(--accent-h) var(--accent-s) calc(var(--accent-l) - 13%));
  --gold-700:hsl(var(--accent-h) var(--accent-s) calc(var(--accent-l) - 20%));
  --accent:var(--gold-400); --accent-hover:var(--gold-300); --accent-active:var(--gold-600);
  --gold-grad:linear-gradient(135deg,
    hsl(var(--accent-h) var(--accent-s) calc(var(--accent-l) - 20%)) 0%,
    hsl(var(--accent-h) var(--accent-s) var(--accent-l)) 26%,
    hsl(var(--accent-h) calc(var(--accent-s) + 14%) calc(var(--accent-l) + 20%)) 50%,
    hsl(var(--accent-h) var(--accent-s) var(--accent-l)) 74%,
    hsl(var(--accent-h) var(--accent-s) calc(var(--accent-l) - 20%)) 100%);
  --gold-grad-matte:linear-gradient(135deg,
    hsl(var(--accent-h) var(--accent-s) calc(var(--accent-l) - 13%)) 0%,
    hsl(var(--accent-h) var(--accent-s) var(--accent-l)) 46%,
    hsl(var(--accent-h) var(--accent-s) calc(var(--accent-l) - 7%)) 100%);
}

/* ---------------- 基础 ---------------- */
html,body{height:100%;margin:0}
body{
  background:var(--bg-0); color:var(--text-1); font-family:var(--font-cn);
  font-size:var(--fs-ui); line-height:var(--lh-ui);
  font-variant-numeric:tabular-nums; overflow:hidden;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  transition:background var(--dur-slow) var(--ease-out), color var(--dur-slow) var(--ease-out);
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{
  font-family:inherit;font-size:var(--fs-ui);color:var(--text-1);
  background:var(--bg-2);border:1px solid var(--line-default);
  border-radius:var(--r-sm);padding:9px 12px;outline:none;width:100%;
  transition:border-color var(--dur-base) var(--ease-out),box-shadow var(--dur-base) var(--ease-out);
}
input:focus,textarea:focus,select:focus{
  border-color:var(--line-gold);box-shadow:0 0 0 3px rgba(201,164,92,.14);
}
input::placeholder,textarea::placeholder{color:var(--text-3)}
textarea{resize:vertical;line-height:1.7}
select option{background:var(--bg-2);color:var(--text-1)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code{font-family:var(--font-mono);font-variant-ligatures:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-default);border-radius:10px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--line-strong);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
::selection{background:rgba(201,164,92,.30)}

/* 背景薄光（可关） */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;display:block;border-radius:50%;filter:blur(90px);opacity:.5;will-change:transform;animation:drift 40s var(--ease-out) infinite alternate}
.aurora i:nth-child(1){width:46vw;height:46vw;left:-10vw;top:-14vw;background:radial-gradient(circle at 35% 35%,rgba(201,164,92,.42),transparent 68%)}
.aurora i:nth-child(2){width:40vw;height:40vw;right:-8vw;bottom:-16vw;background:radial-gradient(circle at 50% 50%,rgba(140,110,51,.34),transparent 70%);animation-duration:52s;animation-delay:-12s}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(3vw,2vw,0) scale(1.12)}100%{transform:translate3d(-2vw,4vw,0) scale(1.04)}}
body.no-aurora .aurora{display:none}
[data-theme="light"] .aurora i{opacity:.34}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.03;mix-blend-mode:overlay;
  background-image:radial-gradient(rgba(255,255,255,.9) .5px,transparent .5px);background-size:3px 3px}

/* ---------------- 玻璃面 ---------------- */
.glass{
  position:relative;
  background:var(--glass-bg);
  -webkit-backdrop-filter:var(--glass-filter);
  backdrop-filter:var(--glass-filter);
  border:1px solid var(--line-default);
}
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(130% 90% at 10% -20%,rgba(255,246,224,.10),transparent 60%);
}
html[data-glass="0"] .glass{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg-1)}
html[data-glass="0"] .glass::before{display:none}

/* ---------------- 金字工具类 ---------------- */
.gold-text{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
@supports not ((-webkit-background-clip:text) or (background-clip:text)){.gold-text{color:var(--accent);background:none}}
.gold-edge{
  border:1px solid transparent;
  background:linear-gradient(var(--bg-2),var(--bg-2)) padding-box,
             linear-gradient(135deg,rgba(217,190,132,.42) 0%,rgba(201,164,92,.10) 42%,rgba(217,190,132,.32) 100%) border-box;
}
[data-theme="light"] .gold-edge{
  background:linear-gradient(var(--bg-2),var(--bg-2)) padding-box,
             linear-gradient(135deg,rgba(140,110,51,.34) 0%,rgba(140,110,51,.08) 42%,rgba(140,110,51,.26) 100%) border-box;
}

/* ---------------- 布局 ---------------- */
.app{position:relative;z-index:2;display:flex;height:100vh;overflow:hidden}
.side{
  width:264px;min-width:264px;background:var(--bg-1);
  border-right:1px solid var(--line-subtle);display:flex;flex-direction:column;
  transition:margin-left 220ms var(--ease-in-out);contain:layout;
}
.app.collapsed .side{margin-left:-264px}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:transparent}
.side-mask{display:none}
.tabbar{display:none}

/* ---------------- 侧栏 ---------------- */
.side-head{padding:var(--sp-3) var(--sp-3) var(--sp-2);display:flex;align-items:center;gap:10px}
.logo{
  width:34px;height:34px;border-radius:var(--r-xs);flex:0 0 auto;
  display:grid;place-items:center;
  background:linear-gradient(140deg,rgba(201,164,92,.16),rgba(201,164,92,.05));
  border:1px solid var(--line-strong);
}
.logo svg{width:19px;height:19px;display:block;animation:starGlow 6s linear infinite}
@keyframes starGlow{0%,100%{opacity:.62}50%{opacity:.92}}
.brand b{display:block;font-family:var(--font-brand);font-size:17px;font-weight:600;letter-spacing:.14em;line-height:1.2}
.brand span{display:block;font-size:var(--fs-micro);color:var(--text-3);letter-spacing:.22em;text-transform:uppercase;margin-top:2px;font-family:var(--font-mono)}
.side-search{padding:0 var(--sp-3) var(--sp-2)}
.side-search input{height:34px;padding:0 10px 0 12px;font-size:var(--fs-cap);border-radius:var(--r-sm);background:var(--bg-0);border-color:var(--line-subtle)}
.side-scroll{flex:1;overflow-y:auto;padding-bottom:var(--sp-2)}
.side-label{
  padding:10px var(--sp-3) 4px;font-size:var(--fs-tag);color:var(--text-3);
  letter-spacing:var(--ls-tag);text-transform:uppercase;
  display:flex;align-items:center;justify-content:space-between;
}
.side-label button{font-size:16px;line-height:1;color:var(--text-3);padding:0 6px;border-radius:var(--r-xs);transition:color var(--dur-quick)}
.side-label button:hover{color:var(--accent)}
.agent-item,.topic-item{
  display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;margin:1px var(--sp-2);
  border-radius:var(--r-xs);cursor:pointer;position:relative;overflow:hidden;
  transition:background var(--dur-base) var(--ease-out),color var(--dur-base) var(--ease-out);
}
.agent-item:hover,.topic-item:hover{background:rgba(201,164,92,.08)}
.agent-item.on,.topic-item.on{background:rgba(201,164,92,.12);box-shadow:inset 2px 0 0 var(--accent)}
.agent-item.on .nm,.topic-item.on .tt{color:var(--accent)}
.agent-item .meta,.topic-item .meta{min-width:0;flex:1}
.agent-item .nm,.topic-item .tt{font-size:var(--fs-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent-item .rl,.topic-item .rl{font-size:var(--fs-micro);color:var(--text-3);font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topic-item{height:34px}
.topic-item .tt{font-size:var(--fs-cap)}
.topic-item .x{opacity:0;font-size:14px;color:var(--text-3);padding:0 2px;transition:opacity var(--dur-quick)}
.topic-item:hover .x{opacity:1}
.topic-item .x:hover{color:var(--danger)}
.side-foot{border-top:1px solid var(--line-subtle);padding:var(--sp-2);display:flex;flex-direction:column;gap:2px}
.side-foot button{
  width:100%;display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;
  border-radius:var(--r-xs);font-size:var(--fs-ui);color:var(--text-2);
  transition:background var(--dur-base) var(--ease-out),color var(--dur-base) var(--ease-out);
}
.side-foot button:hover{background:rgba(201,164,92,.08);color:var(--text-1)}
.side-foot .ico{width:18px;text-align:center;font-size:15px}

/* ---------------- 头像 ---------------- */
.av{
  width:28px;height:28px;border-radius:50%;flex:0 0 auto;object-fit:cover;display:grid;place-items:center;
  font-size:13px;background:linear-gradient(150deg,#3A342B,#2B3238);
  border:1.5px solid rgba(217,190,132,.5);overflow:hidden;
}
.av.lg{width:34px;height:34px;font-size:15px}
.av.sm{width:22px;height:22px;font-size:11px;border-width:1px}
.av.xs{width:18px;height:18px;font-size:9px;border-width:1px}
.av.main-ring{box-shadow:0 0 0 2px rgba(201,164,92,.22)}

/* ---------------- 顶栏 ---------------- */
.top{
  height:56px;min-height:56px;display:flex;align-items:center;gap:10px;
  padding:0 var(--sp-4);background:var(--glass-bg);
  -webkit-backdrop-filter:var(--glass-filter);backdrop-filter:var(--glass-filter);
  border-bottom:1px solid var(--line-subtle);position:relative;z-index:20;
}
html[data-glass="0"] .top{backdrop-filter:none;background:var(--bg-1)}
.icon-btn{
  width:32px;height:32px;border-radius:var(--r-xs);display:grid;place-items:center;
  font-size:17px;color:var(--text-2);flex:0 0 auto;
  transition:background var(--dur-base) var(--ease-out),color var(--dur-base) var(--ease-out),transform var(--dur-base) var(--ease-out);
}
.icon-btn:hover{background:rgba(201,164,92,.08);color:var(--text-1);transform:translateY(-1px)}
.icon-btn:active{transform:translateY(0) scale(.96)}
.burger i{display:block;width:16px;height:1.5px;border-radius:2px;background:currentColor;margin:2.5px 0;transition:width var(--dur-base) var(--ease-out)}
.burger:hover i:nth-child(1),.burger:hover i:nth-child(3){width:11px}
.top-info{min-width:0;flex:1}
.top-info .t1{font-size:var(--fs-ui);display:flex;align-items:center;gap:7px}
.top-info .t2{font-size:var(--fs-micro);color:var(--text-3);font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.top-actions{display:flex;gap:8px;align-items:center}

/* ---------------- 按钮 ---------------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:36px;padding:0 16px;border-radius:var(--r-sm);
  font-size:var(--fs-btn);font-weight:var(--fw-btn);letter-spacing:var(--ls-btn);
  color:var(--text-1);white-space:nowrap;
  background:rgba(201,164,92,.06);border:1px solid rgba(201,164,92,.18);
  transition:background var(--dur-base) var(--ease-out),border-color var(--dur-base) var(--ease-out),
             transform var(--dur-base) var(--ease-out),filter var(--dur-base) var(--ease-out);
}
.btn:hover{background:rgba(201,164,92,.10);border-color:var(--line-strong);transform:translateY(-1px)}
.btn:active{transform:translateY(0);background:rgba(201,164,92,.14)}
.btn.pri{
  color:var(--text-on-gold);border-color:rgba(233,216,178,.38);
  background:var(--gold-grad-matte);
  box-shadow:inset 0 1px 0 rgba(255,246,224,.42),inset 0 -1px 0 rgba(90,66,22,.45),0 6px 18px rgba(201,164,92,.18);
}
.btn.pri:hover{filter:brightness(1.06)}
.btn.pri:active{filter:brightness(.95);box-shadow:inset 0 2px 4px rgba(60,42,10,.35)}
.btn.danger{color:var(--danger);background:var(--danger-bg);border-color:rgba(224,107,94,.3)}
.btn.danger:hover{background:rgba(224,107,94,.18)}
.btn.sm{height:28px;padding:0 10px;font-size:var(--fs-cap);border-radius:var(--r-xs)}
.btn:disabled{opacity:.42;pointer-events:none}
.btn.fix{flex:0 0 auto}
.btn.full{width:100%}
.btn.block{width:100%;margin-bottom:var(--sp-2)}

/* ---------------- 通用 ---------------- */
.body{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;scroll-behavior:smooth}
.kv{font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--text-3)}
.kv.pad{padding:6px 14px}
.dim{color:var(--text-3)}
.mt{margin-top:var(--sp-3)}
.tag{
  display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:var(--r-full);
  font-size:var(--fs-tag);letter-spacing:var(--ls-tag);color:var(--text-3);
  background:rgba(201,164,92,.07);border:1px solid var(--line-default);white-space:nowrap;
}
.tag.main{color:var(--accent);border-color:var(--line-strong);background:rgba(201,164,92,.12)}
.tag.ok{color:var(--success);border-color:rgba(111,182,138,.3);background:var(--success-bg)}
.tag.warn{color:var(--warning);border-color:rgba(224,162,74,.3);background:var(--warning-bg)}
.tag.err{color:var(--danger);border-color:rgba(224,107,94,.3);background:var(--danger-bg)}
.spin{width:12px;height:12px;border:1.5px solid var(--line-strong);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.caret{display:inline-block;width:3px;height:1em;background:var(--accent);vertical-align:-2px;border-radius:1px;animation:breathe 1.4s var(--ease-in-out) infinite}
@keyframes breathe{0%,100%{opacity:.3}50%{opacity:.95}}

/* ---------------- 对话 ---------------- */
.msgs{max-width:880px;margin:0 auto;padding:var(--sp-6) var(--sp-6) var(--sp-2);width:100%}
.msg{display:flex;gap:10px;margin-bottom:var(--sp-5);align-items:flex-start;animation:rise 220ms var(--ease-out) both}
@keyframes rise{from{opacity:0;transform:translate3d(0,8px,0)}to{opacity:1;transform:none}}
.msg .bd{min-width:0;flex:1;max-width:84%}
.msg .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.msg .hd b{font-size:var(--fs-h6);font-weight:600}
.prose{font-size:var(--fs-body);line-height:var(--lh-body);letter-spacing:.01em;word-break:break-word;overflow-wrap:anywhere}
.prose p{margin:0 0 10px}
.prose p:last-child{margin-bottom:0}
.prose h1,.prose h2,.prose h3,.prose h4,.prose h5,.prose h6{margin:16px 0 8px;font-weight:600;line-height:var(--lh-h5)}
.prose h1{font-size:var(--fs-h3)}.prose h2{font-size:var(--fs-h4)}
.prose h3,.prose h4,.prose h5,.prose h6{font-size:var(--fs-h5)}
.prose ul,.prose ol{margin:0 0 10px;padding-left:22px}
.prose li{margin:4px 0}
.prose blockquote{margin:0 0 10px;padding:2px 0 2px 13px;border-left:2px solid var(--line-strong);color:var(--text-2)}
.prose hr{border:0;border-top:1px solid var(--line-subtle);margin:16px 0}
.prose strong{font-weight:600;color:var(--text-1)}
.prose code.ic{background:rgba(201,164,92,.12);padding:1px 5px;border-radius:var(--r-xs);font-size:.92em;color:var(--accent)}
.prose pre.code{margin:0 0 10px;background:var(--code-bg);border:1px solid var(--line-default);border-radius:var(--r-sm);overflow:hidden}
.prose pre.code .bar{display:flex;justify-content:space-between;align-items:center;padding:5px 12px;background:rgba(201,164,92,.05);border-bottom:1px solid var(--line-subtle);font-size:var(--fs-micro);color:var(--text-3);font-family:var(--font-mono)}
.prose pre.code .bar button{font-size:var(--fs-micro);color:var(--text-3);transition:color var(--dur-quick)}
.prose pre.code .bar button:hover{color:var(--accent)}
.prose pre.code code{display:block;padding:12px 14px;overflow-x:auto;font-size:var(--fs-code);line-height:var(--lh-code);color:#E8E0CE}
[data-theme="light"] .prose pre.code code{color:#F3EEE4}
.msg.user{flex-direction:row-reverse}
.msg.user .bd{flex:0 1 auto;max-width:78%}
.msg.user .prose{
  background:linear-gradient(135deg,rgba(201,164,92,.16),rgba(201,164,92,.08));
  border:1px solid rgba(201,164,92,.26);
  border-radius:var(--r-lg);border-bottom-right-radius:var(--r-xs);padding:12px 16px;
}

/* 系统回执 */
.msg-sys{margin:-8px 0 var(--sp-5)}
.msg-sys .op{border-style:dashed;background:transparent}
.msg-sys .oh{font-size:var(--fs-cap);color:var(--text-3)}

/* 指令卡片 */
.ops{margin-top:12px;display:flex;flex-direction:column;gap:8px;max-width:640px}
.op{
  border:1px solid transparent;border-radius:var(--r-md);overflow:hidden;
  background:linear-gradient(var(--bg-2),var(--bg-2)) padding-box,
             linear-gradient(135deg,rgba(217,190,132,.32),rgba(201,164,92,.08) 50%,rgba(217,190,132,.22)) border-box;
  transition:transform var(--dur-base) var(--ease-out),box-shadow var(--dur-base) var(--ease-out);
}
[data-theme="light"] .op{
  background:linear-gradient(var(--bg-2),var(--bg-2)) padding-box,
             linear-gradient(135deg,rgba(140,110,51,.26),rgba(140,110,51,.06) 50%,rgba(140,110,51,.18)) border-box;
}
.op:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.op .oh{min-height:44px;padding:0 14px;display:flex;align-items:center;gap:10px;font-size:var(--fs-ui);cursor:pointer;user-select:none;transition:background var(--dur-base)}
.op .oh:hover{background:rgba(201,164,92,.06)}
.op .oh .oi{opacity:.75;font-size:13px;color:var(--accent)}
.op .oh .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2)}
.op .oh .chev{color:var(--text-3);font-size:14px;transition:transform var(--dur-base) var(--ease-out)}
.op.open .oh .chev{transform:rotate(180deg)}
.op .ob{display:grid;grid-template-rows:0fr;transition:grid-template-rows 220ms var(--ease-out),opacity 220ms var(--ease-out);opacity:0;padding:0 14px}
.op.open .ob{grid-template-rows:1fr;opacity:1;padding:12px 14px 14px;border-top:1px solid var(--line-subtle)}
.op .ob>*{overflow:hidden;min-height:0}
.op .ob .prose{font-size:var(--fs-cap);line-height:1.7}
.op .ob .kv{margin-bottom:2px}

/* 文档卡片 */
.doc-card{
  display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 14px;
  border:1px solid var(--line-default);border-radius:var(--r-sm);
  background:var(--bg-2);max-width:420px;cursor:pointer;text-align:left;width:100%;
  transition:transform var(--dur-base) var(--ease-out),border-color var(--dur-base) var(--ease-out),box-shadow var(--dur-base) var(--ease-out);
}
.doc-card:hover{transform:translateY(-1px);border-color:var(--line-strong);box-shadow:var(--shadow-md)}
.doc-card .dic{width:36px;height:36px;border-radius:var(--r-xs);flex:0 0 auto;display:grid;place-items:center;
  background:rgba(201,164,92,.12);color:var(--accent);font-size:16px}
.doc-card .dtt{font-size:var(--fs-h6);font-weight:600;margin-bottom:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.doc-card .dmt{font-size:var(--fs-cap);color:var(--text-3);font-family:var(--font-mono)}
.doc-chip{
  display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;margin:0 6px 6px 0;
  border-radius:var(--r-full);font-size:var(--fs-cap);color:var(--text-2);cursor:pointer;
  background:rgba(201,164,92,.13);border:1px solid rgba(201,164,92,.26);
  transition:background var(--dur-base),border-color var(--dur-base);
}
.doc-chip:hover{background:rgba(201,164,92,.13);border-color:var(--line-strong);color:var(--accent)}

/* ---------------- 输入区 ---------------- */
.composer{padding:0 var(--sp-6) var(--sp-5)}
.msgs{padding-bottom:76px}
.composer-in{max-width:880px;margin:0 auto;position:relative}
.cbox{
  border-radius:var(--r-md);padding:2px 6px 2px 14px;display:flex;gap:6px;align-items:flex-end;
  background:var(--glass-bg);-webkit-backdrop-filter:var(--glass-filter);backdrop-filter:var(--glass-filter);
  border:1px solid var(--line-default);
  transition:border-color var(--dur-base) var(--ease-out),box-shadow var(--dur-base) var(--ease-out);
}
.cbox:focus-within{border-color:var(--line-gold);box-shadow:0 0 0 3px rgba(201,164,92,.14)}
.cbox textarea{flex:1;min-width:0;background:none;border:0;padding:11px 0;max-height:200px;min-height:44px;font-size:var(--fs-body);line-height:1.6;box-shadow:none;border-radius:0;overflow-wrap:anywhere}
.cbox textarea:focus{box-shadow:none;background:none;border:0}
.crow{display:flex;gap:4px;align-items:center;flex:0 0 auto;padding-bottom:6px}
.crow .icon-btn{width:32px;height:32px;border-radius:var(--r-xs);font-size:15px}
.send{
  width:32px;height:32px;border-radius:var(--r-xs);display:grid;place-items:center;font-size:15px;
  color:var(--text-on-gold);background:var(--gold-grad-matte);border:1px solid rgba(233,216,178,.38);
  box-shadow:inset 0 1px 0 rgba(255,246,224,.42),0 6px 18px rgba(201,164,92,.18);
  transition:transform var(--dur-base) var(--ease-out),filter var(--dur-base) var(--ease-out);
}
.send:hover{transform:translateY(-1px);filter:brightness(1.06)}
.send:active{transform:translateY(0)}
.send.stop{background:linear-gradient(135deg,#C2554B,#A63A31);color:#fff;border-color:rgba(255,255,255,.25)}
.send:disabled{opacity:.42}
.hint{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px;padding-left:4px;
  font-size:var(--fs-cap);color:var(--text-3)}
.hint code{background:rgba(201,164,92,.10);padding:1px 6px;border-radius:var(--r-xs);font-size:var(--fs-micro);color:var(--accent)}
.hint-toggle{font-size:var(--fs-cap);color:var(--text-3);padding:2px 8px;border-radius:var(--r-xs);border:1px solid var(--line-default);transition:all var(--dur-quick)}
.hint-toggle:hover{color:var(--text-1);border-color:var(--line-strong)}
.hint-toggle i{font-style:normal;display:inline-block;transition:transform var(--dur-base) var(--ease-out)}
.hint.show-syn .hint-toggle i{transform:rotate(180deg)}
.hint-syn{display:none;gap:10px;flex-wrap:wrap;align-items:center}
.hint.show-syn .hint-syn{display:inline-flex}

/* ---------------- 统计气泡 ---------------- */
.bubble{position:absolute;bottom:calc(100% + 16px);left:0;z-index:6;max-width:min(420px,92vw);
  border-radius:var(--r-full);overflow:hidden;
  background:var(--glass-bg);-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);
  border:1px solid var(--line-default);
  transition:border-radius var(--dur-slow) var(--ease-out),box-shadow var(--dur-slow) var(--ease-out),width var(--dur-slow) var(--ease-out);
  transform-origin:left bottom;animation:rise 260ms var(--ease-out) both;
}
.bubble.open{width:340px;border-radius:var(--r-md);box-shadow:var(--shadow-lg);-webkit-backdrop-filter:blur(24px) saturate(150%);backdrop-filter:blur(24px) saturate(150%)}
html[data-glass="0"] .bubble{background:var(--bg-1);backdrop-filter:none}
.bub-head{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;width:100%;text-align:left}
.bubble.open .bub-head{height:44px;padding:0 14px}
.bub-orb{width:12px;height:12px;flex:0 0 auto}
.bub-mini{font-size:var(--fs-micro);font-family:var(--font-mono);color:var(--text-2);white-space:nowrap}
.bub-mini b{color:var(--accent);font-weight:600}
.bub-chev{margin-left:auto;color:var(--text-3);font-size:12px;transition:transform var(--dur-slow) var(--ease-out)}
.bubble.open .bub-chev{transform:rotate(180deg)}
.bub-body{max-height:0;overflow:hidden;opacity:0;transition:max-height var(--dur-slow) var(--ease-out),opacity var(--dur-base) var(--ease-out)}
.bubble.open .bub-body{max-height:520px;opacity:1}
.bub-lbl{font-size:var(--fs-cap);color:var(--text-3);padding:0 14px 8px}
.bub-agents{display:flex;flex-direction:column;gap:2px;padding:0 14px}
.bub-chip{display:flex;align-items:center;gap:8px;height:34px;position:relative}
.bub-chip b{font-size:var(--fs-cap);font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bub-chip i{font-style:normal;font-size:var(--fs-micro);font-family:var(--font-mono);color:var(--text-3)}
.bub-chip em{font-style:normal;font-size:var(--fs-cap);font-family:var(--font-mono);color:var(--text-1);min-width:52px;text-align:right}
.bub-bar{position:absolute;left:0;bottom:0;height:2px;border-radius:var(--r-full);background:rgba(201,164,92,.55)}
.bub-sep{height:1px;background:var(--line-subtle);margin:10px 14px}
.bub-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 12px}
.bub-stat{background:rgba(201,164,92,.05);border:1px solid var(--line-subtle);border-radius:var(--r-xs);padding:8px 10px}
.bub-stat span{display:block;font-size:10px;color:var(--text-3);margin-bottom:3px}
.bub-stat b{display:block;font-size:var(--fs-h5);font-family:var(--font-mono);font-weight:600}
.bub-stat.hl b{color:var(--accent)}
.bub-foot{display:flex;justify-content:space-between;padding:0 14px 12px;font-size:var(--fs-micro);color:var(--text-3);font-family:var(--font-mono)}

/* ---------------- 表单 / 卡片 ---------------- */
.page{max-width:880px;margin:0 auto;padding:var(--sp-6) var(--sp-6) 70px;width:100%}
.page h2{margin:0 0 6px;font-size:var(--fs-h2);line-height:var(--lh-h2);letter-spacing:var(--ls-h2);font-weight:600}
.page .sub{color:var(--text-3);font-size:var(--fs-cap);margin-bottom:var(--sp-5)}
.card{background:var(--bg-1);border:1px solid var(--line-default);border-radius:var(--r-lg);padding:var(--sp-6);margin-bottom:var(--sp-4)}
.card>h3{margin:0 0 var(--sp-4);font-size:var(--fs-h5);font-weight:600;display:flex;align-items:center;gap:8px}
.fld{margin-bottom:var(--sp-3)}
.fld:last-child{margin-bottom:0}
.fld label{display:block;font-size:var(--fs-cap);color:var(--text-3);margin-bottom:6px;letter-spacing:var(--ls-cap)}
.fld .hint2{font-size:var(--fs-cap);color:var(--text-3);margin-top:6px;line-height:1.6}
.row{display:flex;gap:var(--sp-3);align-items:flex-start;flex-wrap:wrap}
.row>*{flex:1;min-width:150px}
.row .fix{flex:0 0 auto;min-width:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-subtle);margin-bottom:var(--sp-5)}
.tabs button{padding:10px 14px;font-size:var(--fs-ui);color:var(--text-3);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all var(--dur-base) var(--ease-out)}
.tabs button:hover{color:var(--text-1)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.emoji-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:8px}
.emoji-grid button{aspect-ratio:1;border-radius:var(--r-xs);font-size:16px;display:grid;place-items:center;
  background:var(--bg-2);border:1px solid var(--line-default);
  transition:transform var(--dur-base) var(--ease-out),border-color var(--dur-base)}
.emoji-grid button:hover{transform:translateY(-1px);border-color:var(--line-strong)}
.emoji-grid button.on{border-color:var(--accent);background:rgba(201,164,92,.12)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:var(--fs-cap);padding:4px 10px;border-radius:var(--r-full);
  color:var(--text-2);background:rgba(201,164,92,.06);border:1px solid var(--line-default);transition:all var(--dur-base)}
.chip:hover{border-color:var(--line-strong)}
.chip.on{border-color:var(--accent);color:var(--accent);background:rgba(201,164,92,.12)}
.empty{text-align:center;color:var(--text-3);font-size:var(--fs-cap);padding:36px 12px;border:1px dashed var(--line-default);border-radius:var(--r-sm)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);padding:14px 0;border-bottom:1px solid var(--line-subtle);min-height:56px}
.switch:last-child{border-bottom:0}
.switch .lbl{font-size:var(--fs-ui)}
.switch .dsc{font-size:var(--fs-cap);color:var(--text-3);margin-top:3px;line-height:1.5}
.tgl{width:40px;height:22px;border-radius:var(--r-full);flex:0 0 auto;position:relative;cursor:pointer;
  background:rgba(255,255,255,.10);border:1px solid var(--line-default);padding:2px;
  transition:background var(--dur-base) var(--ease-in-out),border-color var(--dur-base)}
[data-theme="light"] .tgl{background:rgba(28,22,10,.08)}
.tgl::before{content:"";position:absolute;inset:-8px}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:var(--text-2);transition:transform var(--dur-base) var(--ease-spring),background var(--dur-base)}
.tgl.on{background:var(--gold-grad-matte);border-color:var(--line-gold)}
.tgl.on::after{transform:translateX(18px);background:var(--text-on-gold)}

/* 主题色板选择 */
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.swatch{width:44px;height:44px;border-radius:var(--r-xs);border:1px solid var(--line-default);cursor:pointer;position:relative;
  transition:transform var(--dur-base) var(--ease-out),border-color var(--dur-base)}
.swatch:hover{transform:translateY(-2px)}
.swatch.on{border-color:var(--accent);box-shadow:var(--shadow-gold)}
.slider{display:flex;align-items:center;gap:12px}
.slider input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:var(--line-default);padding:0;border:0}
.slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--gold-grad-matte);border:1px solid var(--line-gold);cursor:pointer}
.slider .val{font-family:var(--font-mono);font-size:var(--fs-cap);color:var(--text-3);min-width:44px;text-align:right}

/* ---------------- 检索 ---------------- */
.search-bar{display:flex;gap:var(--sp-3);align-items:center;margin-bottom:var(--sp-4)}
.search-bar input{height:44px;font-size:var(--fs-h6)}
.search-tabs{display:flex;gap:6px;margin-bottom:var(--sp-4);flex-wrap:wrap}
.hit{padding:14px;border-radius:var(--r-sm);border:1px solid var(--line-default);background:var(--bg-1);margin-bottom:10px;cursor:pointer;
  transition:transform var(--dur-base) var(--ease-out),border-color var(--dur-base)}
.hit:hover{transform:translateY(-1px);border-color:var(--line-strong)}
.hit .h1{font-size:var(--fs-ui);font-weight:600;margin-bottom:4px}
.hit .hm{font-size:var(--fs-micro);color:var(--text-3);font-family:var(--font-mono);margin-bottom:8px}
.hit .hb{font-size:var(--fs-cap);color:var(--text-2);line-height:1.7;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hit mark{background:rgba(201,164,92,.24);color:var(--accent);border-radius:3px;padding:0 2px}

/* ---------------- 文档 ---------------- */
.docs{display:flex;height:100%}
.docs-list{width:300px;min-width:300px;background:var(--bg-1);border-right:1px solid var(--line-subtle);overflow-y:auto;padding:var(--sp-3)}
.docs-list .di{padding:8px 10px;border-radius:var(--r-xs);cursor:pointer;margin-bottom:2px;min-height:52px;
  transition:background var(--dur-base) var(--ease-out),box-shadow var(--dur-base)}
.docs-list .di:hover{background:rgba(201,164,92,.08)}
.docs-list .di.on{background:rgba(201,164,92,.12);box-shadow:inset 2px 0 0 var(--accent)}
.docs-list .di.on .t{color:var(--accent)}
.docs-list .di .t{font-size:var(--fs-ui);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.docs-list .di .m{font-size:var(--fs-micro);color:var(--text-3);font-family:var(--font-mono)}
.doc-edit{flex:1;display:flex;flex-direction:column;min-width:0}
.doc-bar{min-height:56px;padding:0 var(--sp-4);border-bottom:1px solid var(--line-subtle);display:flex;gap:var(--sp-3);align-items:center;background:var(--bg-1)}
.doc-bar input{font-size:var(--fs-h5);font-weight:600;background:none;border:0;padding:4px 0;box-shadow:none}
.doc-bar input:focus{box-shadow:none;border:0}
.doc-area{flex:1;display:flex;overflow:hidden}
.doc-area textarea{flex:1;border:0;background:none;font-family:var(--font-mono);font-size:var(--fs-code);line-height:1.9;resize:none;padding:var(--sp-8) 40px;max-width:760px;margin:0 auto;box-shadow:none}
.doc-area textarea:focus{box-shadow:none;background:none;border:0}

/* 文档抽屉 */
.drawer-scrim{position:fixed;inset:0;z-index:70;background:var(--scrim);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  opacity:0;transition:opacity var(--dur-base) var(--ease-out)}
.drawer-scrim.in{opacity:1}

/* ------------------------- 基础工具 ------------------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

const now = () => Date.now();
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function fmtTime(ts) {
  const d = new Date(ts); const p = (n) => String(n).padStart(2, '0');
  return d.getMonth() + 1 + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function relTime(ts) {
  const s = (now() - ts) / 1000;
  if (s < 60) return '刚刚';
  if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
  if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
  return Math.floor(s / 86400) + ' 天前';
}
function fmtNum(n) {
  n = n || 0;
  if (n < 1000) return String(Math.round(n));
  if (n < 1000000) return (n / 1000).toFixed(n < 10000 ? 2 : 1).replace(/\.0+$/, '') + 'k';
  return (n / 1000000).toFixed(2) + 'M';

/* ------------------------- Token 估算 ------------------------- */
/* 优先使用服务端返回的 usage；没有则按「中日韩字符≈1 token，其余≈4 字符/token」估算 */
function estimateTokens(text) {
  if (!text) return 0;
  const s = String(text);
  let cjk = 0, other = 0;
  for (const ch of s) {
    const c = ch.codePointAt(0);
    if ((c >= 0x2e80 && c <= 0x9fff) || (c >= 0xac00 && c <= 0xd7af) || (c >= 0xf900 && c <= 0xfaff) || (c >= 0xff00 && c <= 0xffef)) cjk++;
    else other++;
  }
  return Math.max(1, Math.round(cjk * 0.95 + other / 4));
}
function estimateMessages(msgs) {
  return (msgs || []).reduce((n, m) => n + estimateTokens(m.content) + 4, 0);
}

/* ------------------------- Markdown（极简渲染） ------------------------- */
function mdRender(src) {
  const codes = [];
  let s = String(src == null ? '' : src);
  s = s.replace(/```([a-zA-Z0-9_+\-.#]*)[ \t]*\r?\n?([\s\S]*?)```/g, (m, lang, code) => {
    codes.push({ lang: lang || 'text', code: code.replace(/\n$/, '') });
    return '\n\u0000C' + (codes.length - 1) + '\u0000\n';
  });
  const lines = esc(s).split(/\r?\n/);
  const inline = (t) => t
    .replace(/`([^`\n]+)`/g, '<code class="ic">$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(（])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/~~([^~\n]+)~~/g, '<del>$1</del>')
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out = []; let i = 0;
  const isPh = (L) => /^\s*\u0000C\d+\u0000\s*$/.test(L);
  const isStart = (L) => isPh(L) || /^#{1,6}\s/.test(L) || /^\s*>/.test(L) || /^\s*[-*+]\s+/.test(L) || /^\s*\d+[.)]\s+/.test(L);
  while (i < lines.length) {
    const L = lines[i]; let m;
    if (isPh(L)) {
      const idx = +L.trim().replace(/[\u0000C]/g, '');
      const c = codes[idx];
      out.push('<pre class="code"><div class="bar"><span>' + esc(c.lang) + '</span><button class="copybtn" data-idx="' + idx + '">复制</button></div><code>' + esc(c.code) + '</code></pre>');
      i++; continue;
    }
    if ((m = L.match(/^(#{1,6})\s+(.*)$/))) { out.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>'); i++; continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(L)) { out.push('<hr>'); i++; continue; }
    if (/^\s*>/.test(L)) {
      const b = []; while (i < lines.length && /^\s*>/.test(lines[i])) { b.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
      out.push('<blockquote>' + inline(b.join('<br>')) + '</blockquote>'); continue;
    }
    if (/^\s*[-*+]\s+/.test(L)) {
      const it = []; while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) { it.push(inline(lines[i].replace(/^\s*[-*+]\s+/, ''))); i++; }
      out.push('<ul>' + it.map((x) => '<li>' + x + '</li>').join('') + '</ul>'); continue;
    }
    if (/^\s*\d+[.)]\s+/.test(L)) {
      const it = []; while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) { it.push(inline(lines[i].replace(/^\s*\d+[.)]\s+/, ''))); i++; }
      out.push('<ol>' + it.map((x) => '<li>' + x + '</li>').join('') + '</ol>'); continue;
    }
    if (!L.trim()) { i++; continue; }
    const b = []; while (i < lines.length && lines[i].trim() && !isStart(lines[i])) { b.push(lines[i]); i++; }
    out.push('<p>' + inline(b.join('<br>')) + '</p>');
  }
  return out.join('');
}

const MAIN_PROMPT = `你是「总控 Agent」，一支多智能体团队的指挥官。职责：拆解目标 → 分派任务 → 汇总结果 → 沉淀文档。

/* ------------------------- 状态 ------------------------- */
const KEY = 'lucifer.state.v1';
const LEGACY_KEYS = ['agenthub.state.v2', 'agenthub.state.v1', 'lucifer.state.v0'];
function readStored() {
  try {

function load() {

const getAgent = (id) => S.agents.find((a) => a.id === id) || null;

function blankStats() {
  return { requests: 0, promptTokens: 0, completionTokens: 0, totalTokens: 0, estimated: false, agents: {}, startedAt: null, lastAt: null, ms: 0 };
}
/* 记录一次请求的用量 */
function bumpStats(topic, agent, usage, promptText, completionText, ms) {
  const st = topic.stats || (topic.stats = blankStats());
  st.requests++;
  st.startedAt = st.startedAt || now();
  st.lastAt = now();
  st.ms += ms || 0;
  let pt, ct, est = false;
  if (usage && (usage.prompt_tokens || usage.completion_tokens || usage.total_tokens)) {
    pt = usage.prompt_tokens || 0; ct = usage.completion_tokens || 0;
  } else {
    pt = estimateMessages(promptText); ct = estimateTokens(completionText); est = true;
  }
  if (est) st.estimated = true;
  st.promptTokens += pt; st.completionTokens += ct;
  st.totalTokens = st.promptTokens + st.completionTokens;
  if (agent) {
    const k = agent.id;
    if (!st.agents[k]) st.agents[k] = { name: agent.name, role: agent.roleName, avatar: agent.avatar, calls: 0, tokens: 0 };
    st.agents[k].calls++;
    st.agents[k].tokens += (pt + ct);
    st.agents[k].name = agent.name; st.agents[k].avatar = agent.avatar;
  }
  return st;
}

/* ------------------------- API ------------------------- */
function joinUrl(base, path) {
  if (!base) return '';
  let b = String(base).trim().replace(/\/+$/, '');
  if (!/^https?:\/\//i.test(b)) b = 'https://' + b;
  return b + path;
}
function apiHeaders(p) {
  const h = { 'Content-Type': 'application/json' };
  if (p.apiKey) h['Authorization'] = 'Bearer ' + p.apiKey;
  return h;
}
async function pullModels(p) {
  const url = joinUrl(p.baseUrl, '/models');
  if (!url) throw new Error('未填写 API 地址');
  const r = await fetch(url, { headers: apiHeaders(p) });
  const txt = await r.text();
  if (!r.ok) throw new Error('HTTP ' + r.status + ' · ' + txt.slice(0, 180));
  let j; try { j = JSON.parse(txt); } catch (e) { throw new Error('返回内容不是合法 JSON'); }
  const arr = j.data || j.models || j.result || [];
  const ids = arr.map((m) => (typeof m === 'string' ? m : (m.id || m.name || m.model))).filter(Boolean);
  if (!ids.length) throw new Error('接口未返回模型列表（试试手动填写模型名）');
  return ids;
}

/* 流式调用；onDelta 增量；onUsage 拿到真实用量 */
async function streamChat(agent, messages, onDelta, signal, onUsage) {
  const p = providerFor(agent);
  if (!p) throw new Error('没有可用的 API 配置，请到「设置」添加');
  if (!p.baseUrl) throw new Error('API 地址为空，请到「设置」填写');
  const model = modelFor(agent);
  if (!model) throw new Error('未选择模型，请到「设置」拉取并选择模型');
  const url = joinUrl(p.baseUrl, '/chat/completions');
  const body = {
    model, messages, stream: true, temperature: 0.6,
    stream_options: { include_usage: true },   // 支持的服务商会回传 usage
  };
  let r;
  const doFetch = () => fetch(url, { method: 'POST', headers: apiHeaders(p), body: JSON.stringify(body), signal });
  try { r = await doFetch(); }
  catch (e) {
    if (e && e.name === 'AbortError') throw e;
    throw new Error('网络请求失败：' + (e.message || e) + '（可能是 CORS 或地址不可达）');
  }
  // 少数服务商不认 stream_options，回退重试一次
  if (!r.ok && (r.status === 400 || r.status === 422)) {
    delete body.stream_options;
    try { r = await doFetch(); } catch (e2) { if (e2 && e2.name === 'AbortError') throw e2; }
  }
  if (!r.ok) { const t = await r.text().catch(() => ''); throw new Error('HTTP ' + r.status + ' · ' + t.slice(0, 300)); }
  if (!r.body || !r.body.getReader) {
    const j = await r.json();
    const txt = j.choices && j.choices[0] && j.choices[0].message ? j.choices[0].message.content || '' : '';
    if (onUsage && j.usage) onUsage(j.usage);
    if (onDelta) onDelta(txt);
    return txt;
  }
  const reader = r.body.getReader();
  const dec = new TextDecoder('utf-8');
  let buf = '', full = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const parts = buf.split('\n');
    buf = parts.pop();
    for (const line of parts) {
      const t = line.trim();
      if (!t || t.startsWith(':')) continue;
      const d = t.startsWith('data:') ? t.slice(5).trim() : t;
      if (!d || d === '[DONE]') continue;
      try {
        const j = JSON.parse(d);
        if (onUsage && j.usage) onUsage(j.usage);
        const ch = j.choices && j.choices[0];
        const c = ch && ch.delta ? ch.delta.content : (ch && ch.message ? ch.message.content : null);
        if (c) { full += c; if (onDelta) onDelta(c); }
      } catch (e) { /* 忽略分片 */ }
    }
  }
  return full;
}

/* ------------------------- 指令解析 ------------------------- */
const RE_CALL = /<call\s+agent\s*=\s*["']([^"']+)["']\s*>([\s\S]*?)<\/call>/g;
const RE_DOC = /<doc\s+op\s*=\s*["']([^"']+)["']\s*([^>]*?)(?:\/>|>([\s\S]*?)<\/doc>)/g;

function extractDirectives(text) {
  const ops = []; let m;
  RE_CALL.lastIndex = 0;
  while ((m = RE_CALL.exec(text))) ops.push({ type: 'call', agent: m[1].trim(), task: m[2].trim(), index: m.index });
  RE_DOC.lastIndex = 0;
  while ((m = RE_DOC.exec(text))) {
    const attrs = m[2] || '';
    const title = (attrs.match(/title\s*=\s*["']([^"']*)["']/) || [])[1] || '';
    ops.push({ type: 'doc', op: (m[1] || '').toLowerCase(), title: title.trim(), content: (m[3] || '').trim(), index: m.index });
  }
  ops.sort((a, b) => a.index - b.index);
  return ops;
}
function stripDirectives(text) {
  RE_CALL.lastIndex = 0; RE_DOC.lastIndex = 0;
  return String(text).replace(RE_CALL, '').replace(RE_DOC, '').replace(/\n{3,}/g, '\n\n').trim();
}

      '\n\n若需要某篇的完整正文，用 <doc op="read" title="标题"/>；查看全部标题用 <doc op="list"/>。');

    : '\n\n【云沙盒】未配置（由使用者自行添加，当前不可用）。');

function apiMessages(agent, topic, maxHist) {

  const hist = topic.messages.filter((m) => m.role === 'user' || m.role === 'assistant').slice(-(maxHist || 24));

}

function execDocOp(op) {
  const agentId = S.ui.activeAgentId;
  switch (op.op) {
    case 'create': {
      const ex = findDoc(op.title);
      if (ex) { ex.content = op.content; ex.updatedAt = now(); return '文档「' + op.title + '」已存在，已覆盖全文。'; }
      S.docs.unshift({ id: uid('d'), title: op.title || '未命名文档', content: op.content, ownerId: agentId, shared: true, updatedAt: now() });
      return '已创建文档「' + op.title + '」。';
    }
    case 'append': {
      const d = findDoc(op.title);
      if (!d) return '未找到文档「' + op.title + '」，请先用 create 创建。';
      d.content = (d.content || '') + '\n\n' + op.content; d.updatedAt = now();
      return '已向「' + op.title + '」追加内容（当前 ' + d.content.length + ' 字）。';
    }
    case 'update': {
      const d = findDoc(op.title);
      if (!d) return '未找到文档「' + op.title + '」。';
      d.content = op.content; d.updatedAt = now();
      return '已更新文档「' + op.title + '」。';
    }
    case 'read': {
      const d = findDoc(op.title);
      if (!d) return '未找到文档「' + op.title + '」。';
      return '【文档「' + d.title + '」正文】\n' + d.content;
    }
    case 'list':
      return '【文档列表】\n' + (S.docs.length ? S.docs.map((d) => '- ' + d.title + '（' + relTime(d.updatedAt) + '）').join('\n') : '（空）');
    case 'delete': {
      const d = findDoc(op.title);
      if (!d) return '未找到文档「' + op.title + '」。';
      S.docs = S.docs.filter((x) => x.id !== d.id);
      return '已删除文档「' + op.title + '」。';
    }
    default:
      return '不支持的文档操作：' + op.op;
  }
}

/* ------------------------- Skill：从 GitHub 拉取 ------------------------- */
function normalizeSkillUrl(input) {
  let u = String(input || '').trim();
  if (!u) return '';
  if (/^lobehub\.com\//i.test(u)) u = 'https://' + u;
  let m;
  if ((m = u.match(/^https?:\/\/lobehub\.com\/skills\/([^\/\s?#]+)/i))) return 'https://lobehub.com/skills/' + m[1] + '/skill.md';
  if ((m = u.match(/^https?:\/\/github\.com\/([^\/\s]+)\/([^\/\s]+)\/(?:tree|blob)\/([^\/\s]+)\/?(.*)$/i))) {
    const sub = m[4] ? m[4].replace(/\/+$/, '') + '/' : '';
    return 'https://raw.githubusercontent.com/' + m[1] + '/' + m[2] + '/' + m[3] + '/' + sub + 'SKILL.md';
  }
  if ((m = u.match(/^https?:\/\/github\.com\/([^\/\s]+)\/([^\/\s]+?)(?:\.git)?\/?$/i)))
    return 'https://raw.githubusercontent.com/' + m[1] + '/' + m[2] + '/HEAD/SKILL.md';
  return u;
}
function parseSkill(text, source) {
  let name = '', desc = '', body = text;
  const m = text.match(/^---\s*\r?\n([\s\S]*?)\r?\n---\s*\r?\n?/);
  if (m) {
    const fm = m[1]; body = text.slice(m[0].length);
    const g = (k) => { const r = fm.match(new RegExp('^' + k + '\\s*:\\s*(.+)$', 'mi')); return r ? r[1].trim().replace(/^["']|["']$/g, '') : ''; };
    name = g('name'); desc = g('description');
  }
  if (!name) {
    const h = body.match(/^#\s+(.+)$/m);
    name = (h ? h[1] : (source || '').split('/').pop() || 'skill').trim();
  }
  return { id: uid('sk'), name, desc, source, content: text, addedAt: now() };
}
async function fetchSkill(url) {
  const r = await fetch(url, { headers: { Accept: 'text/plain,*/*' } });
  if (!r.ok) throw new Error('HTTP ' + r.status + '（' + url + '）');
  const t = await r.text();
  if (/^\s*<(!doctype|html)/i.test(t)) throw new Error('拿到的是网页而不是 SKILL.md，请改用 raw 链接');
  return t;
}

/* ------------------------- 对话主流程 ------------------------- */
async function doSend() {
  if (RUNNING) { stopRun(); return; }
  const ta = $('#input'); if (!ta) return;
  const text = ta.value.trim(); if (!text) return;
  ta.value = ''; S.ui.drafting = '';
  hideMention();
  await runTurn(text);
}
function stopRun() { if (ABORT) { try { ABORT.abort(); } catch (e) {} } RUNNING = false; toast('已停止'); }

function appendTurn(html) {
  const wrap = $('#msgs .msgs');
  if (!wrap) return null;
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  const el = tmp.firstElementChild;
  wrap.appendChild(el);
  scrollDown();
  return el;
}
function scrollDown() { const sc = $('#msgs'); if (sc) sc.scrollTop = sc.scrollHeight; }
function setSendState(running) {
  const b = $('.send'); if (!b) return;
  b.classList.toggle('stop', running);
  b.textContent = running ? '■' : '➤';
}

async function runTurn(userText) {
  const agent = curAgent();
  const topic = ensureTopic(agent.id);
  if (topic.messages.length === 0) topic.title = userText.slice(0, 18);
  topic.messages.push({ role: 'user', content: userText, ts: now(), by: agent.id });
  save();
  renderChat();

  RUNNING = true; ABORT = new AbortController();
  setSendState(true);
  const maxRounds = S.settings.maxRounds || 6;
  try {
    for (let round = 1; round <= maxRounds; round++) {
      // 先取上下文（此时不含本轮的空占位），再落一条助手消息占位
      const msgs = apiMessages(agent, topic);
      const msg = { role: 'assistant', content: '', ops: [], ts: now(), round, by: agent.id };
      topic.messages.push(msg);
      const el = appendTurn(msgHTML(agent, msg));
      if (!el) break;
      const bodyEl = el.querySelector('.prose');

      let usage = null;
      const t0 = now();
      let full = '', last = 0;
      full = await streamChat(agent, msgs, (c) => {
        full += c;
        const t = now();
        if (t - last > 60) { last = t; bodyEl.innerHTML = mdRender(stripDirectives(full)) + '<span class="caret">▍</span>'; scrollDown(); }
      }, ABORT.signal, (u) => { usage = u; });
      const dt = now() - t0;

      msg.raw = full;
      msg.content = stripDirectives(full);
      msg.ms = dt;
      bodyEl.innerHTML = mdRender(msg.content || '（无正文输出）');
      bumpStats(topic, agent, usage, msgs, full, dt);
      refreshBubble();
      save();

      const ops = extractDirectives(full);
      if (!ops.length) break;

      msg.ops = ops;
      const opsEl = document.createElement('div');
      opsEl.className = 'ops';
      el.querySelector('.bd').appendChild(opsEl);
      const results = [];

      for (let i = 0; i < ops.length; i++) {
        const o = ops[i];
        if (o.type === 'doc') {
          const r = execDocOp(o);
          o.result = r; o.status = 'done';
          opsEl.innerHTML = msg.ops.map((x, j) => opHTML(x, j)).join('');
          results.push('【文档操作结果】' + o.op + ' 「' + o.title + '」→ ' + r);
          save();
        } else {
          const key = String(o.agent).replace(/^@/, '');
          const target = S.agents.find((x) => x.roleName === key) || S.agents.find((x) => x.name === key);
          if (!target) {
            o.status = 'error'; o.result = '未找到该 Agent（请检查 @角色名）。';
            opsEl.innerHTML = msg.ops.map((x, j) => opHTML(x, j)).join('');
            results.push('【派发失败】' + o.agent + ' 不存在。');
            continue;
          }
          o.status = 'running';
          opsEl.innerHTML = msg.ops.map((x, j) => opHTML(x, j)).join('');
          scrollDown();
          const pre = opsEl.querySelectorAll('.op')[i] ? opsEl.querySelectorAll('.op')[i].querySelectorAll('.prose')[1] : null;
          try {
            const subMsgs = [{ role: 'system', content: buildSystem(target) }, { role: 'user', content: o.task }];
            let acc = '', subUsage = null, last2 = 0;
            const t1 = now();
            const r = await streamChat(target, subMsgs, (c) => {
              acc += c;
              const t = now();
              if (t - last2 > 60) { last2 = t; if (pre) { pre.innerHTML = mdRender(stripDirectives(acc)) + '<span class="caret">▍</span>'; scrollDown(); } }
            }, ABORT.signal, (u) => { subUsage = u; });
            const dt1 = now() - t1;
            o.result = stripDirectives(r); o.status = 'done';
            bumpStats(topic, target, subUsage, subMsgs, r, dt1);
            refreshBubble();
            results.push('【' + target.name + ' @' + target.roleName + ' 的回执】\n' + o.result);
          } catch (e) {
            o.status = 'error'; o.result = '调用失败：' + (e.message || e);
            results.push('【' + target.name + ' 调用失败】' + (e.message || e));
          }
          opsEl.innerHTML = msg.ops.map((x, j) => opHTML(x, j)).join('');
          scrollDown();
        }
      }
      save();
      if (!results.length) break;
      if (round === maxRounds) {
        topic.messages.push({ role: 'user', content: '（系统）已达最大轮次，请直接给出最终答复。', _synthetic: true });
        break;
      }
      topic.messages.push({ role: 'user', content: '（系统回执，请据此继续；若已可收尾请直接输出最终答复）\n\n' + results.join('\n\n'), _synthetic: true });
    }
  } catch (e) {
    if (e && e.name === 'AbortError') {
      topic.messages.push({ role: 'assistant', content: '_已中止。_', ops: [], by: agent.id });
    } else {
      topic.messages.push({
        role: 'assistant', ops: [], by: agent.id,
        content: '⚠️ **调用失败**：' + (e.message || e) +
          '\n\n> 排查：API 地址是否正确、Key 是否有效、是否已拉取并选择模型。浏览器直连第三方接口若被 CORS 拦截，可换用支持浏览器直连的服务商，或自建一个本地代理。',
      });
      toast('调用失败：' + (e.message || e), 'err');
    }
  } finally {
    RUNNING = false; ABORT = null; save();
    renderChat();
  }
}

      sw('联网检索', '预留开关（需自行接入搜索 API）', a.tools.search, 'search') +
    '</div>';
  }
}
function sw(label, desc, on, key) {
  return '<div class="switch"><div><div class="lbl">' + label + '</div><div class="dsc">' + desc + '</div></div>' +
    '<div class="tgl' + (on ? ' on' : '') + '" data-tool="' + key + '"></div></div>';
}

    if (n && p.id !== 'custom') n.value = p.name;

function persistCfg() {
  const p = getProvider(S.settings.activeProviderId);
  if (p) {
    const g = (id) => { const e = $(id); return e ? e.value : undefined; };
    if (g('#cfgName') !== undefined) p.name = g('#cfgName').trim() || '未命名配置';
    if (g('#cfgUrl') !== undefined) p.baseUrl = g('#cfgUrl').trim();
    if (g('#cfgKey') !== undefined) p.apiKey = g('#cfgKey').trim();
  }
  if ($('#cfgDefault')) S.settings.defaultModel = $('#cfgDefault').value;
  if ($('#cfgRounds')) S.settings.maxRounds = Math.max(1, Math.min(12, parseInt($('#cfgRounds').value, 10) || 6));
  const sb = S.settings.sandbox;
  if ($('#sbProvider')) sb.provider = $('#sbProvider').value;
  if ($('#sbEndpoint')) sb.endpoint = $('#sbEndpoint').value.trim();
  if ($('#sbKey')) sb.apiKey = $('#sbKey').value.trim();
}

function persistAgentTab(a, tab) {
  const g = (id) => { const e = $(id); return e ? e.value : null; };
  if (tab === 'base') {
    if (g('#fName') !== null) a.name = g('#fName').trim() || a.name;
    if (g('#fRole') !== null) {
      const r = g('#fRole').trim().replace(/^@/, '').replace(/[^\w\u4e00-\u9fa5-]/g, '');
      a.roleName = r || a.roleName;
    }
    if (g('#fDesc') !== null) a.desc = g('#fDesc').trim();
    if (g('#fPrompt') !== null) a.systemPrompt = g('#fPrompt');
    const u = g('#fAvatarUrl');
    if (u !== null && u.trim()) a.avatar = u.trim();
  } else if (tab === 'ability') {
    if (g('#fProv') !== null) a.providerId = g('#fProv');
    if (g('#fModel') !== null) a.model = g('#fModel');
  }
}

/* ------------------------- 全局事件 ------------------------- */
function wireGlobal() {
  document.addEventListener('click', async (e) => {
    const t = e.target;

    /* 提及 / 复制 */
    const copy = t.closest('.copybtn');
    if (copy) {
      const pre = copy.closest('pre');
      const code = pre && pre.querySelector('code');
      if (code) { try { await navigator.clipboard.writeText(code.textContent); } catch (x) {} }
      copy.textContent = '已复制'; setTimeout(() => { copy.textContent = '复制'; }, 1200);
      return;
    }
    const delSk = t.closest('[data-delskill]');
    if (delSk) {
      e.stopPropagation();
      const a = getAgent(S.ui.editAgentId) || curAgent();
      a.skills.splice(+delSk.dataset.delskill, 1); save(); renderTab(a, 'skills'); return;
    }
    const oh = t.closest('.oh');
    if (oh && !t.closest('[data-act]')) { oh.parentElement.classList.toggle('open'); return; }

    const fill = t.closest('[data-fill]');
    if (fill) { S.ui.drafting = fill.dataset.fill; const ta = $('#input'); if (ta) { ta.value = S.ui.drafting; ta.focus(); autoGrow(ta); } return; }

    const docEl = t.closest('[data-doc]');
    if (docEl) { saveDocIfDirty(); S.ui.activeDocId = docEl.dataset.doc; renderDocs(); return; }

    const agEl = t.closest('[data-agent]');
    if (agEl) {
      S.ui.activeAgentId = agEl.dataset.agent;
      S.ui.activeTopicId = null; S.ui.drafting = ''; S.ui.view = 'chat';
      hideMention(); save(); renderShell(); return;
    }

    const tabBtn = t.closest('[data-tab]');
    if (tabBtn) {
      const a = getAgent(S.ui.editAgentId) || curAgent();
      persistAgentTab(a, S.ui.editTab || 'base'); save();
      S.ui.editTab = tabBtn.dataset.tab; renderAgentEdit(); return;
    }

    const tgl = t.closest('[data-tool]');
    if (tgl) {
      const k = tgl.dataset.tool;
      if (k === 'sandbox' && S.ui.view === 'settings') { S.settings.sandbox.enabled = !S.settings.sandbox.enabled; save(); tgl.classList.toggle('on'); toast(S.settings.sandbox.enabled ? '云沙盒已启用' : '云沙盒已关闭'); return; }
      const a = getAgent(S.ui.editAgentId) || curAgent();
      persistAgentTab(a, 'ability');
      a.tools[k] = !a.tools[k]; save(); renderTab(a, 'ability'); return;
    }

    const em = t.closest('[data-emoji]');
    if (em) {
      if (em.closest('.mask')) return;              // 弹窗内的选择由弹窗自己处理
      const a = getAgent(S.ui.editAgentId) || curAgent();
      a.avatar = em.dataset.emoji; save(); renderTab(a, 'base'); renderShell(); return;
    }


    const mi = t.closest('[data-mention]');
    if (mi) return;

    const tMode = t.closest('[data-theme-mode]');
    if (tMode) { S.settings.theme.mode = tMode.dataset.themeMode; applyTheme(); save(); renderSettings(); return; }
    const tglTh = t.closest('[data-tgl-theme]');
    if (tglTh) {
      const k = tglTh.dataset.tglTheme;
      S.settings.theme[k] = !S.settings.theme[k];
      applyTheme(); save(); renderSettings(); return;
    }
    const sw = t.closest('[data-theme-preset]');
    if (sw) {
      const p = THEMES.find((x) => x.id === sw.dataset.themePreset);
      if (p) { Object.assign(S.settings.theme, { preset: p.id, h: p.h, s: p.s, l: p.l, custom: false }); applyTheme(); save(); renderSettings(); }
      return;
    }
    const openT = t.closest('[data-topic]');
    if (openT && !t.closest('[data-act]')) {
      S.ui.activeTopicId = openT.dataset.topic;
      const tt = S.topics.find((x) => x.id === openT.dataset.topic);
      if (tt) S.ui.activeAgentId = tt.agentId;
      S.ui.view = 'chat'; S.ui.drafting = '';
      closeSideMobile(); save(); renderShell(); return;
    }
    const setDef = t.closest('[data-setdefault]');
    if (setDef) { e.preventDefault(); S.settings.defaultModel = setDef.dataset.setdefault; save(); renderSettings(); toast('默认模型：' + setDef.dataset.setdefault, 'ok'); return; }

    const act = t.closest('[data-act]');
    if (!act) return;
    await handleAct(act.dataset.act, e);
  });

  document.addEventListener('input', (e) => {
    const t = e.target;
    if (!t) return;
    if (t.id === 'agentSearch') { S.ui._q = t.value; renderAgentLists(); renderTopicList(); return; }
    if (t.id === 'q') { S.ui.search = t.value; clearTimeout(window.__sq); window.__sq = setTimeout(() => renderSearchHits(), 160); return; }
    if (t.dataset && t.dataset.knob) {
      const k = t.dataset.knob, v = parseFloat(t.value);
      const th = S.settings.theme;
      if (k === 'h') { th.h = v; th.custom = true; applyTheme(); }
      else { th[k] = v; applyTheme(); }
      const lab = t.parentElement && t.parentElement.querySelector('.val');
      if (lab) lab.textContent = (k === 'h') ? v + '°' : (k === 'radius' || k === 'fontScale') ? '×' + v : v + 'px';
      clearTimeout(window.__st); window.__st = setTimeout(save, 250);
    }
  });

  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.id === 'avFile' && t.files && t.files[0]) {
      const f = t.files[0];
      if (f.size > 1200000) { toast('图片太大（>1.2MB），建议先用 URL', 'err'); return; }
      const fr = new FileReader();
      fr.onload = () => { const a = getAgent(S.ui.editAgentId) || curAgent(); a.avatar = fr.result; save(); renderTab(a, 'base'); renderShell(); };
      fr.readAsDataURL(f);
    }
    if (t.id === 'impFile' && t.files && t.files[0]) {
      const fr = new FileReader();
      fr.onload = () => {
        try {
          const o = JSON.parse(fr.result);
          localStorage.setItem(KEY, JSON.stringify(o));
          S = load(); save(); renderShell();
          toast('导入成功', 'ok');
        } catch (x) { toast('导入失败：文件不是合法 JSON', 'err'); }
      };
      fr.readAsText(t.files[0]);
    }
  });
}

function saveDocIfDirty() {
  if (S.ui.view !== 'docs') return;
  const d = findDoc(S.ui.activeDocId); if (!d) return;
  const t = $('#docTitle'), b = $('#docBody');
  if (t) d.title = t.value.trim() || d.title;
  if (b) d.content = b.value;
  d.updatedAt = now(); save();
}

async function handleAct(act, e) {
  const a0 = curAgent();
  switch (act) {
    case 'goto-search': { S.ui.view = 'search'; closeSideMobile(); save(); renderShell(); setTimeout(() => { const i = $('#q'); if (i) i.focus(); }, 30); return; }
    case 'viewdoc': { openDocDrawer(e && e.target && e.target.closest('[data-id]') ? e.target.closest('[data-id]').dataset.id : S.ui.activeDocId); return; }
    case 'closedoc': { closeDocDrawer(); return; }
    case 'opendoclib': { const id = S.ui.docView; closeDocDrawer(); S.ui.activeDocId = id; S.ui.view = 'docs'; save(); renderShell(); return; }
    case 'save-clip': {
      const clip = S.ui.searchHitText || '';
      if (!clip) return;
      S.docs.unshift({ id: uid('d'), title: '检索摘录 ' + fmtTime(now()), content: clip, ownerId: S.ui.activeAgentId, shared: true, updatedAt: now() });
      save(); toast('已存入文档库', 'ok'); return;
    }
    case 'theme-mode': {
      const m = e.target.closest('[data-theme-mode]');
      if (m) { S.settings.theme.mode = m.dataset.themeMode; applyTheme(); save(); renderSettings(); }
      return;
    }
    case 'resetTheme': {
      S.settings.theme = { mode: 'dark', preset: 'gold', h: 40, s: '50%', l: '58%', radius: 1, fontScale: 1, glassBlur: 20, aurora: true, custom: false };
      applyTheme(); save(); renderSettings(); toast('已恢复默认外观', 'ok'); return;
    }
    case 'sandbox-test': { await testSandbox(e); return; }
    case 'close-side': { closeSideMobile(); return; }
    case 'switch-topic': {
      const id = e.target.closest('[data-topic]') && e.target.closest('[data-topic]').dataset.topic;
      if (!id) return;
      const t = S.topics.find((x) => x.id === id); if (!t) return;
      S.ui.activeTopicId = id; S.ui.activeAgentId = t.agentId; S.ui.view = 'chat'; S.ui.drafting = '';
      closeSideMobile(); save(); renderShell(); return;
    }
    case 'del-topic': {
      const el = e.target.closest('[data-topic]');
      const id = el && el.dataset.topic; if (!id) return;
      modal('<h3>删除会话</h3><div class="dsc">该会话的全部消息与统计将一并删除，不可恢复。</div>' +
        '<div class="act"><button class="btn" data-x="c">取消</button><button class="btn danger" data-x="ok">删除</button></div>',
        (m, close) => {
          m.addEventListener('click', (ev) => {
            const x = ev.target.closest('[data-x]'); if (!x) return;
            if (x.dataset.x === 'ok') {
              S.topics = S.topics.filter((t) => t.id !== id);
              if (S.ui.activeTopicId === id) S.ui.activeTopicId = null;
              save(); renderShell(); toast('已删除', 'ok');
            }
            close();
          });
        });
      return;
    }
    case 'rename-topic': {
      const el = e.target.closest('[data-topic]');
      const t = el && S.topics.find((x) => x.id === el.dataset.topic); if (!t) return;
      modal('<h3>重命名会话</h3><div class="fld"><input id="tpName" value="' + esc(t.title) + '"></div>' +
        '<div class="act"><button class="btn" data-x="c">取消</button><button class="btn pri" data-x="ok">保存</button></div>',
        (m, close) => {
          setTimeout(() => { const i = $('#tpName'); if (i) { i.focus(); i.select(); } }, 30);
          m.addEventListener('click', (ev) => {
            const x = ev.target.closest('[data-x]'); if (!x) return;
            if (x.dataset.x === 'ok') { const i = $('#tpName'); t.title = (i && i.value.trim()) || t.title; save(); renderShell(); }
            close();
          });
        });
      return;
    }
    case 'toggle-side': {
      if (window.matchMedia('(max-width:639px)').matches) {
        S.ui.sideOpen = !S.ui.sideOpen;
        const app = document.getElementById('app');
        const sd = document.querySelector('.side');
        if (app) app.classList.toggle('side-open', S.ui.sideOpen);
        if (sd) sd.classList.toggle('open', S.ui.sideOpen);
      } else {
        S.ui.collapsed = !S.ui.collapsed;
        const app = document.getElementById('app');
        if (app) app.classList.toggle('collapsed', S.ui.collapsed);
      }
      save(); return;
    }
    case 'goto-chat': {
      if (S.ui.view === 'agent') { const a = getAgent(S.ui.editAgentId) || curAgent(); persistAgentTab(a, S.ui.editTab || 'base'); save(); }
      if (S.ui.view === 'docs') saveDocIfDirty();
      S.ui.view = 'chat'; save(); renderShell(); return;
    }

function boot() {

  wireGlobal();

  try {
    window.matchMedia('(prefers-color-scheme: dark)')
      .addEventListener('change', () => { if ((S.settings.theme || {}).mode === 'auto') applyTheme(); });
  } catch (e) {}

  window.addEventListener('resize', () => {
    const ta = $('#input'); if (ta) autoGrow(ta);
    if (!window.matchMedia('(max-width:639px)').matches && S.ui.sideOpen) {
      S.ui.sideOpen = false;
      const app = document.getElementById('app'); if (app) app.classList.remove('side-open');
      const sd = document.querySelector('.side'); if (sd) sd.classList.remove('open');
    }
  });

  document.addEventListener('keydown', (e) => {
    const mod = e.metaKey || e.ctrlKey;
    if (e.key === 'Escape') { hideMention(); closeDocDrawer(); closeSideMobile(); return; }
    if (mod && e.key.toLowerCase() === 'k') {
      e.preventDefault(); gotoView('search');
      setTimeout(() => { const i = $('#q'); if (i) i.focus(); }, 40); return;
    }
    if (mod && e.key.toLowerCase() === 'b') {
      e.preventDefault(); S.ui.collapsed = !S.ui.collapsed;
      const app = document.getElementById('app'); if (app) app.classList.toggle('collapsed', S.ui.collapsed);
      save(); return;
    }
    if (mod && e.key.toLowerCase() === 'n') {
      e.preventDefault(); newTopic(curAgent().id); S.ui.view = 'chat'; save(); renderShell(); return;
    }
  });

  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
}

const THEME_DEFAULT = { mode: 'dark', preset: 'gold', h: 40, s: '50%', l: '58%', radius: 1, fontScale: 1, glassBlur: 20, aurora: true, custom: false };
function themeObj() { return Object.assign({}, THEME_DEFAULT, S.settings.theme || {}); }

function applyTheme() {
  const th = themeObj();
  const sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const mode = th.mode === 'auto' ? (sysDark ? 'dark' : 'light') : th.mode;
  const r = document.documentElement;
  r.setAttribute('data-theme', mode);
  r.setAttribute('data-glass', th.glassBlur > 0 ? '1' : '0');
  r.setAttribute('data-custom-accent', th.custom ? '1' : '0');
  r.style.setProperty('--accent-h', th.h);
  r.style.setProperty('--accent-s', th.s);
  r.style.setProperty('--accent-l', th.l);
  r.style.setProperty('--radius-scale', th.radius);
  r.style.setProperty('--font-scale', th.fontScale);
  r.style.setProperty('--glass-blur', th.glassBlur + 'px');
  document.body.classList.toggle('no-aurora', !th.aurora);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', mode === 'dark' ? '#0D0C0B' : '#FAF7F2');
}

function escapeRe(v) { return String(v).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function hlSnippet(text, q) {
  const t = String(text || '');
  if (!q) return esc(t.slice(0, 220));
  const i = t.toLowerCase().indexOf(q.toLowerCase());
  const start = i < 0 ? 0 : Math.max(0, i - 70);
  const end = Math.min(t.length, (i < 0 ? 0 : i) + q.length + 190);
  const snip = (start > 0 ? '…' : '') + t.slice(start, end) + (end < t.length ? '…' : '');
  const body = esc(snip);
  try { return body.replace(new RegExp(escapeRe(esc(q)), 'gi'), (mm) => '<mark>' + mm + '</mark>'); }
  catch (e) { return body; }
}

  const ql = q.toLowerCase();
  const hits = [];

  if (scope === 'all' || scope === 'msg') {
    S.topics.forEach((t) => {
      const ag = getAgent(t.agentId);
      (t.messages || []).forEach((m, idx) => {
        const c = m.content || '';
        if (c.toLowerCase().includes(ql)) {
          hits.push({
            type: 'msg', title: t.title || '未命名会话',
            meta: (ag ? ag.name : '未知 Agent') + ' · ' + (m._synthetic ? '系统回执' : m.role === 'user' ? '用户' : 'AI') +
                  ' · ' + (m.ts ? fmtTime(m.ts) : fmtTime(t.createdAt)),
            text: c, topicId: t.id, msgIndex: idx,
          });
        }
      });
    });
  }
  if (scope === 'all' || scope === 'doc') {
    S.docs.forEach((d) => {
      const c = (d.title || '') + '\n' + (d.content || '');
      if (c.toLowerCase().includes(ql)) {
        hits.push({ type: 'doc', title: d.title, meta: '文档 · ' + (d.content || '').length + ' 字 · 更新于 ' + relTime(d.updatedAt), text: d.content || '', docId: d.id });
      }
    });
  }
  if (scope === 'all' || scope === 'agent') {
    S.agents.forEach((a) => {
      const c = (a.name || '') + ' @' + (a.roleName || '') + ' ' + (a.desc || '') + ' ' + (a.systemPrompt || '') + ' ' + (a.skills || []).map((s) => s.name).join(' ');
      if (c.toLowerCase().includes(ql)) {
        hits.push({ type: 'agent', title: a.name + ' @' + a.roleName, meta: (a.isMain ? '主控' : 'Agent') + ' · ' + ((a.skills || []).length) + ' skills', text: a.desc || a.systemPrompt || '', agentId: a.id });
      }
    });
  }

  SEARCH_HITS = hits;
  if (!hits.length) { box.innerHTML = '<div class="empty">没有匹配「' + esc(q) + '」的内容</div>'; return; }
  box.innerHTML = '<div class="kv" style="margin-bottom:10px">共 ' + hits.length + ' 条命中</div>' +
    hits.slice(0, 120).map((h, i) =>
      '<div class="hit" data-hit="' + i + '">' +
        '<div class="h1">' + (h.type === 'doc' ? '▤ ' : h.type === 'agent' ? '◆ ' : '❝ ') + esc(h.title) + '</div>' +
        '<div class="hm">' + esc(h.meta) + '</div>' +
        '<div class="hb">' + hlSnippet(h.text, q) + '</div>' +
        (h.type === 'doc' ? '' : '<div class="kv" style="margin-top:8px"><button class="btn sm" data-clip="' + i + '">存入文档库</button></div>') +
      '</div>').join('');
}

/* ------------------------- 云沙盒（e2b 兼容 REST） ------------------------- */
function sandboxCfg() { return S.settings.sandbox || {}; }
async function sbFetch(path, opt) {
  const sb = sandboxCfg();
  if (!sb.endpoint) throw new Error('未配置沙盒 Endpoint');
  const base = String(sb.endpoint).trim().replace(/\/+$/, '');
  const headers = Object.assign({ 'Content-Type': 'application/json' }, (opt && opt.headers) || {});
  if (sb.apiKey) { headers['X-API-KEY'] = sb.apiKey; headers['Authorization'] = 'Bearer ' + sb.apiKey; }
  const r = await fetch(base + path, Object.assign({}, opt || {}, { headers }));
  const txt = await r.text();
  if (!r.ok) throw new Error('HTTP ' + r.status + ' · ' + txt.slice(0, 200));
  try { return JSON.parse(txt); } catch (e) { return { raw: txt }; }
}
async function sandboxCreate() {
  const r = await sbFetch('/sandboxes', { method: 'POST', body: JSON.stringify({ template: 'base' }) });
  const id = r.sandboxID || r.sandboxId || r.id;
  if (!id) throw new Error('创建沙盒失败：' + JSON.stringify(r).slice(0, 200));
  return id;
}
async function sandboxRun(code, id) {
  const sid = id || await sandboxCreate();
  const r = await sbFetch('/sandboxes/' + sid + '/code', { method: 'POST', body: JSON.stringify({ code: String(code) }) });
  const out = [].concat(r.stdout || r.logs?.stdout || []).join('\n');
  const err = [].concat(r.stderr || r.logs?.stderr || []).join('\n');
  if (!id) { try { await sbFetch('/sandboxes/' + sid, { method: 'DELETE' }); } catch (e) {} }
  return { id: sid, out, err, raw: r };
}
async function testSandbox(e) {
  const btn = e && e.target && e.target.closest('[data-act="sandbox-test"]');
  const label = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '测试中…'; }
  try {
    const sid = await sandboxCreate();
    const r = await sandboxRun('print("hello from 晨星")', sid);
    await sbFetch('/sandboxes/' + sid, { method: 'DELETE' }).catch(() => {});
    S.settings.sandbox.lastOk = now();
    S.settings.sandbox.enabled = true;
    save();
    toast('云沙盒连通 ✓ 沙盒 ' + String(sid).slice(0, 10) + ' 已创建并销毁，输出：' + (r.out || '(空)').slice(0, 60), 'ok');
    if (S.ui.view === 'settings') renderSettings();
  } catch (err) {
    toast('沙盒失败：' + (err.message || err), 'err');
  }
  if (btn) { btn.disabled = false; btn.textContent = label || '测试云沙盒'; }
}
window.CX = { sandboxRun, sandboxCreate, state: () => S };

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
