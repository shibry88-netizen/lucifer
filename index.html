<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-glass="1">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#0D0C0B" />
<meta name="description" content="LUCIFER —— 多智能体中枢。总控 Agent 统一发号施令，调度团队协作，可调用云沙盒 / 联网检索 / GitHub。" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<title>LUCIFER</title>
<style>
/* =======================================================================
 * LUCIFER · 多智能体中枢  ——  液态玻璃设计系统（v2）
 * 配色回归第一版：极光背景 + 靛紫玻璃；App 图标另用鎏金+黑
 * 原则：只动画 transform / opacity / filter；玻璃层绝不参与过渡
 * ===================================================================== */

*{box-sizing:border-box}

:root{
  /* 主色引擎：改 --accent-h 即换色（鎏金默认 42） */
  --accent-h:42; --accent-s:56%; --accent-l:62%;
  --radius-scale:1; --font-scale:1;
  --glass-blur:16px;

  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
  --sp-5:20px; --sp-6:24px; --sp-8:32px;

  --r-xs:calc(7px * var(--radius-scale));
  --r-sm:calc(11px * var(--radius-scale));
  --r-md:calc(16px * var(--radius-scale));
  --r-lg:calc(20px * var(--radius-scale));
  --r-xl:calc(26px * var(--radius-scale));
  --r-full:999px;

  /* 动效：慢一档、柔一档，位移小、无过冲 */
  --dur-quick:160ms; --dur-base:240ms; --dur-slow:360ms;
  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease-in-out:cubic-bezier(.4,0,.2,1);
  --ease-spring:cubic-bezier(.32,1.08,.64,1);

  --font-cn:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","MiSans","Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  --font-mono:ui-monospace,"SFMono-Regular","JetBrains Mono",Consolas,Menlo,monospace;

  --fs-h1:calc(26px * var(--font-scale));
  --fs-h2:calc(21px * var(--font-scale));
  --fs-h3:calc(17px * var(--font-scale));
  --fs-h4:calc(15.5px * var(--font-scale));
  --fs-h5:calc(14.5px * var(--font-scale));
  --fs-h6:calc(13.5px * var(--font-scale));
  --fs-body:calc(14px * var(--font-scale));
  --fs-ui:calc(13px * var(--font-scale));
  --fs-cap:calc(12px * var(--font-scale));
  --fs-micro:calc(11px * var(--font-scale));
  --fs-code:calc(12.5px * var(--font-scale));
}

/* ---------------- 暗色（默认，第一版配色） ---------------- */
[data-theme="dark"]{
  --bg-0:#0B0B0E; --bg-1:#121216; --bg-2:#191920; --bg-3:#222229;
  --glass-bg:rgba(255,255,255,.045);
  --glass-filter:blur(var(--glass-blur)) saturate(150%);
  --glass-line:rgba(255,255,255,.085);
  --line-subtle:rgba(255,255,255,.06);
  --line-default:rgba(255,255,255,.10);
  --line-strong:rgba(212,175,106,.42);
  --text-1:#F1EEE7; --text-2:#B0ABA1; --text-3:#7B766C;
  --brand-100:#F7EAC8; --brand-200:#EDD59C; --brand-300:#E0BC78; --brand-400:#D4AF6A;
  --brand-500:#C29A52; --brand-600:#A87F3C; --brand-700:#7E5C2A;
  --accent:#D4AF6A; --accent-2:#E8CE9B; --accent-soft:rgba(212,175,106,.14);
  --on-accent:#241A08;
  --brand-grad:linear-gradient(135deg,#EDD59C 0%,#D4AF6A 52%,#A87F3C 100%);
  --brand-grad-matte:linear-gradient(140deg,#D4AF6A,#A87F3C);
  --user-grad:linear-gradient(140deg,rgba(212,175,106,.20),rgba(232,206,155,.08));
  --success:#63BE8F; --success-bg:rgba(99,190,143,.13);
  --warning:#DFA65C; --warning-bg:rgba(223,166,92,.13);
  --danger:#D97070;  --danger-bg:rgba(217,112,112,.13);
  --shadow-sm:0 1px 2px rgba(0,0,0,.32);
  --shadow-md:0 6px 18px rgba(0,0,0,.38);
  --shadow-lg:0 18px 48px rgba(0,0,0,.50);
  --shadow-brand:none;
  --shadow-float:0 12px 36px rgba(0,0,0,.55),0 0 0 1px var(--glass-line);
  --scrim:rgba(6,6,9,.58);
  --code-bg:#141419; --code-text:#D9D4C9; --code-bar:rgba(255,255,255,.04);
  --tint-hover:rgba(255,255,255,.05);
  --tint-active:rgba(255,255,255,.08);
  --tint-selected:rgba(212,175,106,.13);
  --aurora-a:radial-gradient(circle at 30% 22%,rgba(212,175,106,.34),transparent 62%);
  --aurora-b:radial-gradient(circle at 78% 88%,rgba(120,132,180,.20),transparent 62%);
  --aurora-opacity:.62; --grain-opacity:.012; --grain-blend:overlay;
}

/* ---------------- 亮色 ---------------- */
[data-theme="light"]{
  --bg-0:#FAF8F4; --bg-1:#FFFFFF; --bg-2:#F4F1EA; --bg-3:#EDE9E0;
  --glass-bg:rgba(255,255,255,.72);
  --glass-filter:blur(var(--glass-blur)) saturate(130%);
  --glass-line:rgba(33,31,26,.09);
  --line-subtle:rgba(33,31,26,.07);
  --line-default:rgba(33,31,26,.12);
  --line-strong:rgba(168,127,60,.38);
  --text-1:#211F1B; --text-2:#6B675F; --text-3:#9A958B;
  --brand-100:#B98A3C; --brand-200:#A87F3C; --brand-300:#98712F; --brand-400:#8A6527;
  --brand-500:#7E5C2A; --brand-600:#6B4C20; --brand-700:#573C17;
  --accent:#A87F3C; --accent-2:#8A6527; --accent-soft:rgba(168,127,60,.12);
  --on-accent:#FFFFFF;
  --brand-grad:linear-gradient(135deg,#C9A45C 0%,#A87F3C 55%,#8A6527 100%);
  --brand-grad-matte:linear-gradient(140deg,#C9A45C,#8A6527);
  --user-grad:linear-gradient(140deg,rgba(168,127,60,.14),rgba(201,164,92,.08));
  --success:#3E9B6B; --success-bg:rgba(62,155,107,.11);
  --warning:#B97F2E; --warning-bg:rgba(185,127,46,.11);
  --danger:#C25454;  --danger-bg:rgba(194,84,84,.10);
  --shadow-sm:0 1px 2px rgba(31,28,22,.06);
  --shadow-md:0 8px 22px rgba(31,28,22,.09);
  --shadow-lg:0 22px 54px rgba(31,28,22,.13);
  --shadow-brand:0 6px 20px rgba(168,127,60,.22);
  --shadow-float:0 14px 40px rgba(31,28,22,.14),0 0 0 1px var(--glass-line);
  --scrim:rgba(33,31,26,.34);
  --code-bg:#F5F2EC; --code-text:#2A2722; --code-bar:rgba(33,31,26,.045);
  --tint-hover:rgba(33,31,26,.045);
  --tint-active:rgba(33,31,26,.075);
  --tint-selected:rgba(168,127,60,.11);
  --aurora-a:radial-gradient(circle at 30% 20%,rgba(212,175,106,.22),transparent 60%);
  --aurora-b:radial-gradient(circle at 80% 90%,rgba(190,205,225,.28),transparent 60%);
  --aurora-opacity:.85; --grain-opacity:.014; --grain-blend:multiply;
}

/* 自定义主色 */
html[data-custom-accent="1"]{
  --brand-400:hsl(var(--accent-h) var(--accent-s) var(--accent-l));
  --brand-300:hsl(var(--accent-h) var(--accent-s) calc(var(--accent-l) + 9%));
  --brand-500:hsl(var(--accent-h) var(--accent-s) calc(var(--accent-l) - 8%));
  --brand-600:hsl(var(--accent-h) var(--accent-s) calc(var(--accent-l) - 16%));
  --accent:var(--brand-400);
  --brand-grad:linear-gradient(135deg,
    hsl(var(--accent-h) var(--accent-s) calc(var(--accent-l) - 22%)) 0%,
    hsl(var(--accent-h) var(--accent-s) var(--accent-l)) 34%,
    hsl(var(--accent-h) calc(var(--accent-s) - 25%) calc(var(--accent-l) + 12%)) 62%,
    hsl(calc(var(--accent-h) + 55) var(--accent-s) var(--accent-l)) 100%);
  --brand-grad-matte:linear-gradient(140deg,
    hsl(var(--accent-h) var(--accent-s) var(--accent-l)),
    hsl(calc(var(--accent-h) + 40) var(--accent-s) calc(var(--accent-l) - 4%)));
  --user-grad:linear-gradient(140deg,
    hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .30),
    hsl(calc(var(--accent-h) + 70) var(--accent-s) var(--accent-l) / .14));
  --accent-soft:hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .16);
  --line-strong:hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .42);
}

/* ---------------- 基础 ---------------- */
html,body{height:100%;margin:0;padding:0;overflow:hidden;overscroll-behavior:none;background:var(--bg-0)}
body{
  background:var(--bg-0); color:var(--text-1); font-family:var(--font-cn);
  font-size:var(--fs-ui); line-height:1.65;
  font-variant-numeric:tabular-nums; overflow:hidden;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  transition:background var(--dur-slow) var(--ease-out),color var(--dur-slow) var(--ease-out);
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{
  font-family:inherit;font-size:var(--fs-ui);color:var(--text-1);
  background:var(--bg-2);border:1px solid var(--line-default);
  border-radius:var(--r-sm);padding:9px 12px;outline:none;width:100%;
  transition:border-color var(--dur-base) var(--ease-out),box-shadow var(--dur-base) var(--ease-out),background var(--dur-base) var(--ease-out);
}
input:focus,textarea:focus,select:focus{border-color:var(--line-strong);box-shadow:0 0 0 3px var(--accent-soft)}
input::placeholder,textarea::placeholder{color:var(--text-3)}
textarea{resize:vertical;line-height:1.7}
select option{background:var(--bg-2);color:var(--text-1)}
a{color:var(--accent-2);text-decoration:none}
a:hover{text-decoration:underline}
code{font-family:var(--font-mono)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-default);border-radius:10px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--line-strong);background-clip:content-box}
::selection{background:rgba(124,108,255,.34)}

/* ---------------- 极光背景（第一版四色） ---------------- */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;opacity:var(--aurora-opacity)}
.aurora i{position:absolute;display:block;border-radius:50%;filter:blur(90px)}
.aurora i:nth-child(1){width:60vw;height:60vw;left:-12vw;top:-16vw;background:var(--aurora-a)}
.aurora i:nth-child(2){width:54vw;height:54vw;right:-10vw;bottom:-18vw;background:var(--aurora-b)}
.aurora i:nth-child(3),.aurora i:nth-child(4){display:none}
body.no-aurora .aurora{display:none}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;
  opacity:var(--grain-opacity);mix-blend-mode:var(--grain-blend);
  background-image:radial-gradient(rgba(255,255,255,.9) .5px,transparent .5px);background-size:3px 3px}

/* ---------------- 玻璃 ---------------- */
.glass{
  position:relative;background:var(--glass-bg);
  -webkit-backdrop-filter:var(--glass-filter);backdrop-filter:var(--glass-filter);
  border:1px solid var(--glass-line);
  box-shadow:var(--shadow-md),inset 0 1px 0 rgba(255,255,255,.16);
}
html[data-theme="light"] .glass{box-shadow:var(--shadow-md),inset 0 1px 0 rgba(255,255,255,.9)}
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(130% 90% at 8% -20%,rgba(255,255,255,.14),transparent 58%);
}
html[data-glass="0"] .glass{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg-1)}
html[data-glass="0"] .glass::before{display:none}

.brand-text{background:var(--brand-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
@supports not ((-webkit-background-clip:text) or (background-clip:text)){.brand-text{color:var(--accent);background:none}}
.gold-text{background:var(--brand-grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------------- 布局 ---------------- */
/* 100dvh 跟随移动端动态工具栏，避免 100vh 溢出导致顶部露白/底部被截 */
/* fixed inset:0 不受 dvh 回弹影响；height 保留作低版本兜底 */
.app{position:fixed;inset:0;z-index:2;display:flex;
  height:100vh;height:100dvh;overflow:hidden;background:var(--bg-0)}
.side{
  width:268px;min-width:268px;background:var(--bg-1);border-right:1px solid var(--line-subtle);
  display:flex;flex-direction:column;transition:margin-left 240ms var(--ease-in-out);contain:layout;
}
.app.collapsed .side{margin-left:-268px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.side-mask{display:none}
.tabbar{display:none}

/* ---------------- 侧栏 ---------------- */
.side-head{padding:14px 14px 10px;display:flex;align-items:center;gap:11px}
.logo{width:34px;height:34px;border-radius:var(--r-sm);flex:0 0 auto;display:grid;place-items:center;
  background:var(--brand-grad);box-shadow:var(--shadow-brand),inset 0 1px 0 rgba(255,255,255,.45)}
.logo svg{width:18px;height:18px;display:block}
.logo.gold{background:linear-gradient(140deg,#8C6E33,#E7D4A4 50%,#A8823D);box-shadow:0 8px 22px -8px rgba(201,164,92,.8),inset 0 1px 0 rgba(255,246,224,.5)}
.brand b{display:block;font-size:15px;font-weight:650;letter-spacing:.06em;line-height:1.2}
.brand span{display:block;font-size:var(--fs-micro);color:var(--text-3);letter-spacing:.16em;text-transform:uppercase;margin-top:3px;font-family:var(--font-mono)}
.side-search{padding:0 14px 10px}
.side-search input{height:34px;padding:0 12px;font-size:var(--fs-cap);border-radius:var(--r-sm);background:var(--bg-0);border-color:var(--line-subtle)}
.side-scroll{flex:1;overflow-y:auto;padding-bottom:8px;overscroll-behavior:contain}
.side-label{padding:12px 16px 5px;font-size:10.5px;color:var(--text-3);letter-spacing:.1em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:space-between}
.side-label button{font-size:15px;line-height:1;color:var(--text-3);padding:0 6px;border-radius:var(--r-xs);transition:color var(--dur-quick)}
.side-label button:hover{color:var(--accent)}
.agent-item,.topic-item{
  display:flex;align-items:center;gap:10px;height:42px;padding:0 10px;margin:1px 8px;
  border-radius:var(--r-sm);cursor:pointer;position:relative;overflow:hidden;
  transition:background var(--dur-base) var(--ease-out),color var(--dur-base) var(--ease-out);
}
.agent-item:hover,.topic-item:hover{background:var(--accent-soft)}
.agent-item.on,.topic-item.on{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.agent-item.on .nm,.topic-item.on .tt{color:var(--brand-200)}
.agent-item .meta,.topic-item .meta{min-width:0;flex:1}
.agent-item .nm,.topic-item .tt{font-size:var(--fs-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent-item .rl,.topic-item .rl{font-size:10.5px;color:var(--text-3);font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topic-item{height:38px}
.topic-item .tt{font-size:var(--fs-cap)}
.topic-item .x{opacity:0;font-size:13px;color:var(--text-3);padding:0 3px;transition:opacity var(--dur-quick),color var(--dur-quick)}
.topic-item:hover .x{opacity:1}
.topic-item .x:hover{color:var(--danger)}
.side-foot{border-top:1px solid var(--line-subtle);padding:8px;display:flex;flex-direction:column;gap:2px}
.side-foot button{width:100%;display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;
  border-radius:var(--r-sm);font-size:var(--fs-ui);color:var(--text-2);
  transition:background var(--dur-base) var(--ease-out),color var(--dur-base) var(--ease-out)}
.side-foot button:hover{background:var(--accent-soft);color:var(--text-1)}
.side-foot .ico{width:18px;text-align:center;font-size:15px;opacity:.9}
.side-foot .badge{margin-left:auto;font-size:10px;font-family:var(--font-mono);color:var(--text-3)}

/* ---------------- 头像 ---------------- */
.av{width:28px;height:28px;border-radius:9px;flex:0 0 auto;object-fit:cover;display:grid;place-items:center;
  font-size:14px;background:linear-gradient(150deg,rgba(255,255,255,.14),rgba(255,255,255,.05));
  border:1px solid var(--line-default);overflow:hidden}
html[data-theme="light"] .av{background:linear-gradient(150deg,#E8EAF6,#F5F6FC)}
.av.lg{width:34px;height:34px;font-size:16px;border-radius:11px}
.av.sm{width:22px;height:22px;font-size:11px;border-radius:7px}
.av.xs{width:18px;height:18px;font-size:9px;border-radius:6px}
.av.ring{box-shadow:0 0 0 2px var(--accent-soft),inset 0 1px 0 rgba(255,255,255,.3)}
.av.main-ring{box-shadow:0 0 0 2px rgba(124,108,255,.45)}

/* ---------------- 顶栏 ---------------- */
.top{
  height:calc(56px + env(safe-area-inset-top,0px));
  min-height:calc(56px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;gap:10px;
  padding:env(safe-area-inset-top,0px) 16px 0;
  background:var(--glass-bg);-webkit-backdrop-filter:var(--glass-filter);backdrop-filter:var(--glass-filter);
  border-bottom:1px solid var(--line-subtle);position:relative;z-index:20;
}
html[data-glass="0"] .top{backdrop-filter:none;background:var(--bg-1)}
.icon-btn{width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;
  font-size:16px;color:var(--text-2);flex:0 0 auto;
  transition:background var(--dur-base) var(--ease-out),color var(--dur-base) var(--ease-out),transform var(--dur-base) var(--ease-out)}
.icon-btn:hover{background:var(--accent-soft);color:var(--text-1);transform:translateY(-1px)}
.icon-btn:active{transform:translateY(0) scale(.95)}
.icon-btn.on{background:var(--accent-soft);color:var(--accent)}
.burger i{display:block;width:15px;height:1.5px;border-radius:2px;background:currentColor;margin:1.5px 0;transition:width var(--dur-base) var(--ease-out)}
.burger:hover i:nth-child(1),.burger:hover i:nth-child(3){width:10px}
.top-info{min-width:0;flex:1}
.top-info .t1{font-size:var(--fs-ui);display:flex;align-items:center;gap:7px}
.top-info .t1 b{font-weight:600}
.top-info .t2{font-size:11px;color:var(--text-3);font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.top-actions{display:flex;gap:6px;align-items:center}

/* ---------------- 按钮 ---------------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;
  border-radius:var(--r-sm);font-size:var(--fs-ui);font-weight:500;white-space:nowrap;color:var(--text-1);
  background:var(--bg-3);border:1px solid var(--line-default);
  transition:background var(--dur-base) var(--ease-out),border-color var(--dur-base) var(--ease-out),
             transform var(--dur-base) var(--ease-out),filter var(--dur-base) var(--ease-out),box-shadow var(--dur-base)}
.btn:hover{background:var(--bg-2);border-color:var(--line-strong)}
.btn:active{transform:scale(.985)}
.btn.pri{color:var(--on-accent);background:var(--brand-grad-matte);border-color:transparent;
  box-shadow:var(--shadow-brand),inset 0 1px 0 rgba(255,255,255,.28)}
.btn.pri:hover{filter:brightness(1.04);background:var(--brand-grad-matte)}
.btn.danger{color:var(--danger);background:var(--danger-bg);border-color:transparent}
.btn.danger:hover{background:var(--danger-bg);border-color:var(--danger);filter:brightness(1.05)}
.btn.ghost{background:transparent;border-color:var(--line-default)}
.btn.sm{height:28px;padding:0 10px;font-size:var(--fs-cap);border-radius:var(--r-xs)}
.btn:disabled{opacity:.42;pointer-events:none}
.btn.fix{flex:0 0 auto}
.btn.full,.btn.block{width:100%}
.btn.block{margin-bottom:8px}

/* ---------------- 通用 ---------------- */
.body{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;scroll-behavior:smooth}
.kv{font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--text-3)}
.kv.pad{padding:6px 14px}
.dim{color:var(--text-3)}
.mt{margin-top:12px}
.tag{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:var(--r-full);
  font-size:10.5px;font-family:var(--font-mono);color:var(--text-3);background:var(--bg-3);border:1px solid var(--line-subtle);white-space:nowrap}
.tag.main{color:var(--brand-200);background:var(--accent-soft);border-color:transparent}
.tag.ok{color:var(--success);background:var(--success-bg);border-color:transparent}
.tag.warn{color:var(--warning);background:var(--warning-bg);border-color:transparent}
.tag.err{color:var(--danger);background:var(--danger-bg);border-color:transparent}
.spin{width:12px;height:12px;border:1.5px solid var(--line-default);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.caret{display:inline-block;width:3px;height:1em;background:var(--accent);vertical-align:-2px;border-radius:1px;animation:breathe 1.4s var(--ease-in-out) infinite}
@keyframes breathe{0%,100%{opacity:.3}50%{opacity:.95}}

/* ---------------- 对话 ---------------- */
.msgs{max-width:860px;margin:0 auto;padding:26px 24px 96px;width:100%}
.msg{display:flex;gap:11px;margin-bottom:20px;align-items:flex-start;animation:rise 220ms var(--ease-out) both}
@keyframes rise{from{opacity:0;transform:translate3d(0,8px,0)}to{opacity:1;transform:none}}
.msg .bd{min-width:0;flex:1;max-width:calc(100% - 46px)}
.msg .hd{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
.msg .hd b{font-size:var(--fs-h6);font-weight:600}
.prose{font-size:var(--fs-body);line-height:1.78;word-break:break-word;overflow-wrap:anywhere}
.prose p{margin:0 0 10px}
.prose p:last-child{margin-bottom:0}
.prose h1,.prose h2,.prose h3,.prose h4,.prose h5,.prose h6{margin:16px 0 8px;font-weight:600;line-height:1.4}
.prose h1{font-size:var(--fs-h3)}.prose h2{font-size:var(--fs-h4)}
.prose h3,.prose h4,.prose h5,.prose h6{font-size:var(--fs-h5)}
.prose ul,.prose ol{margin:0 0 10px;padding-left:22px}
.prose li{margin:4px 0}
.prose blockquote{margin:0 0 10px;padding:2px 0 2px 12px;border-left:2px solid var(--line-strong);color:var(--text-2)}
.prose hr{border:0;border-top:1px solid var(--line-subtle);margin:16px 0}
.prose strong{font-weight:600;color:var(--text-1)}
.prose code.ic{background:var(--bg-3);padding:1.5px 6px;border-radius:6px;font-size:.92em;color:var(--brand-200)}
.prose pre.code{margin:0 0 10px;background:var(--code-bg);border:1px solid var(--line-subtle);border-radius:var(--r-sm);overflow:hidden}
.prose pre.code .bar{display:flex;justify-content:space-between;align-items:center;padding:5px 12px;background:rgba(255,255,255,.045);border-bottom:1px solid var(--line-subtle);font-size:10.5px;color:var(--text-3);font-family:var(--font-mono)}
.prose pre.code .bar button{font-size:10.5px;color:var(--text-3)}
.prose pre.code .bar button:hover{color:var(--accent)}
.prose pre.code code{display:block;padding:12px 14px;overflow-x:auto;font-size:var(--fs-code);line-height:1.68;color:#D6DCEF}

.msg.user{flex-direction:row-reverse}
.msg.user .bd{flex:0 1 auto;max-width:78%}
.msg.user .prose{background:var(--user-grad);border:1px solid var(--line-strong);border-radius:var(--r-lg) var(--r-lg) var(--r-xs) var(--r-lg);
  border-bottom-right-radius:var(--r-xs);padding:11px 15px}
[data-theme="light"] .msg.user .prose{border-color:rgba(99,83,232,.18)}

/* 附件 */
.msg-imgs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.msg-img{max-width:220px;max-height:220px;border-radius:var(--r-sm);border:1px solid var(--line-default);cursor:zoom-in;display:block;object-fit:cover}
.msg-files{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.file-chip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:var(--r-sm);
  background:var(--bg-2);border:1px solid var(--line-default);font-size:var(--fs-cap);color:var(--text-2)}
.file-chip i{font-style:normal;color:var(--accent)}

/* 系统回执 */
.msg-sys{margin:-6px 0 20px}
.msg-sys .op{border-style:dashed;background:transparent}
.msg-sys .oh{font-size:var(--fs-cap);color:var(--text-3)}

/* 指令卡片 */
.ops{margin-top:11px;display:flex;flex-direction:column;gap:8px;max-width:660px}
.op{border:1px solid var(--line-default);border-radius:var(--r-md);overflow:hidden;background:var(--bg-1);
  transition:transform var(--dur-base) var(--ease-out),box-shadow var(--dur-base),border-color var(--dur-base)}
.op:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm);border-color:var(--line-strong)}
.op .oh{min-height:42px;padding:0 13px;display:flex;align-items:center;gap:9px;font-size:var(--fs-ui);cursor:pointer;user-select:none;transition:background var(--dur-base)}
.op .oh:hover{background:var(--bg-2)}
.op .oh .oi{font-size:13px;color:var(--accent);opacity:.9}
.op .oh .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2)}
.op .oh .chev{color:var(--text-3);font-size:13px;transition:transform var(--dur-base) var(--ease-out)}
.op.open .oh .chev{transform:rotate(180deg)}
.op .ob{display:grid;grid-template-rows:0fr;opacity:0;padding:0 13px;
  transition:grid-template-rows 240ms var(--ease-out),opacity 200ms var(--ease-out),padding 240ms var(--ease-out)}
.op.open .ob{grid-template-rows:1fr;opacity:1;padding:12px 13px 14px;border-top:1px solid var(--line-subtle)}
.op .ob>*{overflow:hidden;min-height:0}
.op .ob .prose{font-size:var(--fs-cap);line-height:1.72}
.op .ob .kv{margin-bottom:3px}

/* 文档卡片 */
.doc-card{display:flex;align-items:center;gap:12px;min-height:60px;padding:11px 14px;width:100%;text-align:left;
  border:1px solid var(--line-default);border-radius:var(--r-sm);background:var(--bg-1);max-width:440px;cursor:pointer;
  transition:transform var(--dur-base) var(--ease-out),border-color var(--dur-base),box-shadow var(--dur-base)}
.doc-card:hover{transform:translateY(-1px);border-color:var(--line-strong);box-shadow:var(--shadow-sm)}
.doc-card .dic{width:36px;height:36px;border-radius:var(--r-xs);flex:0 0 auto;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);font-size:16px}
.doc-card .dtt{font-size:var(--fs-h6);font-weight:600;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-card .dmt{font-size:11px;color:var(--text-3);font-family:var(--font-mono)}
.doc-chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;margin:0 6px 6px 0;
  border-radius:var(--r-full);font-size:var(--fs-cap);color:var(--brand-200);cursor:pointer;
  background:var(--accent-soft);border:1px solid transparent;transition:filter var(--dur-base),transform var(--dur-base)}
.doc-chip:hover{filter:brightness(1.15);transform:translateY(-1px)}

/* ---------------- 输入区 ---------------- */
.composer{padding:0 24px 20px}
.composer-in{max-width:860px;margin:0 auto;position:relative}
.drop-hint{position:absolute;inset:-8px;border:2px dashed var(--accent);border-radius:var(--r-lg);
  background:var(--accent-soft);display:grid;place-items:center;font-size:var(--fs-ui);color:var(--brand-200);
  z-index:9;pointer-events:none;opacity:0;transition:opacity var(--dur-base)}
.composer.dragging .drop-hint{opacity:1}
.attach-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.attach{position:relative;display:flex;align-items:center;gap:8px;height:44px;padding:0 30px 0 8px;border-radius:var(--r-sm);
  background:var(--bg-2);border:1px solid var(--line-default);font-size:var(--fs-cap);color:var(--text-2);max-width:240px}
.attach img{width:30px;height:30px;border-radius:6px;object-fit:cover;flex:0 0 auto}
.attach .an{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attach .ax{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:6px;
  display:grid;place-items:center;color:var(--text-3);font-size:12px}
.attach .ax:hover{background:var(--bg-3);color:var(--danger)}
.cbox{border-radius:var(--r-lg);padding:3px 7px 3px 14px;display:flex;gap:6px;align-items:flex-end;
  background:var(--glass-bg);-webkit-backdrop-filter:var(--glass-filter);backdrop-filter:var(--glass-filter);
  border:1px solid var(--line-default);box-shadow:var(--shadow-md);
  transition:border-color var(--dur-base) var(--ease-out),box-shadow var(--dur-base) var(--ease-out)}
.cbox:focus-within{border-color:var(--line-strong);box-shadow:var(--shadow-md),0 0 0 3px var(--accent-soft)}
.cbox textarea{flex:1;min-width:0;background:none;border:0;padding:11px 0;max-height:200px;min-height:42px;
  font-size:var(--fs-body);line-height:1.62;box-shadow:none;border-radius:0;overflow-wrap:anywhere}
.cbox textarea:focus{box-shadow:none;background:none;border:0}
.crow{display:flex;gap:4px;align-items:center;flex:0 0 auto;padding-bottom:5px}
.crow .icon-btn{width:32px;height:32px;font-size:15px}
.send{width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center;font-size:15px;color:#fff;
  background:var(--brand-grad-matte);box-shadow:var(--shadow-brand),inset 0 1px 0 rgba(255,255,255,.26);
  transition:transform var(--dur-base) var(--ease-out),filter var(--dur-base)}
.send:hover{transform:translateY(-1px);filter:brightness(1.08)}
.send:active{transform:translateY(0) scale(.96)}
.send.stop{background:linear-gradient(140deg,#FF5D5D,#D63B3B)}
.send:disabled{opacity:.42}
.hint{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px;padding-left:4px;font-size:11px;color:var(--text-3)}
.hint code{background:var(--bg-3);padding:1px 6px;border-radius:5px;font-size:10.5px;color:var(--brand-200);font-family:var(--font-mono)}
.hint-toggle{font-size:11px;color:var(--text-3);padding:2px 8px;border-radius:var(--r-xs);border:1px solid var(--line-default)}
.hint-toggle:hover{color:var(--text-1);border-color:var(--line-strong)}
.hint-toggle i{font-style:normal;display:inline-block;transition:transform var(--dur-base) var(--ease-out)}
.hint.show-syn .hint-toggle i{transform:rotate(180deg)}
.hint-syn{display:none;gap:10px;flex-wrap:wrap;align-items:center}
.hint.show-syn .hint-syn{display:inline-flex}

/* ---------------- 统计气泡 ---------------- */
.bubble{position:absolute;bottom:calc(100% + 14px);left:0;z-index:6;max-width:min(420px,92vw);
  border-radius:var(--r-full);overflow:hidden;background:var(--glass-bg);
  -webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);
  border:1px solid var(--glass-line);box-shadow:var(--shadow-md);
  transition:border-radius var(--dur-slow) var(--ease-out),box-shadow var(--dur-slow),width var(--dur-slow);
  animation:rise 240ms var(--ease-out) both}
.bubble.open{width:344px;border-radius:var(--r-md);box-shadow:var(--shadow-lg);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%)}
html[data-glass="0"] .bubble{background:var(--bg-1);backdrop-filter:none}
.bub-head{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;width:100%;text-align:left}
.bubble.open .bub-head{height:44px;padding:0 14px}
.bub-orb{width:11px;height:11px;flex:0 0 auto;border-radius:50%;background:var(--brand-grad);box-shadow:0 0 10px rgba(124,108,255,.8)}
.bub-mini{font-size:11px;font-family:var(--font-mono);color:var(--text-2);white-space:nowrap}
.bub-mini b{color:var(--brand-200);font-weight:600}
.bub-chev{margin-left:auto;color:var(--text-3);font-size:12px;transition:transform var(--dur-slow) var(--ease-out)}
.bubble.open .bub-chev{transform:rotate(180deg)}
.bub-body{max-height:0;overflow:hidden;opacity:0;transition:max-height var(--dur-slow) var(--ease-out),opacity var(--dur-base)}
.bubble.open .bub-body{max-height:540px;opacity:1}
.bub-lbl{font-size:11px;color:var(--text-3);padding:0 14px 8px}
.bub-agents{display:flex;flex-direction:column;padding:0 14px}
.bub-chip{display:flex;align-items:center;gap:8px;height:34px;position:relative}
.bub-chip b{font-size:12px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bub-chip i{font-style:normal;font-size:10.5px;font-family:var(--font-mono);color:var(--text-3)}
.bub-chip em{font-style:normal;font-size:12px;font-family:var(--font-mono);color:var(--text-1);min-width:54px;text-align:right}
.bub-bar{position:absolute;left:0;bottom:0;height:2px;border-radius:var(--r-full);background:var(--brand-grad)}
.bub-sep{height:1px;background:var(--line-subtle);margin:10px 14px}
.bub-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 12px}
.bub-stat{background:var(--bg-2);border:1px solid var(--line-subtle);border-radius:var(--r-xs);padding:8px 10px}
.bub-stat span{display:block;font-size:10px;color:var(--text-3);margin-bottom:3px}
.bub-stat b{display:block;font-size:var(--fs-h5);font-family:var(--font-mono);font-weight:600}
.bub-stat.hl b{color:var(--brand-200)}
.bub-foot{display:flex;justify-content:space-between;padding:0 14px 12px;font-size:10.5px;color:var(--text-3);font-family:var(--font-mono)}

/* ---------------- 表单 / 卡片 ---------------- */
.page{max-width:900px;margin:0 auto;padding:26px 24px 72px;width:100%}
.page h2{margin:0 0 6px;font-size:var(--fs-h2);font-weight:650;letter-spacing:-.01em}
.page .sub{color:var(--text-3);font-size:var(--fs-cap);margin-bottom:20px;line-height:1.6}
.card{background:var(--bg-1);border:1px solid var(--line-default);border-radius:var(--r-lg);padding:22px;margin-bottom:14px}
.card>h3{margin:0 0 16px;font-size:var(--fs-h5);font-weight:600;display:flex;align-items:center;gap:8px}
.fld{margin-bottom:13px}
.fld:last-child{margin-bottom:0}
.fld label{display:block;font-size:11.5px;color:var(--text-3);margin-bottom:6px;letter-spacing:.02em}
.fld .hint2{font-size:11px;color:var(--text-3);margin-top:6px;line-height:1.6}
.row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.row>*{flex:1;min-width:150px}
.row .fix{flex:0 0 auto;min-width:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-subtle);margin-bottom:20px;overflow-x:auto}
.tabs button{padding:10px 14px;font-size:var(--fs-ui);color:var(--text-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;
  transition:color var(--dur-base) var(--ease-out),border-color var(--dur-base)}
.tabs button:hover{color:var(--text-1)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.emoji-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:8px}
.emoji-grid button{aspect-ratio:1;border-radius:var(--r-xs);font-size:16px;display:grid;place-items:center;
  background:var(--bg-2);border:1px solid var(--line-default);transition:transform var(--dur-base) var(--ease-out),border-color var(--dur-base)}
.emoji-grid button:hover{transform:translateY(-1px);border-color:var(--line-strong)}
.emoji-grid button.on{border-color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:var(--fs-cap);padding:5px 11px;border-radius:var(--r-full);
  color:var(--text-2);background:var(--bg-3);border:1px solid var(--line-default);cursor:pointer;
  transition:all var(--dur-base) var(--ease-out)}
.chip:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.chip.on{border-color:var(--accent);color:var(--brand-200);background:var(--accent-soft)}
.empty{text-align:center;color:var(--text-3);font-size:var(--fs-cap);padding:36px 12px;border:1px dashed var(--line-default);border-radius:var(--r-sm);line-height:1.7}
.switch{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line-subtle);min-height:56px}
.switch:last-child{border-bottom:0}
.switch .lbl{font-size:var(--fs-ui)}
.switch .dsc{font-size:11px;color:var(--text-3);margin-top:3px;line-height:1.55}
.tgl{width:42px;height:24px;border-radius:var(--r-full);flex:0 0 auto;position:relative;cursor:pointer;padding:2px;
  background:var(--bg-3);border:1px solid var(--line-default);
  transition:background var(--dur-base) var(--ease-in-out),border-color var(--dur-base)}
.tgl::before{content:"";position:absolute;inset:-9px}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--text-3);
  transition:transform var(--dur-base) var(--ease-spring),background var(--dur-base)}
.tgl.on{background:var(--brand-grad-matte);border-color:transparent}
.tgl.on::after{transform:translateX(18px);background:#fff}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.swatch{width:42px;height:42px;border-radius:var(--r-sm);border:1px solid var(--line-default);cursor:pointer;
  transition:transform var(--dur-base) var(--ease-out),border-color var(--dur-base),box-shadow var(--dur-base)}
.swatch:hover{transform:translateY(-2px)}
.swatch.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.slider{display:flex;align-items:center;gap:12px}
.slider input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:var(--line-default);padding:0;border:0}
.slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--brand-grad-matte);border:0;cursor:pointer;box-shadow:var(--shadow-brand)}
.slider .val{font-family:var(--font-mono);font-size:11px;color:var(--text-3);min-width:46px;text-align:right}

/* ---------------- 检索 ---------------- */
.search-bar{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.search-bar input{height:44px;font-size:var(--fs-h5)}
.search-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.hit{padding:14px 16px;border-radius:var(--r-sm);border:1px solid var(--line-default);background:var(--bg-1);margin-bottom:10px;cursor:pointer;
  transition:transform var(--dur-base) var(--ease-out),border-color var(--dur-base),box-shadow var(--dur-base)}
.hit:hover{transform:translateY(-1px);border-color:var(--line-strong);box-shadow:var(--shadow-sm)}
.hit .h1{font-size:var(--fs-ui);font-weight:600;margin-bottom:4px}
.hit .hm{font-size:10.5px;color:var(--text-3);font-family:var(--font-mono);margin-bottom:8px}
.hit .hb{font-size:var(--fs-cap);color:var(--text-2);line-height:1.72;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ---------------- 文档 ---------------- */
.docs{display:flex;height:100%}
.docs-list{width:290px;min-width:290px;background:var(--bg-1);border-right:1px solid var(--line-subtle);overflow-y:auto;padding:12px}
.docs-list .di{padding:9px 11px;border-radius:var(--r-sm);cursor:pointer;margin-bottom:3px;min-height:52px;
  transition:background var(--dur-base) var(--ease-out),box-shadow var(--dur-base)}
.docs-list .di:hover{background:var(--accent-soft)}
.docs-list .di.on{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.docs-list .di.on .t{color:var(--brand-200)}
.docs-list .di .t{font-size:var(--fs-ui);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.docs-list .di .m{font-size:10.5px;color:var(--text-3);font-family:var(--font-mono)}
.doc-edit{flex:1;display:flex;flex-direction:column;min-width:0}
.doc-bar{min-height:56px;padding:0 18px;border-bottom:1px solid var(--line-subtle);display:flex;gap:12px;align-items:center;background:var(--bg-1)}
.doc-bar input{font-size:var(--fs-h5);font-weight:600;background:none;border:0;padding:4px 0;box-shadow:none}
.doc-bar input:focus{box-shadow:none;border:0}
.doc-area{flex:1;display:flex;overflow:hidden}
.doc-area textarea{flex:1;border:0;background:none;font-family:var(--font-mono);font-size:var(--fs-code);line-height:1.9;
  resize:none;padding:32px 28px;max-width:800px;margin:0 auto;box-shadow:none}
.doc-area textarea:focus{box-shadow:none;background:none;border:0}

/* 抽屉 */
.drawer-scrim{position:fixed;inset:0;z-index:70;background:var(--scrim);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  opacity:0;transition:opacity var(--dur-base) var(--ease-out)}
.drawer-scrim.in{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:600px;max-width:100vw;z-index:71;background:var(--bg-1);
  border-left:1px solid var(--line-default);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform var(--dur-slow) var(--ease-out);box-shadow:-24px 0 60px rgba(0,0,0,.5)}
.drawer.in{transform:none}
.drawer-head{height:56px;min-height:56px;padding:0 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line-subtle)}
.drawer-head .dt{flex:1;min-width:0;font-size:var(--fs-h5);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawer-body{flex:1;overflow-y:auto;padding:32px 28px 64px}
.drawer-body .prose{max-width:760px;margin:0 auto;font-size:var(--fs-body);line-height:1.88}

/* ---------------- GitHub ---------------- */
.gh-repo{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:var(--r-sm);border:1px solid var(--line-default);
  background:var(--bg-1);margin-bottom:8px;cursor:pointer;transition:transform var(--dur-base),border-color var(--dur-base)}
.gh-repo:hover{transform:translateY(-1px);border-color:var(--line-strong)}
.gh-repo .rn{font-size:var(--fs-ui);font-weight:600}
.gh-repo .rd{font-size:11px;color:var(--text-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gh-file{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:var(--r-xs);font-size:var(--fs-cap);
  color:var(--text-2);cursor:pointer;font-family:var(--font-mono)}
.gh-file:hover{background:var(--accent-soft);color:var(--text-1)}
.log{background:var(--code-bg);border:1px solid var(--line-subtle);border-radius:var(--r-sm);padding:12px 14px;
  font-family:var(--font-mono);font-size:11.5px;line-height:1.7;color:#C8D0E6;max-height:340px;overflow:auto;white-space:pre-wrap}
[data-theme="light"] .log{color:#E8ECF7}

/* ---------------- 弹层 ---------------- */
.mask{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;
  background:var(--scrim);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;transition:opacity var(--dur-base) var(--ease-out)}
.mask.in{opacity:1}
.dlg{width:100%;max-width:560px;background:var(--bg-1);border:1px solid var(--line-default);border-radius:var(--r-xl);
  padding:24px;max-height:calc(100vh - 96px);overflow-y:auto;box-shadow:var(--shadow-lg);
  opacity:0;transform:scale(.965) translateY(8px);transition:all var(--dur-slow) var(--ease-out)}
.mask.in .dlg{opacity:1;transform:none}
.dlg.sm{max-width:420px}.dlg.lg{max-width:900px}
.dlg h3{margin:0 0 6px;font-size:var(--fs-h4);font-weight:600}
.dlg .dsc{font-size:var(--fs-cap);color:var(--text-3);margin-bottom:16px;line-height:1.6}
.dlg .act{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
.lightbox{position:fixed;inset:0;z-index:95;background:rgba(4,5,10,.9);display:grid;place-items:center;padding:24px;cursor:zoom-out;
  opacity:0;transition:opacity var(--dur-base)}
.lightbox.in{opacity:1}
.lightbox img{max-width:100%;max-height:100%;border-radius:var(--r-sm);box-shadow:0 24px 80px rgba(0,0,0,.7)}
.toasts{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:9px 16px;border-radius:var(--r-sm);font-size:var(--fs-cap);max-width:min(470px,90vw);background:var(--bg-1);
  border:1px solid var(--line-strong);box-shadow:var(--shadow-lg);opacity:0;transform:translateY(-10px) scale(.97);
  transition:all var(--dur-slow) var(--ease-out)}
.toast.in{opacity:1;transform:none}
.toast.err{border-color:var(--danger);color:var(--danger)}
.toast.ok{border-color:var(--success);color:var(--success)}

/* ---------------- 空态 ---------------- */
.welcome{max-width:860px;margin:0 auto;padding:52px 24px}
.welcome h1{font-size:var(--fs-h1);font-weight:650;letter-spacing:-.02em;margin:0 0 10px;line-height:1.3}
.welcome p{color:var(--text-2);font-size:var(--fs-body);margin:0 0 24px;max-width:620px;line-height:1.75}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:12px}
.wcard{border-radius:var(--r-md);padding:16px;cursor:pointer;background:var(--bg-1);border:1px solid var(--line-default);
  transition:transform var(--dur-base) var(--ease-out),border-color var(--dur-base),box-shadow var(--dur-base)}
.wcard:hover{transform:translateY(-2px);border-color:var(--line-strong);box-shadow:var(--shadow-md)}
.wcard b{display:flex;align-items:center;gap:8px;font-size:var(--fs-h6);margin-bottom:6px}
.wcard span{font-size:var(--fs-cap);color:var(--text-3);line-height:1.65}

/* 提及 */
.rel{position:relative}
.mention-pop{position:absolute;bottom:calc(100% + 10px);left:0;z-index:8;min-width:250px;max-height:250px;overflow-y:auto;
  background:var(--bg-1);border:1px solid var(--line-strong);border-radius:var(--r-md);padding:6px;box-shadow:var(--shadow-lg);
  animation:rise 180ms var(--ease-out) both}
.mention-pop .mi{display:flex;align-items:center;gap:9px;height:36px;padding:0 9px;border-radius:var(--r-xs);cursor:pointer;transition:background var(--dur-quick)}
.mention-pop .mi:hover{background:var(--accent-soft)}
.mention-pop .mi-n{font-size:var(--fs-cap)}

/* =======================================================================
 * 移动端
 * ===================================================================== */
@media (max-width:639px){
  :root{--font-scale:1.03;--radius-scale:1.05;--glass-blur:18px}
  .side{position:fixed;left:0;top:0;bottom:0;z-index:60;width:290px;min-width:290px;margin-left:0!important;
    border-right:1px solid var(--line-default);box-shadow:24px 0 60px rgba(0,0,0,.55);
    transform:translateX(-100%);transition:transform var(--dur-slow) var(--ease-out)}
  .app .side.open{transform:none}
  .app.collapsed .side{margin-left:0;transform:translateX(-100%)}
  .side-mask{display:block;position:fixed;inset:0;z-index:59;background:var(--scrim);opacity:0;pointer-events:none;
    transition:opacity var(--dur-slow) var(--ease-out)}
  .app.side-open .side-mask{opacity:1;pointer-events:auto}
  .side-head{padding:16px 14px 12px}
  .agent-item,.topic-item{height:48px}
  .topic-item{height:44px}
  .side-foot button{height:48px}
  .icon-btn{width:40px;height:40px}
  .btn{height:38px;padding:0 13px}
  .btn.sm{height:30px}
  .top{height:52px;min-height:52px;padding:0 8px;gap:6px}
  .top-info .t2{display:none}
  .top-actions .btn{display:none}
  .top-actions .btn.keep{display:inline-flex}
  .av{width:26px;height:26px;border-radius:8px}
  .av.lg{width:32px;height:32px;font-size:15px}
  .msgs{padding:16px 14px 24px;max-width:100%}
  .msg{gap:9px;margin-bottom:16px}
  .msg .bd{max-width:calc(100% - 40px)}
  .msg.user .bd{max-width:86%}
  .msg.user .prose{padding:10px 13px;border-radius:var(--r-md);border-bottom-right-radius:var(--r-xs)}
  .prose{font-size:14.5px;line-height:1.78}
  .ops{max-width:100%}
  .op .oh{min-height:44px;padding:0 12px}
  .op .ob .prose{font-size:12.5px}
  .doc-card{max-width:100%}
  .drawer{width:100vw;border-left:0}
  .drawer-body{padding:20px 16px 80px}
  .docs{flex-direction:column}
  .docs-list{width:100%;min-width:0;max-height:38vh;border-right:0;border-bottom:1px solid var(--line-subtle);padding:10px}
  .doc-area textarea{padding:18px 14px}
  .doc-bar{padding:0 12px;gap:8px}
  .page{padding:18px 14px 80px}
  .card{padding:16px;border-radius:var(--r-md)}
  .emoji-grid{grid-template-columns:repeat(7,1fr)}
  .tabs button{padding:9px 11px;font-size:var(--fs-cap)}
  .mask{align-items:flex-end;padding:0}
  .dlg{max-width:none;border-radius:var(--r-xl) var(--r-xl) 0 0;max-height:88vh;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
  .welcome{padding:32px 16px}

  /* 输入区：固定底栏 + 安全区 */
  .composer{padding:0 12px calc(10px + env(safe-area-inset-bottom))}
  .cbox{padding:3px 6px 3px 12px;border-radius:var(--r-md)}
  .cbox textarea{font-size:16px;min-height:40px;padding:10px 0}
  .crow .icon-btn{width:38px;height:38px;font-size:16px}
  .send{width:38px;height:38px}
  .hint{display:none}
  .attach{height:56px;max-width:200px}
  .attach img{width:42px;height:42px}

  /* 统计气泡 → 底部弹层 */
  .bubble{left:auto;right:0;bottom:calc(100% + 10px);max-width:min(76vw,300px)}
  .bubble.open{position:fixed;top:auto;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));
    width:auto;max-width:none;border-radius:var(--r-xl) var(--r-xl) 0 0;max-height:74vh;overflow-y:auto;z-index:75}
  .bubble.open::after{content:"";position:absolute;left:50%;transform:translateX(-50%);top:7px;width:38px;height:4px;
    border-radius:2px;background:var(--line-strong)}
  .bubble.open .bub-head{height:52px;padding-top:8px}
  .bubble.open .bub-body{max-height:none}
  .bub-grid{grid-template-columns:1fr 1fr}

  /* 底部导航 */
  .tabbar{display:flex;height:calc(56px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
    background:var(--bg-1);border-top:1px solid var(--line-default);flex:0 0 auto;box-shadow:0 -8px 24px rgba(0,0,0,.28)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:var(--text-3);font-size:10px;position:relative;transition:color var(--dur-base) var(--ease-out)}
  .tab i{font-style:normal;font-size:21px;line-height:1}
  .tab.on{color:var(--brand-200)}
  .tab.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:2px;
    border-radius:2px;background:var(--brand-grad)}
}
@media (min-width:640px) and (max-width:1023px){.side{width:244px;min-width:244px}}
@media (min-width:1440px){.msgs,.composer-in{max-width:960px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .aurora i{animation:none}
}

/* =======================================================================
 * 打磨层
 * ===================================================================== */
[data-theme="dark"]{--text-3:#848EAA}
[data-theme="light"]{--text-3:#7E88A3}
.side-foot button{font-size:12.5px}
.side-label{font-size:10px;letter-spacing:.14em}
.op{border-color:var(--line-default)}
.doc-bar .kv,.drawer-head .kv{white-space:nowrap}
.bub-orb{box-shadow:0 0 12px rgba(124,108,255,.85)}

@media (max-width:639px){
  .top{height:54px;min-height:54px;padding:0 12px;gap:8px}
  .top .icon-btn{width:38px;height:38px}
  .top-info .t1 b{font-size:14.5px}

  .msgs{padding:14px 14px 18px}

  .bub-grid{gap:6px}

  .bub-stat b{font-size:15px}

/* =======================================================================
 * 浮层体系（☰ 二级菜单 / 模型选择器 / Agent 菜单）
 * 依据 UI 设计师规范：只动画 transform/opacity/filter
 * ===================================================================== */
:root{
  --tint-hover:rgba(124,108,255,.10);
  --tint-active:rgba(124,108,255,.16);
  --tint-selected:rgba(124,108,255,.13);
  --shadow-float:0 1px 2px rgba(0,0,0,.28),0 14px 34px -10px rgba(0,0,0,.5),0 44px 84px -34px rgba(70,44,190,.42);
}
[data-theme="light"]{
  --tint-hover:rgba(99,83,232,.08);--tint-active:rgba(99,83,232,.13);--tint-selected:rgba(99,83,232,.10);
  --shadow-float:0 1px 2px rgba(24,20,60,.06),0 14px 34px -12px rgba(24,20,60,.18),0 36px 68px -34px rgba(76,60,200,.20);
}
.pop{
  position:fixed;z-index:70;padding:8px;border:1px solid var(--glass-line);border-radius:var(--r-lg);
  background:var(--glass-bg);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  box-shadow:var(--shadow-float),inset 0 1px 0 rgba(255,255,255,.16);
}
html[data-glass="0"] .pop{background:var(--bg-1);backdrop-filter:none}
.pop[hidden]{display:none}
.pop.in{animation:popIn 180ms var(--ease-out) both}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.pop-mask{position:fixed;inset:0;z-index:65;background:transparent}

.nav-item{display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 10px;border-radius:var(--r-sm);
  cursor:pointer;font-size:var(--fs-ui);color:var(--text-1);position:relative;isolation:isolate;text-align:left;user-select:none}
.nav-item::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:var(--tint-hover);opacity:0;transition:opacity var(--dur-quick) var(--ease-out)}
.nav-item:hover::before{opacity:1}
.nav-item:active{transform:scale(.985)}
.nav-item.on::before{background:var(--tint-selected);opacity:1}
.nav-item .ico{width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:var(--r-xs);color:var(--text-2);font-size:15px;transition:color var(--dur-quick)}
.nav-item:hover .ico{color:var(--accent)}
.nav-item .meta{margin-left:auto;font-size:11px;color:var(--text-3);max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-mono)}
.nav-item .kbd{margin-left:auto;font-size:10.5px;color:var(--text-3);font-family:var(--font-mono)}
.nav-group-title{height:28px;display:flex;align-items:center;padding:0 10px;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);user-select:none}
.nav-divider{height:1px;margin:6px 10px;background:var(--line-subtle)}
.nav-menu{width:244px;max-height:min(460px,calc(100dvh - 90px));overflow-y:auto}

.composer-meta{display:flex;align-items:center;gap:12px;margin:0 2px 9px;min-height:30px}
.composer-meta .bubble{position:static;bottom:auto;left:auto;margin:0 auto 0 0}
.model-pill{height:30px;display:inline-flex;align-items:center;gap:6px;padding:0 10px 0 6px;flex:none;
  border-radius:var(--r-lg);border:1px solid var(--glass-line);background:var(--glass-bg);cursor:pointer;position:relative;
  transition:border-color var(--dur-base),transform var(--dur-base) var(--ease-out)}
html[data-glass="0"] .model-pill{background:var(--bg-2)}
.model-pill::after{content:"";position:absolute;inset:-7px}
.model-pill:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.model-pill[aria-expanded="true"]{background:var(--tint-active);border-color:var(--line-strong)}
.model-pill .dot{width:20px;height:20px;border-radius:var(--r-xs);display:grid;place-items:center;font-size:11px;background:var(--tint-selected);color:var(--accent);flex:none}
.model-pill .name{font-size:12px;color:var(--text-2);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-mono)}
.model-pill .chev{font-size:11px;color:var(--text-3);transition:transform var(--dur-base) var(--ease-out)}
.model-pill[aria-expanded="true"] .chev{transform:rotate(180deg)}
.model-pop{width:296px;display:flex;flex-direction:column;max-height:min(420px,64dvh)}
.model-pop .search{height:34px;border-radius:var(--r-sm);padding:0 10px;font-size:12.5px;background:var(--bg-1);border:1px solid var(--line-subtle);margin-bottom:8px}
.model-pop .list{max-height:290px;overflow-y:auto;overscroll-behavior:contain}
.model-opt{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:var(--r-sm);cursor:pointer;position:relative;isolation:isolate}
.model-opt::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:var(--tint-hover);opacity:0;transition:opacity var(--dur-quick)}
.model-opt:hover::before{opacity:1}
.model-opt.on::before{background:var(--tint-selected);opacity:1}
.model-opt .nm{flex:1;min-width:0;font-size:12.5px;color:var(--text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-mono)}
.model-opt .ck{font-size:13px;color:var(--accent);opacity:0;flex:none}
.model-opt.on .ck{opacity:1}
.model-pop .prov-row{display:flex;gap:6px;flex-wrap:wrap;padding:0 2px 8px}
.model-pop .prov-row .chip{font-size:11px;padding:3px 9px}

.agent-menu-btn{height:36px;display:inline-flex;align-items:center;gap:8px;padding:0 10px 0 6px;max-width:230px;
  border-radius:var(--r-md);border:1px solid var(--glass-line);background:var(--glass-bg);cursor:pointer;position:relative;
  transition:border-color var(--dur-base)}
html[data-glass="0"] .agent-menu-btn{background:var(--bg-1)}
.agent-menu-btn::after{content:"";position:absolute;inset:-4px}
.agent-menu-btn:hover{border-color:var(--line-strong)}
.agent-menu-btn[aria-expanded="true"]{background:var(--tint-active);border-color:var(--line-strong)}
.agent-menu-btn .nm{font-size:13px;color:var(--text-1);max-width:126px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;unicode-bidi:plaintext}
.agent-menu-btn .chev{font-size:11px;color:var(--text-3);transition:transform var(--dur-base) var(--ease-out)}
.agent-menu-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.agent-pop{width:254px}
.agent-pop .agent-item{display:flex;align-items:center;gap:10px;width:100%;height:42px;padding:0 10px;border-radius:var(--r-sm);
  cursor:pointer;position:relative;isolation:isolate;text-align:left}
.agent-pop .agent-item::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:var(--tint-hover);opacity:0;transition:opacity var(--dur-quick)}
.agent-pop .agent-item:hover::before{opacity:1}
.agent-pop .agent-item.on::before{background:var(--tint-selected);opacity:1}
.agent-pop .agent-item .col{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.25}
.agent-pop .agent-item .nm{font-size:13px;color:var(--text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agent-pop .agent-item .rl{font-size:11px;color:var(--text-3);font-family:var(--font-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agent-pop .agent-item .ck{font-size:13px;color:var(--accent);flex:none}
.agent-pop .agent-item.dis{opacity:.42;pointer-events:none}
.agent-pop .agent-list{max-height:300px;overflow-y:auto}
.agent-item.is-main .nm{color:var(--brand-200)}

@media (max-width:639px){
  /* 此前这里直接 display:none，移动端点 ☰ 等于没反应。改为底部抽屉。 */
  .nav-menu{left:8px !important;right:8px !important;width:auto !important;
    top:auto !important;bottom:calc(8px + env(safe-area-inset-bottom)) !important;
    max-height:min(72dvh,620px)}
  .composer-meta{gap:8px;margin-bottom:8px}
  .model-pill{height:34px}
  .model-pill .name{max-width:92px}
  .model-pop{width:min(320px,calc(100vw - 24px))}
  .model-opt{height:44px}
  .agent-menu-btn{max-width:168px;padding:0 8px 0 5px}

/* ------------------------- 基础工具 ------------------------- */
const $ = (s, r = document) => r.querySelector(s);

function fmtTime(ts) {

}
function relTime(ts) {
  const s = (now() - ts) / 1000;
  if (s < 60) return '刚刚';
  if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
  if (s < 86400) return Math.floor(s / 3600) + ' 小时前';

/* ------------------------- Token 估算 ------------------------- */
/* 优先使用服务端返回的 usage；没有则按「中日韩字符≈1 token，其余≈4 字符/token」估算 */
function estimateTokens(text) {
  if (!text) return 0;
  const s = String(text);
  let cjk = 0, other = 0;
  for (const ch of s) {
    const c = ch.codePointAt(0);
    if ((c >= 0x2e80 && c <= 0x9fff) || (c >= 0xac00 && c <= 0xd7af) || (c >= 0xf900 && c <= 0xfaff) || (c >= 0xff00 && c <= 0xffef)) cjk++;
    else other++;

  return Math.max(1, Math.round(cjk * 0.95 + other / 4));
}

  return (msgs || []).reduce((n, m) => n + estimateTokens(m.content) + 4, 0);

/* ------------------------- Markdown（极简渲染） ------------------------- */
function mdRender(src) {
  const codes = [];
  let s = String(src == null ? '' : src);
  s = s.replace(/```([a-zA-Z0-9_+\-.#]*)[ \t]*\r?\n?([\s\S]*?)```/g, (m, lang, code) => {
    codes.push({ lang: lang || 'text', code: code.replace(/\n$/, '') });

    .replace(/`([^`\n]+)`/g, '<code class="ic">$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(（])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/~~([^~\n]+)~~/g, '<del>$1</del>')
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out = []; let i = 0;
  const isPh = (L) => /^\s*\u0000C\d+\u0000\s*$/.test(L);
  const isStart = (L) => isPh(L) || /^#{1,6}\s/.test(L) || /^\s*>/.test(L) || /^\s*[-*+]\s+/.test(L) || /^\s*\d+[.)]\s+/.test(L);
  while (i < lines.length) {
    const L = lines[i]; let m;
    if (isPh(L)) {

      i++; continue;
    }

    }

    }
    if (!L.trim()) { i++; continue; }
    const b = []; while (i < lines.length && lines[i].trim() && !isStart(lines[i])) { b.push(lines[i]); i++; }
    out.push('<p>' + inline(b.join('<br>')) + '</p>');

    if (!o.agents.some((a) => a.isMain)) o.agents.unshift(d.agents[0]);
    o.agents.forEach((a) => {
      a.skills = a.skills || [];
      a.tools = Object.assign({ delegate: true, docs: true, sandbox: false, search: false }, a.tools || {});
    });
    o.topics.forEach((t) => { if (!t.stats) t.stats = blankStats(); });
    return o;
  } catch (e) { return defaultState(); }
}
/* ------------------------- 存储适配层 -------------------------
 * 所有本地读写都走 Store，便于以后换成 IndexedDB / Tauri 文件系统。
 * 原实现把写入异常静默吞掉：一旦超出配额，用户会在毫无提示的情况下丢数据。 */
const Store = {
  lastError: null,
  isAvailable() {
    try { const k = '__lucifer_probe__'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; }
    catch (e) { return false; }
  },
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) {
    try { localStorage.setItem(k, v); Store.lastError = null; return true; }
    catch (e) { Store.lastError = e; return false; }
  },
  del(k) { try { localStorage.removeItem(k); return true; } catch (e) { return false; } },
  /* 粗略估算占用字节（UTF-16 约 2 字节/字符） */
  usage() {
    try {
      let n = 0;
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        n += (k.length + (Store.get(k) || '').length) * 2;
      }
      return n;
    } catch (e) { return 0; }
  },
};
let SAVE_WARNED = false;
function save() {
  const ok = Store.set(KEY, JSON.stringify(S));
  if (!ok && !SAVE_WARNED) {
    SAVE_WARNED = true;
    const reason = (Store.lastError && (Store.lastError.name || Store.lastError.message)) || '未知错误';
    toast('⚠️ 本地保存失败：' + reason + '（可能超出存储配额）。请到「设置 → 上下文与数据」导出备份并清理旧会话。', 'err');
  }
  return ok;
}

function blankStats() {
  return { requests: 0, promptTokens: 0, completionTokens: 0, totalTokens: 0, estimated: false, agents: {}, startedAt: null, lastAt: null, ms: 0 };
}
/* 记录一次请求的用量 */
function bumpStats(topic, agent, usage, promptText, completionText, ms) {
  const st = topic.stats || (topic.stats = blankStats());
  st.requests++;
  st.startedAt = st.startedAt || now();
  st.lastAt = now();
  st.ms += ms || 0;
  let pt, ct, est = false;
  if (usage && (usage.prompt_tokens || usage.completion_tokens || usage.total_tokens)) {
    pt = usage.prompt_tokens || 0; ct = usage.completion_tokens || 0;
  } else {
    pt = estimateMessages(promptText); ct = estimateTokens(completionText); est = true;
  }
  if (est) st.estimated = true;
  st.promptTokens += pt; st.completionTokens += ct;
  st.totalTokens = st.promptTokens + st.completionTokens;
  if (agent) {
    const k = agent.id;
    if (!st.agents[k]) st.agents[k] = { name: agent.name, role: agent.roleName, avatar: agent.avatar, calls: 0, tokens: 0 };
    st.agents[k].calls++;
    st.agents[k].tokens += (pt + ct);
    st.agents[k].name = agent.name; st.agents[k].avatar = agent.avatar;
  }
  return st;
}

/* ------------------------- Toast / Modal ------------------------- */
function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  const wrap = document.getElementById('toasts');
  wrap.appendChild(el);
  requestAnimationFrame(() => el.classList.add('in'));
  setTimeout(() => {
    el.classList.remove('in');
    setTimeout(() => el.remove(), 320);
  }, 2600);
}
function modal(html, onMount) {
  const m = document.createElement('div');
  m.className = 'mask';
  m.innerHTML = '<div class="dlg glass">' + html + '</div>';
  document.body.appendChild(m);
  requestAnimationFrame(() => m.classList.add('in'));
  const onKey = (e) => {
    if (e.key === 'Escape') { e.stopPropagation(); e.preventDefault(); close(); }
  };
  const close = () => {
    document.removeEventListener('keydown', onKey, true);
    m.classList.remove('in');
    setTimeout(() => m.remove(), 220);
  };
  document.addEventListener('keydown', onKey, true);
  m.addEventListener('mousedown', (e) => { if (e.target === m) close(); });
  if (onMount) onMount(m, close);
}

/* ------------------------- API ------------------------- */
/* 没写协议时的默认协议判定。
 * 之前一律补 https://，导致指向 http 的自建中转 / 本地服务必然 fetch 失败。
 * 规则：本机、局域网、无点主机名（nas、server 等）→ http://，其余 → https:// */
function pickScheme(u) {
  const host = String(u).split('/')[0].replace(/^\[[^\]]+\]/, (m) => m).split('@').pop();
  const name = host.replace(/:\d+$/, '');
  const isLocal =
    /^(localhost|127\.0\.0\.1|0\.0\.0\.0|::1)$/i.test(name) ||
    /^10\./.test(name) || /^192\.168\./.test(name) ||
    /^172\.(1[6-9]|2\d|3[01])\./.test(name) ||
    /\.local$/i.test(name) ||
    !name.includes('.');
  return isLocal ? 'http://' : 'https://';
}
function joinUrl(base, path) {
  if (!base) return '';
  let b = String(base).trim().replace(/\/+$/, '');
  if (!/^[a-z][a-z0-9+.\-]*:\/\//i.test(b)) b = pickScheme(b) + b;
  return b + path;
}
/* 把 fetch 失败翻译成人能看懂的原因，并带上真实 URL */
function fetchHint(url, e) {
  const u = String(url || '');
  if (location.protocol === 'https:' && /^http:\/\//i.test(u))
    return '页面是 https，却请求 http 接口 —— 被浏览器按混合内容拦下。改用 https，或使用桌面端 / 安卓端。';
  if (/localhost|127\.0\.0\.1|192\.168\.|10\.|\[::1\]|\.local/i.test(u))
    return '本地/内网地址不可达 —— 确认服务已启动、端口正确；网页版受浏览器限制时请改用桌面端。';
  if (e && e.name === 'AbortError') return '请求被取消。';
  return '地址不可达 / DNS 解析失败 / 被网络策略拦截（也可能是该服务不允许浏览器直连）。';
}
function apiHeaders(p) {
  const h = { 'Content-Type': 'application/json' };
  if (p.apiKey) h['Authorization'] = 'Bearer ' + p.apiKey;
  return h;
}
async function pullModels(p) {
  const url = joinUrl(p.baseUrl, '/models');
  if (!url) throw new Error('未填写 API 地址');
  const r = await fetch(url, { headers: apiHeaders(p) });
  const txt = await r.text();
  if (!r.ok) throw new Error('HTTP ' + r.status + ' · ' + txt.slice(0, 180));
  let j; try { j = JSON.parse(txt); } catch (e) { throw new Error('返回内容不是合法 JSON'); }
  const arr = j.data || j.models || j.result || [];
  const ids = arr.map((m) => (typeof m === 'string' ? m : (m.id || m.name || m.model))).filter(Boolean);
  if (!ids.length) throw new Error('接口未返回模型列表（试试手动填写模型名）');
  return ids;
}

/* 流式调用；onDelta 增量；onUsage 拿到真实用量 */
async function streamChat(agent, messages, onDelta, signal, onUsage) {
  const p = providerFor(agent);
  if (!p) throw new Error('没有可用的 API 配置，请到「设置」添加');
  if (!p.baseUrl) throw new Error('API 地址为空，请到「设置」填写');
  const model = modelFor(agent);
  if (!model) throw new Error('未选择模型，请到「设置」拉取并选择模型');
  const url = joinUrl(p.baseUrl, '/chat/completions');
  const body = {
    model, messages, stream: true, temperature: 0.6,
    stream_options: { include_usage: true },   // 支持的服务商会回传 usage
  };
  let r;
  const doFetch = () => fetch(url, { method: 'POST', headers: apiHeaders(p), body: JSON.stringify(body), signal });
  try { r = await doFetch(); }
  catch (e) {
    if (e && e.name === 'AbortError') throw e;
    throw new Error('请求失败 → ' + url + '\n原因：' + (e.message || e) + '\n' + fetchHint(url, e));
  }
  // 少数服务商不认 stream_options，回退重试一次
  if (!r.ok && (r.status === 400 || r.status === 422)) {
    delete body.stream_options;
    try { r = await doFetch(); } catch (e2) { if (e2 && e2.name === 'AbortError') throw e2; }
  }
  if (!r.ok) { const t = await r.text().catch(() => ''); throw new Error('HTTP ' + r.status + ' · ' + t.slice(0, 300)); }
  if (!r.body || !r.body.getReader) {
    const j = await r.json();
    const txt = j.choices && j.choices[0] && j.choices[0].message ? j.choices[0].message.content || '' : '';
    if (onUsage && j.usage) onUsage(j.usage);
    if (onDelta) onDelta(txt);
    return txt;
  }
  const reader = r.body.getReader();
  const dec = new TextDecoder('utf-8');
  let buf = '', full = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const parts = buf.split('\n');
    buf = parts.pop();
    for (const line of parts) {
      const t = line.trim();
      if (!t || t.startsWith(':')) continue;
      const d = t.startsWith('data:') ? t.slice(5).trim() : t;
      if (!d || d === '[DONE]') continue;
      try {
        const j = JSON.parse(d);
        if (onUsage && j.usage) onUsage(j.usage);
        const ch = j.choices && j.choices[0];
        const c = ch && ch.delta ? ch.delta.content : (ch && ch.message ? ch.message.content : null);
        if (c) { full += c; if (onDelta) onDelta(c); }
      } catch (e) { /* 忽略分片 */ }
    }
  }
  return full;
}

/* ------------------------- 指令解析 ------------------------- */
const RE_CALL = /<call\s+agent\s*=\s*["']([^"']+)["']\s*>([\s\S]*?)<\/call>/g;
const RE_SANDBOX = /<sandbox(?:\s+lang\s*=\s*["']([^"']+)["'])?\s*>([\s\S]*?)<\/sandbox>/g;
const RE_SEARCH = /<search(?:\s+count\s*=\s*["'](\d+)["'])?\s*>([\s\S]*?)<\/search>/g;
const RE_GH = /<gh\s+([^>]*?)(?:\/>|>([\s\S]*?)<\/gh>)/g;
const RE_DOC = /<doc\s+op\s*=\s*["']([^"']+)["']\s*([^>]*?)(?:\/>|>([\s\S]*?)<\/doc>)/g;

function extractDirectives(text) {
  const ops = []; let m;
  RE_CALL.lastIndex = 0;
  while ((m = RE_CALL.exec(text))) ops.push({ type: 'call', agent: m[1].trim(), task: m[2].trim(), index: m.index });
  RE_DOC.lastIndex = 0;
  while ((m = RE_DOC.exec(text))) {
    const attrs = m[2] || '';
    const title = (attrs.match(/title\s*=\s*["']([^"']*)["']/) || [])[1] || '';
    ops.push({ type: 'doc', op: (m[1] || '').toLowerCase(), title: title.trim(), content: (m[3] || '').trim(), index: m.index });
  }
  RE_SANDBOX.lastIndex = 0;
  while ((m = RE_SANDBOX.exec(text))) ops.push({ type: 'sandbox', lang: m[1] || 'python', code: m[2].trim(), index: m.index });
  RE_SEARCH.lastIndex = 0;
  while ((m = RE_SEARCH.exec(text))) ops.push({ type: 'search', count: m[1] ? +m[1] : 0, query: m[2].trim(), index: m.index });
  RE_GH.lastIndex = 0;
  while ((m = RE_GH.exec(text))) {
    const a = m[1] || '';
    const g = (k) => (a.match(new RegExp(k + '\\s*=\\s*["\']([^"\']*)["\']')) || [])[1] || '';
    ops.push({ type: 'gh', op: g('op') || 'list', repo: g('repo'), path: g('path'), name: g('name'), branch: g('branch') || 'main', message: g('message') || g('msg'), workflow: g('workflow'), priv: g('private'), content: (m[2] || '').trim(), index: m.index });
  }
  ops.sort((a, b) => a.index - b.index);
  return ops;
}
function stripDirectives(text) {
  RE_CALL.lastIndex = 0; RE_DOC.lastIndex = 0; RE_SANDBOX.lastIndex = 0;
  RE_SEARCH.lastIndex = 0; RE_GH.lastIndex = 0;
  return String(text)
    .replace(RE_CALL, '').replace(RE_DOC, '').replace(RE_SANDBOX, '')
    .replace(RE_SEARCH, '').replace(RE_GH, '')
    .replace(/\n{3,}/g, '\n\n').trim();
}

function teamRoster(excludeId) {

}
function buildSystem(agent) {

    : '\n\n【可用工具】当前未启用任何工具（云沙盒 / 联网检索 / GitHub 均未配置或未开启）。');

/* 上下文预算：中文约 1.6 字符/token，粗估够用（只用于闸门判断） */
function estTokens(str) { return Math.ceil(String(str || '').length / 1.6); }

function apiMessages(agent, topic, maxHist) {
  const sys = { role: 'system', content: buildSystem(agent) };
  const out = [sys];
  /* 被压缩掉的旧轮次用摘要代替，UI 里的完整历史不受影响 */
  if (topic && topic.summary) out.push({ role: 'system', content: '【更早对话的摘要（已压缩）】\n' + topic.summary });
  const hist = topic.messages
    .filter((m) => (m.role === 'user' || m.role === 'assistant') && !m.compacted)
    .slice(-(maxHist || 24));
  return out.concat(hist.map((m) => ({ role: m.role, content: toApiContent(m) })));
}

function topicTokens(agent, topic) {
  let n = estTokens(buildSystem(agent)) + 8;
  if (topic.summary) n += estTokens(topic.summary);
  for (const m of topic.messages) {
    if (m.role !== 'user' && m.role !== 'assistant') continue;
    if (m.compacted) continue;
    n += estTokens(toApiContent(m)) + 8;
  }
  return n;
}

/* 接近预算就把最旧的轮次交给模型压成摘要，并标记为已压缩（只影响下发给 API 的内容） */
async function compactTopic(agent, topic) {
  const cx = S.settings.ctx || (S.settings.ctx = { autoCompact: true, tokenBudget: 24000, keepMessages: 12 });
  if (cx.autoCompact === false) return false;
  const budget = Math.max(4000, Number(cx.tokenBudget) || 24000);
  if (topicTokens(agent, topic) < budget * 0.75) return false;
  const keep = Math.max(4, Number(cx.keepMessages) || 12);
  const older = topic.messages.filter((m) => (m.role === 'user' || m.role === 'assistant') && !m.compacted);
  if (older.length <= keep + 2) return false;
  const cut = older.slice(0, older.length - keep);
  const prev = topic.summary ? '【已有摘要】\n' + topic.summary + '\n\n' : '';
  const body = cut.map((m) => (m.role === 'user' ? '用户：' : '助手：') + String(m.content || '').slice(0, 1500)).join('\n\n');
  const sys = { role: 'system', content:
    '你是上下文压缩器。把给定对话压成一份供后续推理继续使用的摘要，必须保留：目标任务、已达成的结论、关键事实与数据（含数字、路径、ID）、未完成事项、用户的偏好与约束。删掉寒暄、过程叙述与重复内容。只输出摘要正文，不要客套。' };
  try {
    let acc = '';
    await streamChat(agent, [sys, { role: 'user', content: (prev + body).slice(0, 24000) }],
      (c) => { acc += c; }, ABORT ? ABORT.signal : undefined, null);
    if (!acc.trim()) return false;
    topic.summary = acc.trim();
    topic.summarizedCount = (topic.summarizedCount || 0) + cut.length;
    topic.compactedAt = now();
    cut.forEach((m) => { m.compacted = true; });
    save();
    return true;
  } catch (e) { return false; }
}

/* ------------------------- 子 Agent 回执 ------------------------- */
/* 子 Agent 的价值是「上下文隔离」：给它独立的小上下文，只回传结论 */
const RECEIPT_RULE = '\n\n【回执要求】你的输出会被回传给主控 Agent，请直接给结论：'
  + '① 结论（做了什么、结果如何）② 产物（文档标题 / 文件路径 / 关键数据）③ 引用来源。'
  + '不要复述思考过程，不要寒暄，不要重复任务描述。';
function buildReceipt(target, raw) {
  const txt = String(raw || '').trim();
  const limit = Math.max(300, Number((S.settings || {}).receiptLimit) || 1200);
  const docs = []; const re = /<doc[^>]*\btitle\s*=\s*["']([^"']+)["']/g;
  let m; while ((m = re.exec(txt))) docs.push(m[1]);
  const body = txt.length > limit
    ? txt.slice(0, limit) + '\n…（回执已截断，原始 ' + txt.length + ' 字）'
    : txt;
  return '【' + target.name + ' @' + target.roleName + ' 的回执】\n' + body
    + (docs.length ? '\n· 本次产出文档：' + Array.from(new Set(docs)).join('、') : '');
}

/* ------------------------- 文档操作 ------------------------- */
function execDocOp(op) {
  const agentId = S.ui.activeAgentId;
  switch (op.op) {
    case 'create': {
      const ex = findDoc(op.title);
      if (ex) { ex.content = op.content; ex.updatedAt = now(); return '文档「' + op.title + '」已存在，已覆盖全文。'; }
      S.docs.unshift({ id: uid('d'), title: op.title || '未命名文档', content: op.content, ownerId: agentId, shared: true, updatedAt: now() });
      return '已创建文档「' + op.title + '」。';
    }
    case 'append': {
      const d = findDoc(op.title);
      if (!d) return '未找到文档「' + op.title + '」，请先用 create 创建。';
      d.content = (d.content || '') + '\n\n' + op.content; d.updatedAt = now();
      return '已向「' + op.title + '」追加内容（当前 ' + d.content.length + ' 字）。';
    }
    case 'update': {
      const d = findDoc(op.title);
      if (!d) return '未找到文档「' + op.title + '」。';
      d.content = op.content; d.updatedAt = now();
      return '已更新文档「' + op.title + '」。';
    }
    case 'read': {
      const d = findDoc(op.title);
      if (!d) return '未找到文档「' + op.title + '」。';
      return '【文档「' + d.title + '」正文】\n' + d.content;
    }
    case 'list':
      return '【文档列表】\n' + (S.docs.length ? S.docs.map((d) => '- ' + d.title + '（' + relTime(d.updatedAt) + '）').join('\n') : '（空）');
    case 'delete': {
      const d = findDoc(op.title);
      if (!d) return '未找到文档「' + op.title + '」。';
      S.docs = S.docs.filter((x) => x.id !== d.id);
      return '已删除文档「' + op.title + '」。';
    }
    default:
      return '不支持的文档操作：' + op.op;
  }
}

/* ------------------------- Skill：从 GitHub 拉取 ------------------------- */
function normalizeSkillUrl(input) {
  let u = String(input || '').trim();
  if (!u) return '';
  if (/^lobehub\.com\//i.test(u)) u = 'https://' + u;
  let m;
  if ((m = u.match(/^https?:\/\/lobehub\.com\/skills\/([^\/\s?#]+)/i))) return 'https://lobehub.com/skills/' + m[1] + '/skill.md';
  if ((m = u.match(/^https?:\/\/github\.com\/([^\/\s]+)\/([^\/\s]+)\/(?:tree|blob)\/([^\/\s]+)\/?(.*)$/i))) {
    const sub = m[4] ? m[4].replace(/\/+$/, '') + '/' : '';
    return 'https://raw.githubusercontent.com/' + m[1] + '/' + m[2] + '/' + m[3] + '/' + sub + 'SKILL.md';
  }
  if ((m = u.match(/^https?:\/\/github\.com\/([^\/\s]+)\/([^\/\s]+?)(?:\.git)?\/?$/i)))
    return 'https://raw.githubusercontent.com/' + m[1] + '/' + m[2] + '/HEAD/SKILL.md';
  return u;
}
function parseSkill(text, source) {
  let name = '', desc = '', body = text;
  const m = text.match(/^---\s*\r?\n([\s\S]*?)\r?\n---\s*\r?\n?/);
  if (m) {
    const fm = m[1]; body = text.slice(m[0].length);
    const g = (k) => { const r = fm.match(new RegExp('^' + k + '\\s*:\\s*(.+)$', 'mi')); return r ? r[1].trim().replace(/^["']|["']$/g, '') : ''; };
    name = g('name'); desc = g('description');
  }
  if (!name) {
    const h = body.match(/^#\s+(.+)$/m);
    name = (h ? h[1] : (source || '').split('/').pop() || 'skill').trim();
  }
  return { id: uid('sk'), name, desc, source, content: text, addedAt: now() };
}
async function fetchSkill(url) {
  const r = await fetch(url, { headers: { Accept: 'text/plain,*/*' } });
  if (!r.ok) throw new Error('HTTP ' + r.status + '（' + url + '）');
  const t = await r.text();
  if (/^\s*<(!doctype|html)/i.test(t)) throw new Error('拿到的是网页而不是 SKILL.md，请改用 raw 链接');
  return t;
}

function bindChat() {

  ta.addEventListener('paste', (ev) => {
    const files = Array.from((ev.clipboardData && ev.clipboardData.files) || []);
    if (files.length) { ev.preventDefault(); addFiles(files); }
  });
  const fi = $('#fileInput');
  if (fi) fi.addEventListener('change', () => { addFiles(Array.from(fi.files || [])); fi.value = ''; });
  const box = document.querySelector('.composer');
  if (box && !box.dataset.dnd) {
    box.dataset.dnd = '1';
    box.addEventListener('dragover', (ev) => { ev.preventDefault(); box.classList.add('dragging'); });
    box.addEventListener('dragleave', () => box.classList.remove('dragging'));
    box.addEventListener('drop', (ev) => {
      ev.preventDefault(); box.classList.remove('dragging');
      addFiles(Array.from((ev.dataTransfer && ev.dataTransfer.files) || []));
    });
  }
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); doSend(); }
  });
}
