<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>AgentHub · 多智能体中枢</title>
<style>
/* =======================================================================
 * AgentHub · Liquid Glass 设计系统
 * 参考：Apple Liquid Glass 的 web 实现思路（backdrop blur + saturate +
 *      多层内发光 + 边缘高光 + 掠射光带），只动画 transform/opacity 以保证丝滑
 * ===================================================================== */

*{box-sizing:border-box}
:root{
  --ink:#f3f6fd; --ink2:#c2cbe0; --ink3:#97a1ba;
  --glass:rgba(255,255,255,.055);
  --glass-hi:rgba(255,255,255,.10);
  --stroke:rgba(255,255,255,.13);
  --stroke-hi:rgba(255,255,255,.26);
  --shadow:0 18px 50px -12px rgba(0,0,0,.62);
  --ac:#8b93ff; --ac2:#63d2ff; --ok:#43e2a0; --warn:#ffc46b; --err:#ff7d7d;
  --r:18px; --r2:13px; --r3:9px;
  --ease:cubic-bezier(.22,1,.36,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Segoe UI","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
html,body{height:100%;margin:0}
body{
  background:#05060c; color:var(--ink); font-family:var(--font);
  font-size:14px; line-height:1.62; overflow:hidden;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{
  font-family:inherit;font-size:13px;color:var(--ink);
  background:rgba(255,255,255,.045); border:1px solid var(--stroke);
  border-radius:var(--r2); padding:9px 12px; outline:none; width:100%;
  transition:border-color .22s var(--ease),background .22s var(--ease),box-shadow .22s var(--ease);
}
input:focus,textarea:focus,select:focus{
  border-color:rgba(139,147,255,.75); background:rgba(255,255,255,.07);
  box-shadow:0 0 0 3px rgba(139,147,255,.16);
}
textarea{resize:vertical;line-height:1.65}
input::placeholder,textarea::placeholder{color:rgba(192,202,226,.74)}
select option{background:#141824;color:var(--ink)}
a{color:var(--ac2);text-decoration:none}
a:hover{text-decoration:underline}
code{font-family:var(--mono)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:9px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.24);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
::selection{background:rgba(139,147,255,.35)}

/* ---------------- 极光背景（玻璃的折射对象） ---------------- */
.aurora{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.aurora i{
  position:absolute;display:block;border-radius:50%;
  filter:blur(78px);opacity:.6;will-change:transform;
  animation:drift 34s var(--ease) infinite alternate;
}
.aurora i:nth-child(1){width:52vw;height:52vw;left:-8vw;top:-12vw;background:radial-gradient(circle at 30% 30%,#5b4bff,#2a1d7a 70%,transparent);}
.aurora i:nth-child(2){width:46vw;height:46vw;right:-6vw;top:-6vw;background:radial-gradient(circle at 60% 40%,#1ea7ff,#0b3f77 70%,transparent);animation-duration:42s;animation-delay:-6s}
.aurora i:nth-child(3){width:44vw;height:44vw;left:18vw;bottom:-18vw;background:radial-gradient(circle at 40% 60%,#ff4fd8,#5a1550 70%,transparent);opacity:.42;animation-duration:50s;animation-delay:-14s}
.aurora i:nth-child(4){width:38vw;height:38vw;right:6vw;bottom:-14vw;background:radial-gradient(circle at 50% 50%,#00e0c0,#054c48 70%,transparent);opacity:.38;animation-duration:38s;animation-delay:-22s}
@keyframes drift{
  0%{transform:translate3d(0,0,0) scale(1)}
  50%{transform:translate3d(4vw,3vw,0) scale(1.14)}
  100%{transform:translate3d(-3vw,5vw,0) scale(1.05)}
}
/* 细颗粒，降低玻璃的塑料感 */
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.035;
  background-image:radial-gradient(rgba(255,255,255,.9) .5px,transparent .5px);
  background-size:3px 3px;mix-blend-mode:overlay}

/* ---------------- 玻璃基类 ---------------- */
.glass{
  position:relative;
  background:linear-gradient(152deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.045) 42%,rgba(255,255,255,.028) 100%);
  -webkit-backdrop-filter:blur(26px) saturate(185%);
  backdrop-filter:blur(26px) saturate(185%);
  border:1px solid var(--stroke);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.30), inset 0 -1px 0 rgba(255,255,255,.06), inset 1px 0 0 rgba(255,255,255,.10);
}
/* 镜面高光：左上方一抹反射，玻璃的关键"通透感"来源 */
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(130% 90% at 10% -20%, rgba(255,255,255,.17), rgba(255,255,255,.04) 42%, transparent 62%);
}
/* 掠射光带：只在 hover / open 时位移，永远是 transform */
.glass::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(112deg,transparent 34%,rgba(255,255,255,.14) 47%,rgba(255,255,255,.05) 53%,transparent 66%);
  transform:translate3d(-130%,0,0);opacity:0;
  transition:transform 1.05s var(--ease),opacity .5s var(--ease);
}
.glass:hover::after{transform:translate3d(130%,0,0);opacity:1}
/* 大面板不做整块掠射，避免扫光干扰阅读 */
.side::after,.doc-area::after{display:none}

/* ---------------- 布局 ---------------- */
.app{position:relative;z-index:2;display:flex;height:100vh;overflow:hidden;gap:12px;padding:12px}
.side{
  width:266px;min-width:266px;border-radius:var(--r);display:flex;flex-direction:column;
  overflow:hidden;
  transition:margin-left .42s var(--ease),opacity .3s var(--ease);
}
.app.collapsed .side{margin-left:-278px;opacity:0}
.main{flex:1;display:flex;flex-direction:column;min-width:0;gap:12px}

/* ---------------- 侧栏 ---------------- */
.side-head{padding:17px 16px 15px;display:flex;align-items:center;gap:12px}
.logo{
  width:34px;height:34px;border-radius:11px;flex:0 0 auto;
  background:linear-gradient(140deg,var(--ac),var(--ac2) 55%,#ff6fe0);
  display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;
  box-shadow:0 6px 20px -4px rgba(139,147,255,.75), inset 0 1px 0 rgba(255,255,255,.5);
}
.brand b{display:block;font-size:14px;line-height:1.28;letter-spacing:.3px}
.brand span{display:block;font-size:10.5px;color:var(--ink3);letter-spacing:.25px;margin-top:3px;line-height:1.3}
.side-search{padding:0 14px 12px}
.side-search input{
  padding:9px 13px;font-size:12.5px;border-radius:13px;
  background:rgba(255,255,255,.055);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10),inset 0 -1px 0 rgba(0,0,0,.18);
}
.side-scroll{flex:1;overflow-y:auto;padding-bottom:10px}
.side-label{
  padding:13px 16px 6px;font-size:11px;color:var(--ink3);
  display:flex;align-items:center;justify-content:space-between;letter-spacing:.7px;text-transform:uppercase;
}
.side-label button{font-size:15px;line-height:1;color:var(--ink2);padding:1px 8px;border-radius:8px;transition:all .2s var(--ease)}
.side-label button:hover{background:var(--glass-hi);color:var(--ink);transform:scale(1.1)}
.agent-item{
  display:flex;align-items:center;gap:10px;padding:8px 12px;margin:2px 9px;
  border-radius:var(--r2);cursor:pointer;position:relative;overflow:hidden;
  transition:background .24s var(--ease),transform .24s var(--ease),box-shadow .24s var(--ease);
}
.agent-item:hover{background:rgba(255,255,255,.07);transform:translateX(2px)}
.agent-item.on{
  background:linear-gradient(100deg,rgba(139,147,255,.24),rgba(99,210,255,.10));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 4px 16px -6px rgba(139,147,255,.6);
}
.agent-item .meta{min-width:0;flex:1}
.agent-item .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent-item .rl{font-size:10.5px;color:var(--ink3);font-family:var(--mono)}
.side-foot{border-top:1px solid rgba(255,255,255,.09);padding:11px 11px 13px;display:flex;flex-direction:column;gap:3px}
.side-foot button{
  width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;
  font-size:13px;color:var(--ink2);transition:all .22s var(--ease);
}
.side-foot button:hover{background:rgba(255,255,255,.08);color:var(--ink);transform:translateX(2px)}
.side-foot .ico{width:18px;text-align:center;opacity:.9}
.side-foot span{flex:1}

/* ---------------- 头像 ---------------- */
.av{
  width:28px;height:28px;border-radius:9px;flex:0 0 auto;object-fit:cover;display:flex;
  align-items:center;justify-content:center;font-size:15px;
  background:linear-gradient(150deg,rgba(255,255,255,.16),rgba(255,255,255,.05));
  border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.28);
}
.av.lg{width:40px;height:40px;border-radius:13px;font-size:20px}
.av.sm{width:22px;height:22px;border-radius:7px;font-size:12px}
.av.xs{width:17px;height:17px;border-radius:6px;font-size:10px}

/* ---------------- 顶栏 ---------------- */
.top{
  height:60px;min-height:60px;border-radius:var(--r);display:flex;align-items:center;
  gap:11px;padding:0 16px;overflow:hidden;
}
.icon-btn{
  width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--ink2);flex:0 0 auto;position:relative;
  transition:all .22s var(--ease);
}
.icon-btn:hover{background:rgba(255,255,255,.10);color:var(--ink);transform:translateY(-1px)}
.icon-btn:active{transform:scale(.94)}
.burger{flex-direction:column;gap:4px}
.burger i{display:block;width:16px;height:1.6px;border-radius:2px;background:currentColor;transition:transform .3s var(--ease),width .3s var(--ease)}
.burger:hover i:nth-child(1){width:11px}
.burger:hover i:nth-child(3){width:11px}
.top-info{min-width:0;flex:1}
.top-info .t1{font-size:13.5px;display:flex;align-items:center;gap:7px}
.top-info .t2{font-size:11px;color:var(--ink3);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}

/* ---------------- 按钮 ---------------- */
.btn{
  padding:7px 13px;border-radius:11px;font-size:12.5px;color:var(--ink2);white-space:nowrap;
  background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.04));
  border:1px solid var(--stroke);box-shadow:inset 0 1px 0 rgba(255,255,255,.20);
  transition:all .24s var(--ease);position:relative;overflow:hidden;
}
.btn:hover{color:var(--ink);border-color:var(--stroke-hi);transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 22px -10px rgba(0,0,0,.9)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.pri{
  background:linear-gradient(150deg,#8b93ff,#5f6bff 60%,#4aa8ff);border-color:rgba(255,255,255,.28);
  color:#fff;box-shadow:0 10px 26px -10px rgba(110,120,255,.95),inset 0 1px 0 rgba(255,255,255,.45);
}
.btn.pri:hover{filter:brightness(1.08);color:#fff}
.btn.danger{border-color:rgba(255,125,125,.36);color:#ffa9a9}
.btn.danger:hover{background:rgba(255,80,80,.16);color:#ffc9c9}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.sm{padding:5px 10px;font-size:11.5px;border-radius:9px}
.btn.fix{flex:0 0 auto}
.btn.full{width:100%;margin-bottom:9px}

/* ---------------- 通用 ---------------- */
.body{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.kv{font-family:var(--mono);font-size:11.5px;color:var(--ink3)}
.kv.pad{padding:6px 16px}
.dim{color:var(--ink3)}
.mt{margin-top:12px}
.tag{
  font-size:10.5px;padding:2px 8px;border-radius:7px;font-family:var(--mono);
  background:rgba(255,255,255,.07);color:var(--ink3);border:1px solid rgba(255,255,255,.10);
}
.tag.main{background:linear-gradient(140deg,rgba(139,147,255,.30),rgba(255,111,224,.20));color:#cfc9ff;border-color:rgba(160,150,255,.42)}
.tag.ok{background:rgba(67,226,160,.14);color:#7ff0bf;border-color:rgba(67,226,160,.34)}
.tag.warn{background:rgba(255,196,107,.14);color:#ffd79a;border-color:rgba(255,196,107,.34)}
.tag.err{background:rgba(255,125,125,.15);color:#ffb3b3;border-color:rgba(255,125,125,.36)}
.spin{width:12px;height:12px;border:2px solid rgba(255,255,255,.18);border-top-color:var(--ac);border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.caret{color:var(--ac);animation:blink 1.05s steps(2) infinite}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}

/* ---------------- 对话 ---------------- */
.msgs{max-width:830px;margin:0 auto;padding:26px 22px 20px;width:100%}
.msg{display:flex;gap:12px;margin-bottom:22px;align-items:flex-start;animation:rise .45s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
.msg .bd{min-width:0;flex:1}
.msg .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.msg .hd b{font-size:13px}
.prose{font-size:13.5px;word-break:break-word;overflow-wrap:anywhere}
.prose p{margin:0 0 10px}
.prose p:last-child{margin-bottom:0}
.prose h1,.prose h2,.prose h3,.prose h4,.prose h5,.prose h6{margin:15px 0 8px;font-size:14px;line-height:1.45}
.prose h1{font-size:17px}.prose h2{font-size:15.5px}.prose h3{font-size:14.5px}
.prose ul,.prose ol{margin:0 0 10px;padding-left:22px}
.prose li{margin:3px 0}
.prose blockquote{margin:0 0 10px;padding:3px 0 3px 13px;border-left:2px solid rgba(139,147,255,.5);color:var(--ink2)}
.prose hr{border:0;border-top:1px solid rgba(255,255,255,.11);margin:15px 0}
.prose code.ic{background:rgba(255,255,255,.09);padding:2px 6px;border-radius:6px;font-size:12.5px;color:#d9c4ff}
.prose pre.code{margin:0 0 10px;background:rgba(6,8,15,.62);border:1px solid var(--stroke);border-radius:var(--r2);overflow:hidden;backdrop-filter:blur(8px)}
.prose pre.code .bar{display:flex;justify-content:space-between;align-items:center;padding:5px 11px;background:rgba(255,255,255,.045);border-bottom:1px solid rgba(255,255,255,.09);font-size:11px;color:var(--ink3);font-family:var(--mono)}
.prose pre.code .bar button{font-size:11px;color:var(--ink3);transition:color .2s}
.prose pre.code .bar button:hover{color:var(--ink)}
.prose pre.code code{display:block;padding:12px 14px;overflow-x:auto;font-size:12.5px;line-height:1.65;color:#cbd5ea}
.msg.user{flex-direction:row-reverse}
.msg.user .bd{flex:0 1 auto}
.msg.user .prose{
  background:linear-gradient(150deg,rgba(139,147,255,.30),rgba(99,210,255,.14));
  border:1px solid rgba(255,255,255,.20);border-radius:16px;padding:10px 15px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 26px -14px rgba(139,147,255,.9);
  backdrop-filter:blur(12px)
}

/* 系统回执（折叠条） */
.msg-sys{margin:-8px 0 22px;animation:rise .4s var(--ease) both}
.msg-sys .op{border-style:dashed;background:linear-gradient(160deg,rgba(255,255,255,.035),rgba(255,255,255,.012))}
.msg-sys .oh{font-size:11.5px;color:var(--ink3);padding-right:14px}
.msg-sys .oh .tag{margin-right:4px}

/* 指令卡片 */
.ops{margin-top:11px;display:flex;flex-direction:column;gap:9px}
.op{
  border:1px solid var(--stroke);border-radius:var(--r2);overflow:hidden;
  background:linear-gradient(160deg,rgba(28,32,48,.66),rgba(16,19,30,.5));
  transition:border-color .24s var(--ease),box-shadow .24s var(--ease);
}
.op:hover{border-color:var(--stroke-hi);box-shadow:0 12px 30px -16px rgba(0,0,0,.95)}
.op .oh{display:flex;align-items:center;gap:9px;padding:9px 12px;font-size:12px;cursor:pointer;transition:background .2s}
.op .oh:hover{background:rgba(255,255,255,.05)}
.op .oh .oi{opacity:.8}
.op .oh .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.op .oh .chev{color:var(--ink3);transition:transform .3s var(--ease);font-size:13px}
.op.open .oh .chev{transform:rotate(180deg)}
.op .ob{max-height:0;overflow:hidden;transition:max-height .42s var(--ease);padding:0 13px}
.op.open .ob{max-height:1400px;padding:11px 13px 13px;border-top:1px solid rgba(255,255,255,.08)}
.op .ob .prose{font-size:12.5px}
.op .ob .kv{margin-bottom:2px}

/* ---------------- 输入区 ---------------- */
.composer{padding:0 22px 20px}
.composer-in{max-width:830px;margin:0 auto;position:relative}
.cbox{
  border-radius:22px;padding:10px 11px 10px 17px;display:flex;gap:9px;align-items:flex-end;
  transition:box-shadow .3s var(--ease),border-color .3s var(--ease);
}
.cbox:focus-within{
  border-color:rgba(139,147,255,.55);
  box-shadow:var(--shadow),0 0 0 4px rgba(139,147,255,.14),inset 0 1px 0 rgba(255,255,255,.34);
}
.cbox textarea{background:none;border:0;padding:7px 0;max-height:180px;min-height:26px;font-size:13.5px;box-shadow:none}
.cbox textarea:focus{box-shadow:none;background:none;border:0}
.crow{display:flex;gap:6px;align-items:center;flex:0 0 auto;padding-bottom:2px}
.crow .icon-btn{width:31px;height:31px;border-radius:10px;font-size:14px}
.send{
  width:36px;height:36px;border-radius:13px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;
  background:linear-gradient(150deg,#8b93ff,#5f6bff 60%,#4aa8ff);
  box-shadow:0 8px 22px -8px rgba(110,120,255,.95),inset 0 1px 0 rgba(255,255,255,.45);
  transition:all .26s var(--ease);
}
.send:hover{transform:translateY(-2px) scale(1.04);filter:brightness(1.08)}
.send:active{transform:scale(.95)}
.send.stop{background:linear-gradient(150deg,#ff7d7d,#e24b4b);box-shadow:0 8px 22px -8px rgba(255,90,90,.9),inset 0 1px 0 rgba(255,255,255,.4)}
.hint{
  font-size:11.5px;color:#9aa5c0;margin-top:11px;display:flex;gap:10px;
  flex-wrap:wrap;align-items:center;padding-left:10px;
}
.hint code{background:rgba(255,255,255,.09);padding:2px 7px;border-radius:6px;font-size:10.5px;color:#cfc6ff;font-family:var(--mono)}
.hint-toggle{
  font-size:11px;color:var(--ink3);padding:2px 9px;border-radius:8px;
  border:1px solid rgba(255,255,255,.12);transition:all .22s var(--ease);
}
.hint-toggle:hover{color:var(--ink);background:rgba(255,255,255,.07)}
.hint-toggle i{font-style:normal;display:inline-block;transition:transform .3s var(--ease)}
.hint.show-syn .hint-toggle i{transform:rotate(180deg)}
.hint-syn{display:none;gap:10px;flex-wrap:wrap;align-items:center}
.hint.show-syn .hint-syn{display:inline-flex;animation:rise .3s var(--ease) both}

/* ---------------- 统计气泡 ---------------- */
.bubble{
  position:absolute;bottom:calc(100% + 20px);right:0;z-index:6;
  border-radius:16px;overflow:hidden;min-width:190px;max-width:min(430px,92vw);
  transition:box-shadow .35s var(--ease),border-color .35s var(--ease);
  animation:rise .5s var(--ease) both;
}
.bubble.open{border-color:rgba(139,147,255,.42);box-shadow:var(--shadow),0 0 0 4px rgba(139,147,255,.10),inset 0 1px 0 rgba(255,255,255,.34)}
.bub-head{display:flex;align-items:center;gap:9px;padding:8px 14px;width:100%;text-align:left}
.bub-orb{
  width:9px;height:9px;border-radius:50%;flex:0 0 auto;position:relative;
  background:radial-gradient(circle at 32% 32%,#fff,#8b93ff 45%,#4aa8ff);
  box-shadow:0 0 12px rgba(139,147,255,.95);
}
.bub-orb::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid rgba(139,147,255,.5);animation:pulse 2.6s var(--ease) infinite}
@keyframes pulse{0%{transform:scale(.7);opacity:.9}70%{transform:scale(1.35);opacity:0}100%{opacity:0}}
.bub-mini{font-size:12px;color:var(--ink2);white-space:nowrap}

<div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<div class="toasts" id="toasts"></div>
<script>
/* =======================================================================
 * AgentHub · 多智能体中枢  ——  核心逻辑（Part 1 / 2）
 * ===================================================================== */

/* ------------------------- 基础工具 ------------------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = (p) => (p || 'x') + Math.random().toString(36).slice(2, 9);
const now = () => Date.now();
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function fmtTime(ts) {
  const d = new Date(ts); const p = (n) => String(n).padStart(2, '0');
  return d.getMonth() + 1 + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function relTime(ts) {
  const s = (now() - ts) / 1000;
  if (s < 60) return '刚刚';
  if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
  if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
  return Math.floor(s / 86400) + ' 天前';
}
function fmtNum(n) {
  n = n || 0;
  if (n < 1000) return String(Math.round(n));
  if (n < 1000000) return (n / 1000).toFixed(n < 10000 ? 2 : 1).replace(/\.0+$/, '') + 'k';
  return (n / 1000000).toFixed(2) + 'M';
}

/* ------------------------- Token 估算 ------------------------- */
/* 优先使用服务端返回的 usage；没有则按「中日韩字符≈1 token，其余≈4 字符/token」估算 */
function estimateTokens(text) {
  if (!text) return 0;
  const s = String(text);
  let cjk = 0, other = 0;
  for (const ch of s) {
    const c = ch.codePointAt(0);
    if ((c >= 0x2e80 && c <= 0x9fff) || (c >= 0xac00 && c <= 0xd7af) || (c >= 0xf900 && c <= 0xfaff) || (c >= 0xff00 && c <= 0xffef)) cjk++;
    else other++;
  }
  return Math.max(1, Math.round(cjk * 0.95 + other / 4));
}
function estimateMessages(msgs) {
  return (msgs || []).reduce((n, m) => n + estimateTokens(m.content) + 4, 0);
}

/* ------------------------- Markdown（极简渲染） ------------------------- */
function mdRender(src) {
  const codes = [];
  let s = String(src == null ? '' : src);
  s = s.replace(/```([a-zA-Z0-9_+\-.#]*)[ \t]*\r?\n?([\s\S]*?)```/g, (m, lang, code) => {
    codes.push({ lang: lang || 'text', code: code.replace(/\n$/, '') });
    return '\n\u0000C' + (codes.length - 1) + '\u0000\n';
  });
  const lines = esc(s).split(/\r?\n/);
  const inline = (t) => t
    .replace(/`([^`\n]+)`/g, '<code class="ic">$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(（])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/~~([^~\n]+)~~/g, '<del>$1</del>')
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out = []; let i = 0;
  const isPh = (L) => /^\s*\u0000C\d+\u0000\s*$/.test(L);
  const isStart = (L) => isPh(L) || /^#{1,6}\s/.test(L) || /^\s*>/.test(L) || /^\s*[-*+]\s+/.test(L) || /^\s*\d+[.)]\s+/.test(L);
  while (i < lines.length) {
    const L = lines[i]; let m;
    if (isPh(L)) {
      const idx = +L.trim().replace(/[\u0000C]/g, '');
      const c = codes[idx];
      out.push('<pre class="code"><div class="bar"><span>' + esc(c.lang) + '</span><button class="copybtn" data-idx="' + idx + '">复制</button></div><code>' + esc(c.code) + '</code></pre>');
      i++; continue;
    }
    if ((m = L.match(/^(#{1,6})\s+(.*)$/))) { out.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>'); i++; continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(L)) { out.push('<hr>'); i++; continue; }
    if (/^\s*>/.test(L)) {
      const b = []; while (i < lines.length && /^\s*>/.test(lines[i])) { b.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
      out.push('<blockquote>' + inline(b.join('<br>')) + '</blockquote>'); continue;
    }
    if (/^\s*[-*+]\s+/.test(L)) {
      const it = []; while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) { it.push(inline(lines[i].replace(/^\s*[-*+]\s+/, ''))); i++; }
      out.push('<ul>' + it.map((x) => '<li>' + x + '</li>').join('') + '</ul>'); continue;
    }
    if (/^\s*\d+[.)]\s+/.test(L)) {
      const it = []; while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) { it.push(inline(lines[i].replace(/^\s*\d+[.)]\s+/, ''))); i++; }
      out.push('<ol>' + it.map((x) => '<li>' + x + '</li>').join('') + '</ol>'); continue;
    }
    if (!L.trim()) { i++; continue; }
    const b = []; while (i < lines.length && lines[i].trim() && !isStart(lines[i])) { b.push(lines[i]); i++; }
    out.push('<p>' + inline(b.join('<br>')) + '</p>');
  }
  return out.join('');
}

/* ------------------------- 预设 Provider ------------------------- */
const PRESETS = [
  { id: 'openai', name: 'OpenAI', baseUrl: 'https://api.openai.com/v1' },
  { id: 'deepseek', name: 'DeepSeek 深度求索', baseUrl: 'https://api.deepseek.com/v1' },
  { id: 'moonshot', name: 'Moonshot / Kimi', baseUrl: 'https://api.moonshot.cn/v1' },
  { id: 'zhipu', name: '智谱 GLM', baseUrl: 'https://open.bigmodel.cn/api/paas/v4' },
  { id: 'dashscope', name: '通义千问 DashScope', baseUrl: 'https://dashscope.aliyuncs.com/compatible-mode/v1' },
  { id: 'siliconflow', name: 'SiliconFlow 硅基流动', baseUrl: 'https://api.siliconflow.cn/v1' },
  { id: 'openrouter', name: 'OpenRouter', baseUrl: 'https://openrouter.ai/api/v1' },
  { id: 'ollama', name: 'Ollama（本地）', baseUrl: 'http://localhost:11434/v1' },
  { id: 'lmstudio', name: 'LM Studio（本地）', baseUrl: 'http://localhost:1234/v1' },
  { id: 'custom', name: '自定义地址', baseUrl: '' },
];
const EMOJIS = ['🧠','🤖','👨‍💻','👩‍💻','🕵️','📚','🔬','✍️','🎨','🎬','🎵','⚙️','🛠️','📊','🧩','🗂️','📝','🌐','🚀','🛡️','🧪','💡','🧭','🎯','🐧','🐳','☁️','🔮','🦾','🪄'];

/* ------------------------- 默认状态 ------------------------- */
const MAIN_PROMPT = `你是「总控 Agent」，一支多智能体团队的指挥官。职责：拆解目标 → 分派任务 → 汇总结果 → 沉淀文档。

【可调用的指令】直接写在回复正文里，前端会自动执行并把结果回传给你：

1. 派发任务给子 Agent：
<call agent="@角色名">要派发的具体任务（写清目标、约束、期望产出）</call>

2. 文档操作（交接与知识沉淀）：
<doc op="create" title="文档标题">正文内容</doc>
<doc op="append" title="文档标题">追加内容</doc>
<doc op="update" title="文档标题">替换后的全文</doc>
<doc op="read" title="文档标题"/>
<doc op="list"/>
<doc op="delete" title="文档标题"/>

【工作规则】
- 一条回复里可以包含多个指令，前端按顺序执行。
- 需要子 Agent 的产出时用 <call>；收到回执后再输出最终答复，不要把任务原样复述给用户。
- 面向用户的话要简洁、结论先行，不要暴露内部指令语法。
- 重要结论与交接信息必须写进文档，而不是只留在对话里。`;

function defaultState() {
  const pid = 'openai';
  return {
    v: 2,
    settings: {
      providers: [{ id: pid, name: 'OpenAI', baseUrl: 'https://api.openai.com/v1', apiKey: '', models: [] }],
      activeProviderId: pid,
      defaultModel: '',
      sandbox: { endpoint: '', apiKey: '', enabled: false, provider: 'e2b' },
      maxRounds: 6,
    },
    agents: [{
      id: 'main', isMain: true, name: '总控', roleName: 'main', avatar: '🧠',
      desc: '团队指挥官，负责任务拆解与分派',
      systemPrompt: MAIN_PROMPT, providerId: '', model: '',
      skills: [], tools: { delegate: true, docs: true, sandbox: false, search: false },
    }],
    docs: [{
      id: uid('d'), title: '交接说明', ownerId: 'main', shared: true, updatedAt: now(),
      content: '# 交接说明\n\n这里是团队共享文档区。任何 Agent 都可以通过文档指令读写，用于任务交接与知识沉淀。\n\n## 用法\n\n- 总控在派活前后，把背景 / 约束 / 产出写进文档，子 Agent 可读取。\n- 长任务建议一任务一文档，标题写清楚。\n',
    }],
    topics: [],
    ui: {
      view: 'chat', activeAgentId: 'main', activeTopicId: null, editAgentId: null,
      editTab: 'base', activeDocId: null, collapsed: false, drafting: '', statsOpen: false, _q: '',
    },
  };
}

/* ------------------------- 状态 ------------------------- */
const KEY = 'agenthub.state.v2';
let S = null, ABORT = null, RUNNING = false;

function load() {
  try {
    const raw = localStorage.getItem(KEY) || localStorage.getItem('agenthub.state.v1');
    if (!raw) return defaultState();
    const o = JSON.parse(raw); const d = defaultState();
    o.settings = Object.assign(d.settings, o.settings || {});
    o.settings.sandbox = Object.assign(d.settings.sandbox, (o.settings || {}).sandbox || {});
    o.agents = Array.isArray(o.agents) && o.agents.length ? o.agents : d.agents;
    o.docs = Array.isArray(o.docs) ? o.docs : d.docs;
    o.topics = Array.isArray(o.topics) ? o.topics : [];
    o.ui = Object.assign(d.ui, o.ui || {});
    if (!o.agents.some((a) => a.isMain)) o.agents.unshift(d.agents[0]);
    o.agents.forEach((a) => {
      a.skills = a.skills || [];
      a.tools = Object.assign({ delegate: true, docs: true, sandbox: false, search: false }, a.tools || {});
    });

function blankStats() {

/* 记录一次请求的用量 */
function bumpStats(topic, agent, usage, promptText, completionText, ms) {
  const st = topic.stats || (topic.stats = blankStats());
  st.requests++;
  st.startedAt = st.startedAt || now();
  st.lastAt = now();
  st.ms += ms || 0;
  let pt, ct, est = false;
  if (usage && (usage.prompt_tokens || usage.completion_tokens || usage.total_tokens)) {
    pt = usage.prompt_tokens || 0; ct = usage.completion_tokens || 0;
  } else {
    pt = estimateMessages(promptText); ct = estimateTokens(completionText); est = true;
  }
  if (est) st.estimated = true;
  st.promptTokens += pt; st.completionTokens += ct;
  st.totalTokens = st.promptTokens + st.completionTokens;
  if (agent) {
    const k = agent.id;
    if (!st.agents[k]) st.agents[k] = { name: agent.name, role: agent.roleName, avatar: agent.avatar, calls: 0, tokens: 0 };
    st.agents[k].calls++;
    st.agents[k].tokens += (pt + ct);
    st.agents[k].name = agent.name; st.agents[k].avatar = agent.avatar;
  }
  return st;
}

/* ------------------------- API ------------------------- */
function joinUrl(base, path) {
  if (!base) return '';
  let b = String(base).trim().replace(/\/+$/, '');
  if (!/^https?:\/\//i.test(b)) b = 'https://' + b;
  return b + path;
}
function apiHeaders(p) {
  const h = { 'Content-Type': 'application/json' };
  if (p.apiKey) h['Authorization'] = 'Bearer ' + p.apiKey;
  return h;
}
async function pullModels(p) {
  const url = joinUrl(p.baseUrl, '/models');
  if (!url) throw new Error('未填写 API 地址');
  const r = await fetch(url, { headers: apiHeaders(p) });
  const txt = await r.text();
  if (!r.ok) throw new Error('HTTP ' + r.status + ' · ' + txt.slice(0, 180));
  let j; try { j = JSON.parse(txt); } catch (e) { throw new Error('返回内容不是合法 JSON'); }
  const arr = j.data || j.models || j.result || [];
  const ids = arr.map((m) => (typeof m === 'string' ? m : (m.id || m.name || m.model))).filter(Boolean);
  if (!ids.length) throw new Error('接口未返回模型列表（试试手动填写模型名）');
  return ids;
}

/* 流式调用；onDelta 增量；onUsage 拿到真实用量 */
async function streamChat(agent, messages, onDelta, signal, onUsage) {
  const p = providerFor(agent);
  if (!p) throw new Error('没有可用的 API 配置，请到「设置」添加');
  if (!p.baseUrl) throw new Error('API 地址为空，请到「设置」填写');
  const model = modelFor(agent);
  if (!model) throw new Error('未选择模型，请到「设置」拉取并选择模型');
  const url = joinUrl(p.baseUrl, '/chat/completions');
  const body = {
    model, messages, stream: true, temperature: 0.6,
    stream_options: { include_usage: true },   // 支持的服务商会回传 usage
  };
  let r;
  const doFetch = () => fetch(url, { method: 'POST', headers: apiHeaders(p), body: JSON.stringify(body), signal });
  try { r = await doFetch(); }
  catch (e) {
    if (e && e.name === 'AbortError') throw e;
    throw new Error('网络请求失败：' + (e.message || e) + '（可能是 CORS 或地址不可达）');
  }
  // 少数服务商不认 stream_options，回退重试一次
  if (!r.ok && (r.status === 400 || r.status === 422)) {
    delete body.stream_options;
    try { r = await doFetch(); } catch (e2) { if (e2 && e2.name === 'AbortError') throw e2; }
  }
  if (!r.ok) { const t = await r.text().catch(() => ''); throw new Error('HTTP ' + r.status + ' · ' + t.slice(0, 300)); }
  if (!r.body || !r.body.getReader) {
    const j = await r.json();
    const txt = j.choices && j.choices[0] && j.choices[0].message ? j.choices[0].message.content || '' : '';
    if (onUsage && j.usage) onUsage(j.usage);
    if (onDelta) onDelta(txt);
    return txt;
  }
  const reader = r.body.getReader();
  const dec = new TextDecoder('utf-8');
  let buf = '', full = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const parts = buf.split('\n');
    buf = parts.pop();
    for (const line of parts) {
      const t = line.trim();
      if (!t || t.startsWith(':')) continue;
      const d = t.startsWith('data:') ? t.slice(5).trim() : t;
      if (!d || d === '[DONE]') continue;
      try {
        const j = JSON.parse(d);
        if (onUsage && j.usage) onUsage(j.usage);
        const ch = j.choices && j.choices[0];
        const c = ch && ch.delta ? ch.delta.content : (ch && ch.message ? ch.message.content : null);
        if (c) { full += c; if (onDelta) onDelta(c); }
      } catch (e) { /* 忽略分片 */ }
    }
  }
  return full;
}

/* ------------------------- 指令解析 ------------------------- */
const RE_CALL = /<call\s+agent\s*=\s*["']([^"']+)["']\s*>([\s\S]*?)<\/call>/g;
const RE_DOC = /<doc\s+op\s*=\s*["']([^"']+)["']\s*([^>]*?)(?:\/>|>([\s\S]*?)<\/doc>)/g;

function extractDirectives(text) {
  const ops = []; let m;
  RE_CALL.lastIndex = 0;
  while ((m = RE_CALL.exec(text))) ops.push({ type: 'call', agent: m[1].trim(), task: m[2].trim(), index: m.index });
  RE_DOC.lastIndex = 0;
  while ((m = RE_DOC.exec(text))) {
    const attrs = m[2] || '';
    const title = (attrs.match(/title\s*=\s*["']([^"']*)["']/) || [])[1] || '';
    ops.push({ type: 'doc', op: (m[1] || '').toLowerCase(), title: title.trim(), content: (m[3] || '').trim(), index: m.index });
  }
  ops.sort((a, b) => a.index - b.index);
  return ops;
}
function stripDirectives(text) {
  RE_CALL.lastIndex = 0; RE_DOC.lastIndex = 0;
  return String(text).replace(RE_CALL, '').replace(RE_DOC, '').replace(/\n{3,}/g, '\n\n').trim();
}

function execDocOp(op) {
  const agentId = S.ui.activeAgentId;
  switch (op.op) {
    case 'create': {
      const ex = findDoc(op.title);
      if (ex) { ex.content = op.content; ex.updatedAt = now(); return '文档「' + op.title + '」已存在，已覆盖全文。'; }
      S.docs.unshift({ id: uid('d'), title: op.title || '未命名文档', content: op.content, ownerId: agentId, shared: true, updatedAt: now() });
      return '已创建文档「' + op.title + '」。';
    }
    case 'append': {
      const d = findDoc(op.title);
      if (!d) return '未找到文档「' + op.title + '」，请先用 create 创建。';
      d.content = (d.content || '') + '\n\n' + op.content; d.updatedAt = now();
      return '已向「' + op.title + '」追加内容（当前 ' + d.content.length + ' 字）。';
    }
    case 'update': {
      const d = findDoc(op.title);
      if (!d) return '未找到文档「' + op.title + '」。';
      d.content = op.content; d.updatedAt = now();
      return '已更新文档「' + op.title + '」。';
    }
    case 'read': {
      const d = findDoc(op.title);
      if (!d) return '未找到文档「' + op.title + '」。';
      return '【文档「' + d.title + '」正文】\n' + d.content;
    }
    case 'list':
      return '【文档列表】\n' + (S.docs.length ? S.docs.map((d) => '- ' + d.title + '（' + relTime(d.updatedAt) + '）').join('\n') : '（空）');
    case 'delete': {
      const d = findDoc(op.title);
      if (!d) return '未找到文档「' + op.title + '」。';
      S.docs = S.docs.filter((x) => x.id !== d.id);
      return '已删除文档「' + op.title + '」。';
    }
    default:
      return '不支持的文档操作：' + op.op;
  }
}

/* ------------------------- Skill：从 GitHub 拉取 ------------------------- */
function normalizeSkillUrl(input) {
  let u = String(input || '').trim();
  if (!u) return '';
  if (/^lobehub\.com\//i.test(u)) u = 'https://' + u;
  let m;
  if ((m = u.match(/^https?:\/\/lobehub\.com\/skills\/([^\/\s?#]+)/i))) return 'https://lobehub.com/skills/' + m[1] + '/skill.md';
  if ((m = u.match(/^https?:\/\/github\.com\/([^\/\s]+)\/([^\/\s]+)\/(?:tree|blob)\/([^\/\s]+)\/?(.*)$/i))) {
    const sub = m[4] ? m[4].replace(/\/+$/, '') + '/' : '';
    return 'https://raw.githubusercontent.com/' + m[1] + '/' + m[2] + '/' + m[3] + '/' + sub + 'SKILL.md';
  }
  if ((m = u.match(/^https?:\/\/github\.com\/([^\/\s]+)\/([^\/\s]+?)(?:\.git)?\/?$/i)))
    return 'https://raw.githubusercontent.com/' + m[1] + '/' + m[2] + '/HEAD/SKILL.md';
  return u;
}
function parseSkill(text, source) {
  let name = '', desc = '', body = text;
  const m = text.match(/^---\s*\r?\n([\s\S]*?)\r?\n---\s*\r?\n?/);
  if (m) {
    const fm = m[1]; body = text.slice(m[0].length);
    const g = (k) => { const r = fm.match(new RegExp('^' + k + '\\s*:\\s*(.+)$', 'mi')); return r ? r[1].trim().replace(/^["']|["']$/g, '') : ''; };
    name = g('name'); desc = g('description');
  }
  if (!name) {
    const h = body.match(/^#\s+(.+)$/m);
    name = (h ? h[1] : (source || '').split('/').pop() || 'skill').trim();
  }
  return { id: uid('sk'), name, desc, source, content: text, addedAt: now() };
}
async function fetchSkill(url) {
  const r = await fetch(url, { headers: { Accept: 'text/plain,*/*' } });
  if (!r.ok) throw new Error('HTTP ' + r.status + '（' + url + '）');
  const t = await r.text();
  if (/^\s*<(!doctype|html)/i.test(t)) throw new Error('拿到的是网页而不是 SKILL.md，请改用 raw 链接');
  return t;
}

/* ------------------------- 对话主流程 ------------------------- */
async function doSend() {
  if (RUNNING) { stopRun(); return; }
  const ta = $('#input'); if (!ta) return;
  const text = ta.value.trim(); if (!text) return;
  ta.value = ''; S.ui.drafting = '';
  hideMention();
  await runTurn(text);
}
function stopRun() { if (ABORT) { try { ABORT.abort(); } catch (e) {} } RUNNING = false; toast('已停止'); }

function appendTurn(html) {
  const wrap = $('#msgs .msgs');
  if (!wrap) return null;
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  const el = tmp.firstElementChild;
  wrap.appendChild(el);
  scrollDown();
  return el;
}
function scrollDown() { const sc = $('#msgs'); if (sc) sc.scrollTop = sc.scrollHeight; }
function setSendState(running) {
  const b = $('.send'); if (!b) return;
  b.classList.toggle('stop', running);
  b.textContent = running ? '■' : '➤';
}

async function runTurn(userText) {
  const agent = curAgent();
  const topic = ensureTopic(agent.id);
  if (topic.messages.length === 0) topic.title = userText.slice(0, 18);
  topic.messages.push({ role: 'user', content: userText, ts: now(), by: agent.id });
  save();
  renderChat();

  RUNNING = true; ABORT = new AbortController();
  setSendState(true);
  const maxRounds = S.settings.maxRounds || 6;
  try {
    for (let round = 1; round <= maxRounds; round++) {
      // 先取上下文（此时不含本轮的空占位），再落一条助手消息占位
      const msgs = apiMessages(agent, topic);
      const msg = { role: 'assistant', content: '', ops: [], ts: now(), round, by: agent.id };
      topic.messages.push(msg);
      const el = appendTurn(msgHTML(agent, msg));
      if (!el) break;
      const bodyEl = el.querySelector('.prose');

      let usage = null;
      const t0 = now();
      let full = '', last = 0;
      full = await streamChat(agent, msgs, (c) => {
        full += c;
        const t = now();
        if (t - last > 60) { last = t; bodyEl.innerHTML = mdRender(stripDirectives(full)) + '<span class="caret">▍</span>'; scrollDown(); }
      }, ABORT.signal, (u) => { usage = u; });
      const dt = now() - t0;

      msg.raw = full;
      msg.content = stripDirectives(full);
      msg.ms = dt;
      bodyEl.innerHTML = mdRender(msg.content || '（无正文输出）');
      bumpStats(topic, agent, usage, msgs, full, dt);
      refreshBubble();
      save();

      const ops = extractDirectives(full);
      if (!ops.length) break;

      msg.ops = ops;
      const opsEl = document.createElement('div');
      opsEl.className = 'ops';
      el.querySelector('.bd').appendChild(opsEl);
      const results = [];

      for (let i = 0; i < ops.length; i++) {
        const o = ops[i];
        if (o.type === 'doc') {
          const r = execDocOp(o);
          o.result = r; o.status = 'done';
          opsEl.innerHTML = msg.ops.map((x, j) => opHTML(x, j)).join('');
          results.push('【文档操作结果】' + o.op + ' 「' + o.title + '」→ ' + r);
          save();
        } else {
          const key = String(o.agent).replace(/^@/, '');
          const target = S.agents.find((x) => x.roleName === key) || S.agents.find((x) => x.name === key);
          if (!target) {
            o.status = 'error'; o.result = '未找到该 Agent（请检查 @角色名）。';
            opsEl.innerHTML = msg.ops.map((x, j) => opHTML(x, j)).join('');
            results.push('【派发失败】' + o.agent + ' 不存在。');
            continue;
          }
          o.status = 'running';
          opsEl.innerHTML = msg.ops.map((x, j) => opHTML(x, j)).join('');
          scrollDown();
          const pre = opsEl.querySelectorAll('.op')[i] ? opsEl.querySelectorAll('.op')[i].querySelectorAll('.prose')[1] : null;
          try {
            const subMsgs = [{ role: 'system', content: buildSystem(target) }, { role: 'user', content: o.task }];
            let acc = '', subUsage = null, last2 = 0;
            const t1 = now();
            const r = await streamChat(target, subMsgs, (c) => {
              acc += c;
              const t = now();
              if (t - last2 > 60) { last2 = t; if (pre) { pre.innerHTML = mdRender(stripDirectives(acc)) + '<span class="caret">▍</span>'; scrollDown(); } }
            }, ABORT.signal, (u) => { subUsage = u; });
            const dt1 = now() - t1;
            o.result = stripDirectives(r); o.status = 'done';
            bumpStats(topic, target, subUsage, subMsgs, r, dt1);
            refreshBubble();
            results.push('【' + target.name + ' @' + target.roleName + ' 的回执】\n' + o.result);
          } catch (e) {
            o.status = 'error'; o.result = '调用失败：' + (e.message || e);
            results.push('【' + target.name + ' 调用失败】' + (e.message || e));
          }
          opsEl.innerHTML = msg.ops.map((x, j) => opHTML(x, j)).join('');
          scrollDown();
        }
      }
      save();
      if (!results.length) break;
      if (round === maxRounds) {
        topic.messages.push({ role: 'user', content: '（系统）已达最大轮次，请直接给出最终答复。', _synthetic: true });
        break;
      }
      topic.messages.push({ role: 'user', content: '（系统回执，请据此继续；若已可收尾请直接输出最终答复）\n\n' + results.join('\n\n'), _synthetic: true });
    }
  } catch (e) {
    if (e && e.name === 'AbortError') {
      topic.messages.push({ role: 'assistant', content: '_已中止。_', ops: [], by: agent.id });
    } else {
      topic.messages.push({
        role: 'assistant', ops: [], by: agent.id,
        content: '⚠️ **调用失败**：' + (e.message || e) +
          '\n\n> 排查：API 地址是否正确、Key 是否有效、是否已拉取并选择模型。浏览器直连第三方接口若被 CORS 拦截，可换用支持浏览器直连的服务商，或自建一个本地代理。',
      });
      toast('调用失败：' + (e.message || e), 'err');
    }
  } finally {
    RUNNING = false; ABORT = null; save();
    renderChat();
  }
}

function persistCfg() {
  const p = getProvider(S.settings.activeProviderId);
  if (p) {
    const g = (id) => { const e = $(id); return e ? e.value : undefined; };
    if (g('#cfgName') !== undefined) p.name = g('#cfgName').trim() || '未命名配置';
    if (g('#cfgUrl') !== undefined) p.baseUrl = g('#cfgUrl').trim();
    if (g('#cfgKey') !== undefined) p.apiKey = g('#cfgKey').trim();
  }
  if ($('#cfgDefault')) S.settings.defaultModel = $('#cfgDefault').value;
  if ($('#cfgRounds')) S.settings.maxRounds = Math.max(1, Math.min(12, parseInt($('#cfgRounds').value, 10) || 6));
  const sb = S.settings.sandbox;
  if ($('#sbProvider')) sb.provider = $('#sbProvider').value;
  if ($('#sbEndpoint')) sb.endpoint = $('#sbEndpoint').value.trim();
  if ($('#sbKey')) sb.apiKey = $('#sbKey').value.trim();
}

function persistAgentTab(a, tab) {
  const g = (id) => { const e = $(id); return e ? e.value : null; };
  if (tab === 'base') {
    if (g('#fName') !== null) a.name = g('#fName').trim() || a.name;
    if (g('#fRole') !== null) {
      const r = g('#fRole').trim().replace(/^@/, '').replace(/[^\w\u4e00-\u9fa5-]/g, '');
      a.roleName = r || a.roleName;
    }
    if (g('#fDesc') !== null) a.desc = g('#fDesc').trim();
    if (g('#fPrompt') !== null) a.systemPrompt = g('#fPrompt');
    const u = g('#fAvatarUrl');
    if (u !== null && u.trim()) a.avatar = u.trim();
  } else if (tab === 'ability') {
    if (g('#fProv') !== null) a.providerId = g('#fProv');
    if (g('#fModel') !== null) a.model = g('#fModel');
  }
}

/* ------------------------- 全局事件 ------------------------- */
function wireGlobal() {
  document.addEventListener('click', async (e) => {
    const t = e.target;

    /* 提及 / 复制 */
    const copy = t.closest('.copybtn');
    if (copy) {
      const pre = copy.closest('pre');
      const code = pre && pre.querySelector('code');
      if (code) { try { await navigator.clipboard.writeText(code.textContent); } catch (x) {} }
      copy.textContent = '已复制'; setTimeout(() => { copy.textContent = '复制'; }, 1200);
      return;
    }
    const delSk = t.closest('[data-delskill]');
    if (delSk) {
      e.stopPropagation();
      const a = getAgent(S.ui.editAgentId) || curAgent();
      a.skills.splice(+delSk.dataset.delskill, 1); save(); renderTab(a, 'skills'); return;
    }
    const oh = t.closest('.oh');
    if (oh && !t.closest('[data-act]')) { oh.parentElement.classList.toggle('open'); return; }

    const fill = t.closest('[data-fill]');
    if (fill) { S.ui.drafting = fill.dataset.fill; const ta = $('#input'); if (ta) { ta.value = S.ui.drafting; ta.focus(); autoGrow(ta); } return; }

    const docEl = t.closest('[data-doc]');
    if (docEl) { saveDocIfDirty(); S.ui.activeDocId = docEl.dataset.doc; renderDocs(); return; }

    const agEl = t.closest('[data-agent]');
    if (agEl) {
      S.ui.activeAgentId = agEl.dataset.agent;
      S.ui.activeTopicId = null; S.ui.drafting = ''; S.ui.view = 'chat';
      hideMention(); save(); renderShell(); return;
    }

    const tabBtn = t.closest('[data-tab]');
    if (tabBtn) {
      const a = getAgent(S.ui.editAgentId) || curAgent();
      persistAgentTab(a, S.ui.editTab || 'base'); save();
      S.ui.editTab = tabBtn.dataset.tab; renderAgentEdit(); return;
    }

    const tgl = t.closest('[data-tool]');
    if (tgl) {
      const k = tgl.dataset.tool;
      if (k === 'sandbox' && S.ui.view === 'settings') { S.settings.sandbox.enabled = !S.settings.sandbox.enabled; save(); tgl.classList.toggle('on'); toast(S.settings.sandbox.enabled ? '云沙盒已启用' : '云沙盒已关闭'); return; }
      const a = getAgent(S.ui.editAgentId) || curAgent();
      persistAgentTab(a, 'ability');
      a.tools[k] = !a.tools[k]; save(); renderTab(a, 'ability'); return;
    }

    const em = t.closest('[data-emoji]');
    if (em) {
      if (em.closest('.mask')) return;              // 弹窗内的选择由弹窗自己处理
      const a = getAgent(S.ui.editAgentId) || curAgent();
      a.avatar = em.dataset.emoji; save(); renderTab(a, 'base'); renderShell(); return;
    }


    const mi = t.closest('[data-mention]');
    if (mi) return;

    const setDef = t.closest('[data-setdefault]');
    if (setDef) { e.preventDefault(); S.settings.defaultModel = setDef.dataset.setdefault; save(); renderSettings(); toast('默认模型：' + setDef.dataset.setdefault, 'ok'); return; }

    const act = t.closest('[data-act]');
    if (!act) return;
    await handleAct(act.dataset.act, e);
  });

  document.addEventListener('input', (e) => {
    if (e.target && e.target.id === 'agentSearch') {
      S.ui._q = e.target.value; renderAgentLists();
    }
  });

  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.id === 'avFile' && t.files && t.files[0]) {
      const f = t.files[0];
      if (f.size > 1200000) { toast('图片太大（>1.2MB），建议先用 URL', 'err'); return; }
      const fr = new FileReader();
      fr.onload = () => { const a = getAgent(S.ui.editAgentId) || curAgent(); a.avatar = fr.result; save(); renderTab(a, 'base'); renderShell(); };
      fr.readAsDataURL(f);
    }
    if (t.id === 'impFile' && t.files && t.files[0]) {
      const fr = new FileReader();
      fr.onload = () => {
        try {
          const o = JSON.parse(fr.result);
          localStorage.setItem(KEY, JSON.stringify(o));
          S = load(); save(); renderShell();
          toast('导入成功', 'ok');
        } catch (x) { toast('导入失败：文件不是合法 JSON', 'err'); }
      };
      fr.readAsText(t.files[0]);
    }
  });
}

function saveDocIfDirty() {
  if (S.ui.view !== 'docs') return;
  const d = findDoc(S.ui.activeDocId); if (!d) return;
  const t = $('#docTitle'), b = $('#docBody');
  if (t) d.title = t.value.trim() || d.title;
  if (b) d.content = b.value;
  d.updatedAt = now(); save();
}

async function handleAct(act, e) {
  const a0 = curAgent();
  switch (act) {
    case 'toggle-side': {
      S.ui.collapsed = !S.ui.collapsed;
      document.getElementById('app').classList.toggle('collapsed', S.ui.collapsed);
      save(); return;
    }
    case 'goto-chat': {
      if (S.ui.view === 'agent') { const a = getAgent(S.ui.editAgentId) || curAgent(); persistAgentTab(a, S.ui.editTab || 'base'); save(); }
      if (S.ui.view === 'docs') saveDocIfDirty();
      S.ui.view = 'chat'; save(); renderShell(); return;
    }
    case 'goto-docs': { saveDocIfDirty(); S.ui.view = 'docs'; save(); renderShell(); return; }
    case 'goto-settings': { if (S.ui.view === 'docs') saveDocIfDirty(); S.ui.view = 'settings'; save(); renderShell(); return; }
    case 'newtopic': { newTopic(a0.id); S.ui.drafting = ''; save(); renderShell(); return; }
    case 'editagent': { S.ui.editAgentId = a0.id; S.ui.editTab = 'base'; S.ui.view = 'agent'; save(); renderShell(); return; }
    case 'toggle-stats': { S.ui.statsOpen = !S.ui.statsOpen; save(); refreshBubble(); return; }
    case 'toggle-syntax': {
      const h = document.querySelector('.hint'); if (h) h.classList.toggle('show-syn');
      return;
    }
    case 'mention': { showMention(); return; }
    case 'evac': {
      const ta = $('#input');
      const roles = S.agents.filter((x) => x.id !== a0.id).map((x) => '@' + x.roleName).join(' ');
      if (ta) { ta.value = '请召集全员协作：' + (roles || '（暂无其他 Agent）') + ' 让他们各自从专业角度给出建议，最后汇总成一份文档。'; ta.focus(); autoGrow(ta); S.ui.drafting = ta.value; }
      return;
    }
    case 'send': { doSend(); return; }
    case 'addagent': { openNewAgentDialog(); return; }
    case 'newdoc': {
      const d = { id: uid('d'), title: '未命名文档', content: '', ownerId: S.ui.activeAgentId, shared: true, updatedAt: now() };
      S.docs.unshift(d); S.ui.activeDocId = d.id; save(); renderDocs();
      const t = $('#docTitle'); if (t) { t.focus(); t.select(); }
      return;
    }
    case 'saveDoc': { saveDoc(); return; }
    case 'delDoc': {
      const d = findDoc(S.ui.activeDocId); if (!d) return;
      modal('<h3>删除文档</h3><div class="dsc">确定删除「' + esc(d.title) + '」？不可恢复。</div>' +
        '<div class="act"><button class="btn" data-x="cancel">取消</button><button class="btn danger" data-x="ok">删除</button></div>',
        (m, close) => {
          m.addEventListener('click', (ev) => {
            const x = ev.target.closest('[data-x]'); if (!x) return;
            if (x.dataset.x === 'ok') { S.docs = S.docs.filter((y) => y.id !== d.id); S.ui.activeDocId = null; save(); renderDocs(); toast('已删除', 'ok'); }
            close();
          });
        });
      return;
    }
    case 'saveAgent': {
      const a = getAgent(S.ui.editAgentId) || curAgent();
      persistAgentTab(a, S.ui.editTab || 'base');
      if (!a.isMain) {
        const dup = S.agents.some((x) => x.id !== a.id && x.roleName === a.roleName);
        if (dup) { toast('角色名「' + a.roleName + '」已被占用，请换一个', 'err'); return; }
      }
      save(); renderShell(); toast('已保存「' + a.name + '」', 'ok'); return;
    }
    case 'delAgent': {
      const a = getAgent(S.ui.editAgentId); if (!a || a.isMain) return;
      modal('<h3>删除 Agent</h3><div class="dsc">确定删除「' + esc(a.name) + '」？其专属文档会保留为共享文档。</div>' +
        '<div class="act"><button class="btn" data-x="cancel">取消</button><button class="btn danger" data-x="ok">删除</button></div>',
        (m, close) => {
          m.addEventListener('click', (ev) => {
            const x = ev.target.closest('[data-x]'); if (!x) return;
            if (x.dataset.x === 'ok') {
              S.agents = S.agents.filter((y) => y.id !== a.id);
              S.topics = S.topics.filter((tp) => tp.agentId !== a.id);
              S.ui.activeAgentId = mainAgent().id; S.ui.activeTopicId = null; S.ui.view = 'chat';
              save(); renderShell(); toast('已删除', 'ok');
            }
            close();
          });
        });
      return;
    }
    case 'resetMainPrompt': {
      const a = getAgent(S.ui.editAgentId) || curAgent();
      a.systemPrompt = MAIN_PROMPT; save(); renderTab(a, 'base'); toast('已恢复默认', 'ok'); return;
    }
    case 'uploadAvatar': { const f = $('#avFile'); if (f) f.click(); return; }
    case 'clearAvatar': { const a = getAgent(S.ui.editAgentId) || curAgent(); a.avatar = '🤖'; save(); renderTab(a, 'base'); renderShell(); return; }
    case 'pullSkill': {
      const a = getAgent(S.ui.editAgentId) || curAgent();
      const input = $('#fSkillUrl');
      const raw = input ? input.value.trim() : '';
      if (!raw) { toast('请先填写地址', 'err'); return; }
      const url = normalizeSkillUrl(raw);
      const btn = e.target.closest('[data-act]');
      if (btn) { btn.disabled = true; btn.textContent = '拉取中…'; }
      try {
        const text = await fetchSkill(url);
        const s = parseSkill(text, url);
        a.skills = a.skills || [];
        const old = a.skills.findIndex((x) => x.name === s.name);
        if (old >= 0) a.skills[old] = s; else a.skills.push(s);
        save(); renderTab(a, 'skills'); toast('已装载 Skill：' + s.name, 'ok');
      } catch (err) {
        toast('拉取失败：' + (err.message || err), 'err');
        if (btn) { btn.disabled = false; btn.textContent = '拉取并装载'; }
      }
      return;
    }
    case 'addProvider': {
      const id = uid('pr');
      S.settings.providers.push({ id, name: '新配置', baseUrl: '', apiKey: '', models: [] });
      S.settings.activeProviderId = id; save(); renderSettings(); return;
    }
    case 'delProvider': {
      if (S.settings.providers.length <= 1) { toast('至少保留一个配置', 'err'); return; }
      const id = S.settings.activeProviderId;
      S.settings.providers = S.settings.providers.filter((p) => p.id !== id);
      S.settings.activeProviderId = S.settings.providers[0].id;
      save(); renderSettings(); return;
    }
    case 'pullModels': {
      persistCfg();
      const p = getProvider(S.settings.activeProviderId);
      const btn = e.target.closest('[data-act]');
      if (btn) { btn.disabled = true; btn.textContent = '拉取中…'; }
      try {
        const ids = await pullModels(p);
        ids.sort();
        p.models = ids;
        if (!S.settings.defaultModel || !ids.includes(S.settings.defaultModel)) S.settings.defaultModel = ids[0];
        save(); renderSettings(); toast('获取到 ' + ids.length + ' 个模型', 'ok');
      } catch (err) {
        toast('拉取失败：' + (err.message || err), 'err');
        if (btn) { btn.disabled = false; btn.textContent = '拉取可用模型'; }
      }
      return;
    }
    case 'testApi': {
      persistCfg();
      const p = getProvider(S.settings.activeProviderId);
      const btn = e.target.closest('[data-act]');
      if (btn) { btn.disabled = true; btn.textContent = '测试中…'; }
      try {
        const ids = await pullModels(p);
        toast('连通正常，可用模型 ' + ids.length + ' 个', 'ok');
      } catch (err) {
        toast('连通失败：' + (err.message || err), 'err');
      }
      if (btn) { btn.disabled = false; btn.textContent = '测试连通'; }
      return;
    }
    case 'exportData': {
      const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'agenthub-backup-' + Date.now() + '.json';
      a.click(); URL.revokeObjectURL(url); toast('已导出', 'ok'); return;
    }
    case 'importData': { const f = $('#impFile'); if (f) f.click(); return; }
    case 'resetAll': {
      modal('<h3>清空全部数据</h3><div class="dsc">将删除所有 Agent、文档与会话，恢复到初始状态。确定继续？</div>' +
        '<div class="act"><button class="btn" data-x="cancel">取消</button><button class="btn danger" data-x="ok">确认清空</button></div>',
        (m, close) => {
          m.addEventListener('click', (ev) => {
            const x = ev.target.closest('[data-x]'); if (!x) return;
            if (x.dataset.x === 'ok') { localStorage.removeItem(KEY); S = defaultState(); save(); renderShell(); toast('已重置', 'ok'); }
            close();
          });
        });
      return;
    }
  }
}

function openNewAgentDialog() {
  modal(
    '<h3>新建 Agent</h3><div class="dsc">创建后可随时修改名字、角色名、头像与 Skills。</div>' +
    '<div class="fld"><label>名字</label><input id="nName" placeholder="例如：调研员" value=""></div>' +
    '<div class="fld"><label>角色名（主模型派发时用 @角色名 识别）</label><input id="nRole" placeholder="例如：researcher" value=""></div>' +
    '<div class="fld"><label>一句话简介（可选）</label><input id="nDesc" placeholder="擅长什么"></div>' +
    '<div class="fld"><label>头像 Emoji</label><div class="emoji-grid" id="nEmoji">' +
      EMOJIS.slice(0, 20).map((x, i) => '<button data-emoji="' + x + '" class="' + (i === 1 ? 'on' : '') + '">' + x + '</button>').join('') + '</div></div>' +
    '<div class="act"><button class="btn" data-x="cancel">取消</button><button class="btn pri" data-x="ok">创建并进入设置</button></div>',
    (m, close) => {
      let avatar = EMOJIS[1];
      m.addEventListener('click', (ev) => {
        const em = ev.target.closest('[data-emoji]');
        if (em) {
          avatar = em.dataset.emoji;
          $$('[data-emoji]', m).forEach((b) => b.classList.remove('on')); em.classList.add('on'); return;
        }
        const x = ev.target.closest('[data-x]'); if (!x) return;
        if (x.dataset.x === 'ok') {
          const name = ($('#nName', m).value || '').trim();
          let role = ($('#nRole', m).value || '').trim().replace(/^@/, '').replace(/[^\w\u4e00-\u9fa5-]/g, '');
          if (!name) { toast('请填写名字', 'err'); return; }
          if (!role) role = 'agent' + (S.agents.length + 1);
          if (S.agents.some((y) => y.roleName === role)) { toast('角色名已被占用', 'err'); return; }
          const na = {
            id: uid('ag'), isMain: false, name, roleName: role, avatar,
            desc: ($('#nDesc', m).value || '').trim(),
            systemPrompt: '你是团队中的「' + name + '」。\n\n请专注你的职责，直接给出高质量、可用的结论；输出尽量结构化。\n\n如需沉淀成果，可以使用文档指令：<doc op="create" title="标题">内容</doc>。',
            providerId: '', model: '', skills: [],
            tools: { delegate: false, docs: true, sandbox: false, search: false },
          };
          S.agents.push(na);
          S.ui.editAgentId = na.id; S.ui.editTab = 'base'; S.ui.view = 'agent';
          save(); renderShell(); toast('已创建「' + name + '」', 'ok');
        }
        close();
      });
    }
  );
}

/* ------------------------- 启动 ------------------------- */
function boot() {
  S = load();
  if (!S.topics.length) ensureTopic(S.ui.activeAgentId);
  renderShell();
  wireGlobal();
  window.addEventListener('resize', () => { const ta = $('#input'); if (ta) autoGrow(ta); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { hideMention(); const m = $('.mask'); }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'b') {
      if (S.ui.view !== 'chat' && S.ui.view !== 'docs' && S.ui.view !== 'settings') return;
      e.preventDefault(); S.ui.collapsed = !S.ui.collapsed;
      document.getElementById('app').classList.toggle('collapsed', S.ui.collapsed); save();
    }
  });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

</script>
</body>
</html>
